[project]
name = "openlearn"
version = "0.16.0"
description = "Free curriculum for mathematics and algorithm mastery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.2",
    "pandas>=3.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8",
]

[tool.ruff]
# Course reference units are stubbed by marker and patched by committed
# mutants (course/DESIGN.md 5.2, 5.6): their bytes are pinned, so the
# formatter leaves them alone. The harness fixture course is pinned the same way,
# and course/contracts is pinned by its content hash in contracts/VERSION.
extend-exclude = [
    "course/ref",
    "course/contracts",
    "course/mutants",
    "practice/bin/tests/fixtures",
]

[tool.ruff.lint]
ignore = ["E402", "E722", "E741", "E711", "E731", "F811", "F821", "F841"]
