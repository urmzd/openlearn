[project]
name = "openlearn"
version = "0.26.0"
description = "A free manual for mathematics, algorithms, and engineering: worked solutions explained from first principles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.2",
    "pandas>=3.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8",
]

[tool.ruff]
# The worked solutions keep their original layout so chapters can quote them
# line for line.
extend-exclude = [
    "course/solutions",
    "course/contracts",
]

[tool.ruff.lint]
ignore = ["E402", "E722", "E741", "E711", "E731", "F811", "F821", "F841"]
