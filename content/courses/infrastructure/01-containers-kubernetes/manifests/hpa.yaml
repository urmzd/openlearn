# HorizontalPodAutoscaler for the STATELESS api Deployment.
# CPU is a fine load proxy for a request/response service, so a plain HPA works
# here. (For the queue WORKER, CPU is a terrible proxy -- an idle worker can sit
# behind millions of messages -- so that scales on Kafka lag via KEDA instead;
# see keda-scaledobject.yaml.)
#
# Apply:  kubectl apply -f hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: streamflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleDown:
      # Scale in slowly to avoid thrashing on spiky traffic.
      stabilizationWindowSeconds: 300
      policies:
        - { type: Percent, value: 50, periodSeconds: 60 }
    scaleUp:
      # Scale out fast when load arrives.
      stabilizationWindowSeconds: 0
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
