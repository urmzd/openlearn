# MS-P1: the Pass 1 gate (DESIGN 5.7 milestone catalog, 7.2, 7.4).
# Page: paths/course-p01-tracer/milestone.md
#
# Every core layer of the tracer is yours and runs end to end: your byte bigram
# (L0.0) and Python matrix operations (M03.1), served by your Rust engine
# (L10.0) behind your Go gateway (gw.00), deployed on kind (dep.00), traced in
# Jaeger (obs.00), kept alive by your runbook (ops.00), and explained by your
# ADR-0001 (craft.02).
#
# Your system.toml must declare (spec/cli-roles.md, DESIGN 2.16):
#   [build].steps        build the engine and the gateway, and
#                        train the model directory your engine entry serves
#   [entry].tinyllm      the Python CLI (train bigram, generate)
#   [entry].engine       tracer form: --model-dir <your trained dir> --port {port} --health-port {health_port}
#   [entry].gateway      tracer form: --port {port} --health-port {health_port} --upstream http://127.0.0.1:{engine.port}
#   [services.engine]    health = "http://127.0.0.1:{health_port}/healthz"
#   [services.gateway]   health = "http://127.0.0.1:{health_port}/readyz", after = ["engine"]
#   [endpoints]          api_key_env (default TL_API_KEY; export a key in it)
#   [deploy]             kube_context, namespace, gateway_url (NodePort 30080),
#                        traces (Jaeger query, NodePort 30686), services.engine
#
# `ol milestone MS-P1 --smoke` runs the smoke steps as local processes (PR CI).
# Without --smoke the kind steps run too, against the cluster in [deploy].
# Every later pass gate reruns the smoke steps (the spiral invariant).
id       = "MS-P1"
title    = "Tracer: every layer is yours and runs end to end"
requires = ["M03.1", "L0.0", "lang.04", "lang.05", "L10.0", "lang.06", "gw.00",
            "lang.07", "dep.00", "obs.00", "ops.00", "craft.02"]
pass     = 1
ci       = "pr"
services = ["engine", "gateway"]

# -- your entry points, from a clean shell (local processes) -------------------

# The count-MLE NLL of the add-one bigram on the fixture corpus is 3.199389
# nats per byte (course/oracle/MS-P1/bigram_greedy.py); 1e-3 covers float32.
[[step]]
name     = "train-bigram"
smoke    = true
services = []
run      = "tinyllm"
argv     = ["train", "bigram", "--data", "{fixture:MS-P1/corpus.txt}", "--out", "{out}", "--alpha", "1"]
expect   = { match = "json-last-line", metrics = { nll = "<= 3.2004" } }
timeout_s = 120

# Greedy decoding of a bigram reads one row of counts per step, so the ids are
# exact: " the the the ..." (the top-2 margin on the path is 0.74 nats).
[[step]]
name     = "greedy-from-your-checkpoint"
smoke    = true
services = []
run      = "tinyllm"
argv     = ["generate", "--model", "{out:train-bigram}", "--prompt", "Once", "--max-tokens", "32", "--greedy"]
expect   = { match = "tokens-equal", file = "course/fixtures/MS-P1/greedy_once_32.json" }
timeout_s = 120

[[step]]
name     = "engine-conforms-openapi-v0"
smoke    = true
services = ["engine"]
expect   = { match = "suite", suite = "openapi:v0:engine" }

[[step]]
name   = "gateway-conforms-openapi-v0"
smoke  = true
expect = { match = "suite", suite = "openapi:v0:gateway" }

# One chunk per token; a chunk is empty while a UTF-8 character is incomplete,
# so 48 tokens leave room for multi-byte text and still show 32 content chunks.
[[step]]
name   = "stream-through-your-gateway"
smoke  = true
http   = { method = "POST", url = "{gateway.api_base}/completions", auth = true, json = { model = "tracer", prompt = "Once", max_tokens = 48, temperature = 0, stream = true } }
expect = { match = "sse", min_chunks = 32 }

# -- your documents (full runs) -----------------------------------------------
# `requires` already holds the verdicts of craft.02 (the ADR lint) and ops.00
# (the drill, graded with its postmortem); these steps catch a file deleted
# after the verdict was earned.

[[step]]
name     = "adr-0001-present"
services = []
expect   = { match = "file-produced", glob = "docs/adr/0001-*.md", contains = "## Decision" }

[[step]]
name     = "engine-crashloop-runbook-present"
services = []
expect   = { match = "file-produced", glob = "docs/runbooks/engine-crashloop.md", contains = "Mitigation" }

# -- on kind (full runs; the milestone-p1-kind CI job) ----------------------------

[[step]]
name   = "stream-through-the-kind-nodeport"
ci     = "kind"
http   = { method = "POST", url = "{deploy.gateway_url}/v1/completions", auth = true, json = { model = "tracer", prompt = "Once", max_tokens = 48, temperature = 0, stream = true } }
expect = { match = "sse", min_chunks = 32 }

# The gateway's CLIENT span `gateway.proxy` is the parent of the engine's SERVER
# span `POST /v1/completions` (spec/cli-roles.md, obs.00). Your charts set
# OTEL_SERVICE_NAME to <system>-gateway and <system>-engine.
[[step]]
name   = "one-trace-spans-gateway-and-engine"
ci     = "kind"
expect = { match = "trace", service = "{system}-gateway", services = ["{system}-gateway", "{system}-engine"], spans = ["gateway.proxy", "POST /v1/completions"], parents = [["POST /v1/completions", "gateway.proxy"]] }
