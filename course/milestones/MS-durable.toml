# -- PENDING: TrainRun under kills -------------------------------------------------------
# The runner side exists ({json:<step>.<key>} reads the uninterrupted run's
# final line). The reference fails it without any kill: a second TrainRun of
# specs/tiny.json (any workflow id) writes the same runs/tiny directory,
# resumes from the first run's step-000020 checkpoint, trains no step, and
# its final.json has loss NaN (`ctl: runs/tiny/final.json has no loss`). It
# joins once a TrainRun resumes only its own checkpoints (for example a run
# directory per workflow id) or the milestone gets a second spec.
