# MS-durable: the durable execution component milestone (DESIGN 4.4
# "MS-durable", 5.7 catalog). MS-P8 includes it. Page:
# content/courses/build-an-llm/paths/course-p08-durable/milestone.md (owned by the pass gate's author).
#
# Your durable server, your worker, and the Python activities it execs run
# workflows to completion through your own CLI: a start is idempotent, the
# history is recorded, CorpusBuild produces the same corpus as the direct
# `{corpus} run` of MS-corpus, and a short TrainRun finishes. On kind the
# durable StatefulSet and the KEDA-scaled workers (dep.06) carry a queue
# burst with control-plane traces (obs.05), and the drills durable-kill9
# (ops.02) and poison-task (ops.03) are resolved.
#
# The design's kill loop (500 tl.test.Append activities with SIGKILLs of
# {durable}, {worker}, and the Python children, exactly-once effects in the
# testkit `effects` sink, then CorpusBuild and TrainRun under kills with
# outputs equal to uninterrupted runs) uses the runner's `chaos` and `sink`
# step keys and the `effects` matcher (DESIGN 5.7). Section 4 runs all
# three: CorpusBuild under kills of both services, 500 appends of your
# worker's tl.test.Batch under kills of both, exactly once in the sink, and
# TrainRun under kills of the worker, with the steps and final loss of the
# uninterrupted run. The same invariants are checked one level down by the
# course tests in `requires`: dur.01 (KillLoop over the log), dur.03 (poison
# task, stale lease), dur.04 and dur.05 (KillLoop over a worker with the
# effects sink), dur.06 (kill the server mid-workflow and replay), dur.09
# (SIGKILL a worker mid-activity, resume from the checkpoint).
#
# This file fixes the Pass 8 verbs of your `ctl` role (spec/cli-roles.md,
# "Verbs of later passes"). Every verb keeps the rules of that page: exit 2
# on a usage error, exit 1 on an RPC error with its gRPC code and message on
# stderr, the last stdout line is one JSON object. `--durable <host:port>`
# names the server (default $TL_DURABLE_ADDR, else 127.0.0.1:7233). Status
# names drop the proto prefix: RUNNING, COMPLETED, FAILED, CANCELED,
# CONTINUED_AS_NEW.
#
#   {ctl} wf start <type> --id <workflow id> [--input-json <json>] [--queue <q>] [--wait] [--json]
#       StartWorkflow (task queue default "default", input the JSON bytes,
#       default null); with --wait, DescribeWorkflow until the run is not
#       RUNNING. Final line: {"workflow_id", "run_id", "started", "status",
#       "result"} where started is StartWorkflowResponse.started and result
#       is the run's result parsed as JSON (null until COMPLETED).
#       SleepDemo is registered with the durable timers: input JSON is an
#       integer duration in milliseconds and its result is the fired time.
#       tl.test.Batch (input N) runs N tl.test.Append activities with the
#       SDK's activity ids 1 to N, so the effects sink receives the keys
#       "<workflow id>/1" to "<workflow id>/N"; each append holds 100 ms
#       after its effect (a kill then lands between effect and completion);
#       its result is N. --wait polls through a server that answers
#       Unavailable while it restarts, for up to 2 minutes in a row.
#   {ctl} wf describe <workflow id> --json
#       DescribeWorkflow. Final line: {"workflow_id", "run_id", "status",
#       "history_length", "pending_activities", "dead_lettered"} (the last two
#       are counts).
#   {ctl} wf history <workflow id> --json
#       GetHistory, every page: one JSON line per event {"event_id", "type"}
#       (type is the HistoryEvent attribute name, e.g.
#       "WorkflowExecutionStarted"), then a final line {"events": N,
#       "first": "<type>", "last": "<type>"}.
#   {ctl} wf dlq list <queue> --json
#       ListDeadLetters, every page: one JSON line per dead letter
#       {"task_id", "workflow_id", "activity_type", "attempts"}, then
#       {"queue", "count"}.
#   {ctl} wf dlq redrive <queue> (--all | <task id>...) --json
#       RedriveDeadLetter. Final line: {"queue", "redriven"}.
#   {ctl} data build --config <corpus toml> --id <workflow id> [--wait] [--json]
#       Starts CorpusBuild (data.09) on the config. With --wait, the final
#       line is the CorpusBuild result: MS-corpus's RUN-<dataset>-<version>
#       object (the same keys and values as `{corpus} run`) plus
#       "workflow_id" and "status".
#   {ctl} train --spec <file> --id <workflow id> [--wait] [--json]
#       Starts TrainRun (dur.11) on a train spec (formats/train-spec.schema.json).
#       A spec without "out" gets out = "runs/<workflow id>", so a run
#       resumes only its own checkpoints. With --wait, the final line is
#       {"workflow_id", "status", "steps", "final_loss", "ckpt"}; the loss is
#       the run directory's final.json, the same after a retry that resumed
#       from the final checkpoint.
#
# Your system.toml must declare:
#   [entry].durable, [entry].worker, [entry].ctl
#   [services.durable]  health = "http://127.0.0.1:{health_port}/healthz"; its
#                       config template puts the WAL under {data}
#   [services.worker]   after = ["durable"], argv `--queue default --durable
#                       127.0.0.1:{durable.grpc_port} --test-activities` plus
#                       queue `data` for CorpusBuild, and an artifacts root
#                       of {data} (the subprocess contract's /artifacts), so
#                       the files land in {worker.data}
#   specs/tiny.json     your TrainRun spec: a few hundred thousand parameters,
#                       20 steps, its data the tokens CorpusBuild wrote
#                       (paths relative to the artifacts root:
#                       "tokens/bytes/small/train-00000.bin")
#   [deploy]            as for MS-prod, plus services.durable =
#                       "statefulset/<system>-durable" and services.worker =
#                       "deploy/<system>-worker" (dep.06); the durable NodePort
#                       is 30733 (dep.02)
#
# `ol milestone MS-durable --smoke` runs the local steps with the
# services started by the runner. The full run (nightly kind job, or your own
# cluster) adds the `ci = "kind"` steps; without a cluster they are skipped
# and the verdict is `incomplete`.
id       = "MS-durable"
title    = "Your durable engine runs workflows to completion through your CLI, locally and on kind"
# The local run exercises the workflow service (dur.02) and a durable timer
# (dur.07) along with the complete CorpusBuild and TrainRun paths.
requires = ["dur.01", "dur.02", "dur.03", "dur.04", "dur.05", "dur.06", "dur.07", "dur.08", "dur.09", "data.09", "dur.11", "dep.06", "obs.05", "craft.21", "ops.02", "ops.03"]
pass     = 8
ci       = "pr"
services = ["durable", "worker"]

# -- 1. one workflow, start to finish ----------------------------------------------

[[step]]
name      = "echo-completes"
smoke     = true
run       = "ctl"
argv      = ["wf", "start", "Echo", "--id", "ms-durable-echo", "--input-json", "\"hi\"", "--durable", "127.0.0.1:{durable.grpc_port}", "--wait", "--json"]
expect    = { match = "json-schema", schema = { type = "object", required = ["workflow_id", "run_id", "started", "status", "result"], properties = { workflow_id = { const = "ms-durable-echo" }, started = { const = true }, status = { const = "COMPLETED" }, result = { const = "hi" } } } }
timeout_s = 60

# The same start again finds the existing run: no second WorkflowExecutionStarted.
[[step]]
name      = "start-is-idempotent"
smoke     = true
run       = "ctl"
argv      = ["wf", "start", "Echo", "--id", "ms-durable-echo", "--input-json", "\"hi\"", "--durable", "127.0.0.1:{durable.grpc_port}", "--wait", "--json"]
expect    = { match = "json-schema", schema = { type = "object", required = ["started", "status"], properties = { started = { const = false }, status = { const = "COMPLETED" } } } }
timeout_s = 60

[[step]]
name      = "history-is-recorded"
smoke     = true
run       = "ctl"
argv      = ["wf", "history", "ms-durable-echo", "--durable", "127.0.0.1:{durable.grpc_port}", "--json"]
expect    = { match = "json-schema", schema = { type = "object", required = ["events", "first", "last"], properties = { events = { type = "integer", minimum = 3 }, first = { const = "WorkflowExecutionStarted" }, last = { const = "WorkflowExecutionCompleted" } } } }
timeout_s = 30

[[step]]
name      = "durable-timer-completes"
smoke     = true
run       = "ctl"
argv      = ["wf", "start", "SleepDemo", "--id", "ms-durable-sleep", "--input-json", "1000", "--durable", "127.0.0.1:{durable.grpc_port}", "--wait", "--json"]
expect    = { match = "json-schema", schema = { type = "object", required = ["workflow_id", "status", "result"], properties = { workflow_id = { const = "ms-durable-sleep" }, status = { const = "COMPLETED" }, result = { type = "integer", minimum = 1 } } } }
timeout_s = 30

# -- 2. the platform workflows --------------------------------------------------------
# CorpusBuild cleans the MS-corpus fixture through the durable engine: every
# stage is a subprocess activity, and the result is the corpus `{corpus} run`
# produces directly (the numbers MS-corpus fixes).

[[step]]
name      = "corpus-build-through-durable"
smoke     = true
run       = "ctl"
argv      = ["data", "build", "--config", "{fixture:MS-corpus/corpus.toml}", "--id", "ms-durable-corpus", "--durable", "127.0.0.1:{durable.grpc_port}", "--wait", "--json"]
expect    = { match = "json-last-line", metrics = { n_docs = "== 169", n_shards = "== 3", exact_dropped = "== 4", near_dropped = "== 5", decontaminated = "== 3", pii_redactions = "== 5", train_tokens = "== 75164", val_tokens = "== 6868" } }
timeout_s = 600

[[step]]
name      = "no-dead-letters-after-the-build"
smoke     = true
run       = "ctl"
argv      = ["wf", "dlq", "list", "data", "--durable", "127.0.0.1:{durable.grpc_port}", "--json"]
expect    = { match = "json-last-line", metrics = { count = "== 0" } }
timeout_s = 30

[[step]]
name      = "train-run-through-durable"
smoke     = true
run       = "ctl"
argv      = ["train", "--spec", "specs/tiny.json", "--id", "ms-durable-train", "--durable", "127.0.0.1:{durable.grpc_port}", "--wait", "--json"]
expect    = { match = "json-schema", schema = { type = "object", required = ["status", "steps", "final_loss"], properties = { status = { const = "COMPLETED" }, steps = { type = "integer", minimum = 1 }, final_loss = { type = "number" } } } }
timeout_s = 600

# -- 3. on kind (dep.06, obs.05) -------------------------------------------------------

[[step]]
name   = "durable-statefulset-ready"
ci     = "kind"
expect = { match = "promql", query = "sum(kube_statefulset_status_replicas_ready{namespace=\"{deploy.namespace}\",statefulset=\"{system}-durable\"})", bound = ">= 1" }

[[step]]
name   = "worker-deployed"
ci     = "kind"
expect = { match = "promql", query = "sum(kube_deployment_status_replicas_available{namespace=\"{deploy.namespace}\",deployment=\"{system}-worker\"})", bound = ">= 1" }

# A queue burst through the NodePort: CorpusBuild's shard tasks on queue
# `data` make KEDA scale the workers out (dep.06's worked example), and the
# build still completes with the MS-corpus numbers.
[[step]]
name      = "corpus-build-on-kind"
ci        = "kind"
run       = "ctl"
argv      = ["data", "build", "--config", "{fixture:MS-corpus/corpus.toml}", "--id", "ms-durable-corpus-kind", "--durable", "127.0.0.1:30733", "--wait", "--json"]
expect    = { match = "json-last-line", metrics = { n_docs = "== 169", n_shards = "== 3", train_tokens = "== 75164", val_tokens = "== 6868" } }
timeout_s = 900

[[step]]
name   = "keda-scaled-the-workers-out"
ci     = "kind"
expect = { match = "promql", query = "max_over_time(sum(kube_deployment_spec_replicas{namespace=\"{deploy.namespace}\",deployment=\"{system}-worker\"})[15m:15s])", bound = ">= 2" }

[[step]]
name   = "queues-drained"
ci     = "kind"
expect = { match = "promql", query = "(sum(tl_durable_task_queue_depth{namespace=\"{deploy.namespace}\"}) or vector(0)) + (sum(tl_durable_dlq_size{namespace=\"{deploy.namespace}\"}) or vector(0))", bound = "== 0" }

# One CorpusBuild trace from the CLI's start down to a Python stage
# (otel/semconv.md: workflow, activity, corpus.stage).
[[step]]
name   = "control-plane-trace"
ci     = "kind"
[step.expect]
match      = "trace"
service    = "{system}-worker"
services   = ["{system}-worker", "{system}-python"]
spans      = ["workflow CorpusBuild", "activity shard", "corpus.stage shard"]
parents    = [["activity shard", "workflow CorpusBuild"], ["corpus.stage shard", "activity shard"]]
lookback_s = 1800

# -- 4. under kills (sink and chaos step keys, DESIGN 5.7) ------------------------------
# The runner SIGKILLs the named services (their whole process groups: the
# worker's Python activities die with it) on a seeded schedule while the
# command runs, restarts each with the same ports, runtime.toml, and WAL
# directory, and waits for its health check. The build finishes with exactly
# the corpus of the uninterrupted run above. Not smoke: an activity killed
# mid-run is redelivered after its heartbeat timeout (2 min for the corpus
# stages), so the step takes about two minutes on the reference.

[[step]]
name      = "corpus-build-survives-kills"
run       = "ctl"
argv      = ["data", "build", "--config", "{fixture:MS-corpus/corpus.toml}", "--id", "ms-durable-corpus-kill", "--durable", "127.0.0.1:{durable.grpc_port}", "--wait", "--json"]
chaos     = { kill = ["durable", "worker"], every_s = "0.2..1", count = 6, seed = 2 }
expect    = { match = "json-last-line", metrics = { n_docs = "== 169", n_shards = "== 3", train_tokens = "== 75164", val_tokens = "== 6868" } }
timeout_s = 900

# -- 500 appends under kills, exactly once ----------------------------------------------
# The worker's tl.test.Batch schedules 500 tl.test.Append activities, ids 1
# to 500 (the SDK numbers activity ids from 1), so the sink's keys are
# "ms-durable-kill/1" to "ms-durable-kill/500". Each append holds 100 ms
# after its effect, so a kill of the worker lands between an effect and its
# completion: every key is applied once, nothing else appears under the
# workflow's prefix, and at least one key was delivered again. Not smoke:
# the step takes about 45 s on the reference (17 kills, 505 deliveries).

[[step]]
name      = "kill-loop-500-appends-exactly-once"
sink      = "effects"
run       = "ctl"
argv      = ["wf", "start", "tl.test.Batch", "--id", "ms-durable-kill", "--input-json", "500", "--durable", "127.0.0.1:{durable.grpc_port}", "--wait", "--json"]
chaos     = { kill = ["durable", "worker"], every_s = "1..4", count = 20, seed = 1 }
expect    = { match = "effects", keys = "1..500", prefix = "ms-durable-kill/", exactly_once = true, min_redelivered = 1 }
timeout_s = 900

# -- TrainRun under kills ----------------------------------------------------------------
# The same spec under another workflow id trains in its own run directory
# (ctl puts it at runs/<workflow id>), with the worker killed while it trains;
# it ends with the steps and exactly the final loss of the uninterrupted run
# above ({json:<step>.<key>} reads that run's final line). Not smoke: a train
# activity killed mid-run is redelivered after its 1 min heartbeat timeout.

[[step]]
name      = "train-run-survives-kills"
run       = "ctl"
argv      = ["train", "--spec", "specs/tiny.json", "--id", "ms-durable-train-kill", "--durable", "127.0.0.1:{durable.grpc_port}", "--wait", "--json"]
chaos     = { kill = ["worker"], every_s = "0.1..0.4", count = 3, seed = 3 }
expect    = { match = "json-last-line", metrics = { steps = "== {json:train-run-through-durable.steps}", final_loss = "== {json:train-run-through-durable.final_loss}" } }
timeout_s = 900
