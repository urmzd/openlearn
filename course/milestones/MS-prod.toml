# MS-prod: production on kind, a component milestone of the Pass 7 gate
# (DESIGN 4.5 "MS-prod", 5.7 catalog, 7.4). MS-P7 = MS-L10 + MS-gateway + MS-prod.
# Page: content/courses/build-an-llm/paths/course-p07-serving-platform/milestone.md (B9 paths work).
#
# Your serving platform runs on your kind cluster the way it would in
# production: your gateway (1 replica) in front of your engines deployed as
# 1 prefill + 2 decode, the observability stack (collector, Prometheus with
# your SLO rules, Tempo, Grafana) scraping and tracing it, your load
# generator holding the SLO rate within budget, and drill ops.01 (a decode
# pod killed mid-load) resolved within the error budget. The unified
# bring-up that comes first is graded by dep.03's check; this milestone
# checks the production topology (DEVIATIONS B96-04).
#
# Your system.toml must declare (spec/cli-roles.md, DESIGN 2.16):
#   [entry].loadgen      `{loadgen} --target <base url> --rate <rps> --duration <d>`;
#                        it sends the API key from $TL_API_KEY ([endpoints].api_key_env)
#                        and prints its report (formats/loadgen-report.schema.json)
#                        as the final JSON line of stdout
#   [entry].engine, [entry].gateway and [services.*]   as for MS-L10 and MS-gateway
#                        (the local smoke step starts them)
#   [deploy]             kube_context ("kind-<system>"), namespace ("<system>"),
#                        gateway_url  (NodePort 30080: "http://127.0.0.1:30080"),
#                        prometheus   (NodePort 30090: "http://127.0.0.1:30090"),
#                        traces       (Tempo query API, NodePort 30320),
#                        services     = { gateway = "deploy/<system>-gateway",
#                                         prefill = "deploy/<system>-engine-prefill",
#                                         decode  = "deploy/<system>-engine-decode" }
# Names the queries below rely on (DESIGN 2.13, contracts/helm/observability.md):
# Deployments and Services <system>-gateway, <system>-engine-prefill,
# <system>-engine-decode in [deploy].namespace; every Service scraped on :9464
# by a ServiceMonitor labelled release: observability (so its series carry
# `namespace` and `service` labels); OTEL_SERVICE_NAME <system>-gateway and
# <system>-engine; your PrometheusRules rendered from slo.yaml with the
# `prod` window profile and the label release: observability.
#
# SLO bounds are the course defaults of DESIGN 2.11 (TTFT p95 0.5 s, TPOT p95
# 60 ms at 4 rps, 5xx ratio under 0.5%); scaling them by the in-cluster
# calibration (ol bench --calibrate --in-cluster) is a harness change that
# has not landed (DEVIATIONS B96-05): until it does, a slower machine than the
# reference Mac can miss these bounds with a correct system.
#
# `ol milestone MS-prod --smoke` (PR CI, through MS-P7 --smoke) runs the four
# local steps: your SLO and rule files, and a short load through your gateway
# started as local processes. The full run (nightly kind job, or your own
# cluster) adds every `ci = "kind"` step; without a reachable cluster they are
# skipped and the verdict is `incomplete`. The drill and the nightly modules
# in `requires` are graded on a cluster too, so --smoke does not wait for them.
id       = "MS-prod"
title    = "Production on kind: your gateway, disaggregated engines, and observability hold the SLOs"
requires = ["load.01",
            "dep.01", "dep.02", "dep.03", "dep.04", "dep.05",
            "obs.01", "obs.02", "obs.03", "obs.04",
            "ops.01", "craft.08", "review.01"]
pass     = 7
ci       = "nightly"
services = ["engine", "gateway"]

# -- your files (local, smoke) ---------------------------------------------------
# The verdicts of obs.03 (promtool rule tests) and dep.03 (chart policy) are in
# `requires`; these steps catch a file deleted or renamed after they passed.

[[step]]
name     = "slo-file-declares-the-six-alerts"
smoke    = true
ci       = "pr"
services = []
expect   = { match = "file-produced", glob = "deploy/observability/slo.yaml", contains = "AvailabilityBudgetBurnSlow" }

[[step]]
name     = "slo-rules-carry-the-stack-selector"
smoke    = true
ci       = "pr"
services = []
expect   = { match = "file-produced", glob = "deploy/observability/rules/*.yaml", contains = "release: observability" }

[[step]]
name     = "engine-chart-has-the-contract-schema"
smoke    = true
ci       = "pr"
services = []
expect   = { match = "file-produced", glob = "deploy/helm/*-engine/values.schema.json", contains = "\"role\"" }

# Open-loop load through your gateway started locally (ports allocated by the
# runner): the same command as on kind, at a lower rate and for less time.
[[step]]
name       = "local-load-through-your-gateway"
smoke      = true
ci         = "pr"
run        = "loadgen"
argv       = ["--target", "http://127.0.0.1:{gateway.port}", "--rate", "{rate}", "--duration", "{duration}"]
# The local probe stays within the reference conformance key's 60 RPM.
# The production SLO test below uses a separate key at the full load rate.
vars       = { rate = "1", duration = "60s" }
smoke_vars = { rate = "2", duration = "10s" }
expect     = { match = "json-last-line", metrics = { error_rate = "<= 0.005", requests = ">= 10" } }
timeout_s  = 180

# -- the production topology on kind ---------------------------------------------
# kube-state-metrics (part of kube-prometheus-stack) reports each Deployment's
# available replicas: the gateway, one prefill engine, two decode engines.

[[step]]
name   = "gateway-deployed"
ci     = "kind"
expect = { match = "promql", query = "sum(kube_deployment_status_replicas_available{namespace=\"{deploy.namespace}\",deployment=\"{system}-gateway\"})", bound = "== 1" }

[[step]]
name   = "prefill-engine-deployed"
ci     = "kind"
expect = { match = "promql", query = "sum(kube_deployment_status_replicas_available{namespace=\"{deploy.namespace}\",deployment=\"{system}-engine-prefill\"})", bound = ">= 1" }

[[step]]
name   = "two-decode-engines-deployed"
ci     = "kind"
expect = { match = "promql", query = "sum(kube_deployment_status_replicas_available{namespace=\"{deploy.namespace}\",deployment=\"{system}-engine-decode\"})", bound = ">= 2" }

# The OpenAI subset, v1, through the NodePort: auth, limits, cache, headers,
# streaming, `priority.internal` (cases that need a later module report pending).
[[step]]
name   = "gateway-conforms-openapi-v1-on-kind"
ci     = "kind"
expect = { match = "suite", suite = "openapi:v1:gateway" }

# -- load at the SLO rate, then the SLOs as your Prometheus sees them -------------

[[step]]
name      = "load-test-key"
ci        = "kind"
http      = { method = "POST", url = "{deploy.gateway_url}/admin/v1/keys", auth = true, json = { tenant = "load-test", name = "MS-prod performance", scopes = ["infer"], models = ["{endpoints.model}"], rpm = 600, tpm = 1000000 } }
expect    = { match = "json-schema", status = 201, schema = { type = "object", required = ["key"], properties = { key = { type = "string", minLength = 1 } } } }

[[step]]
name      = "load-at-the-slo-rate"
ci        = "kind"
run       = "loadgen"
argv      = ["--target", "{deploy.gateway_url}", "--rate", "{rate}", "--duration", "{duration}", "--api-key-env", "TL_LOADGEN_API_KEY"]
vars      = { rate = "4", duration = "300s" }
env       = { TL_LOADGEN_API_KEY = "{json:load-test-key.key}" }
expect    = { match = "json-last-line", metrics = { error_rate = "<= 0.005", requests = ">= 1000" } }
timeout_s = 420

# The client-facing view is the gateway's: its Service's histograms over the
# five minutes the load ran.
[[step]]
name   = "ttft-p95-within-slo"
ci     = "kind"
expect = { match = "promql", query = "histogram_quantile(0.95, sum by (le) (rate(gen_ai_server_time_to_first_token_seconds_bucket{namespace=\"{deploy.namespace}\",service=\"{system}-gateway\"}[5m])))", bound = "< 0.5" }

[[step]]
name   = "tpot-p95-within-slo"
ci     = "kind"
expect = { match = "promql", query = "histogram_quantile(0.95, sum by (le) (rate(gen_ai_server_time_per_output_token_seconds_bucket{namespace=\"{deploy.namespace}\",service=\"{system}-gateway\"}[5m])))", bound = "< 0.06" }

[[step]]
name   = "error-ratio-within-slo"
ci     = "kind"
expect = { match = "promql", query = "(sum(rate(http_server_request_duration_seconds_count{namespace=\"{deploy.namespace}\",service=\"{system}-gateway\",http_response_status_code=~\"5..\"}[5m])) or vector(0)) / sum(rate(http_server_request_duration_seconds_count{namespace=\"{deploy.namespace}\",service=\"{system}-gateway\"}[5m]))", bound = "< 0.005" }

# -- contract metrics, SLO rules, traces ------------------------------------------
# Every series below is in otel/metrics.yaml and exists after the load run in
# the disaggregated topology (tl_kv_transfer_bytes_total needs a prefill to
# decode transfer).

[[step]]
name   = "contract-metrics-scraped"
ci     = "kind"
matrix = { metric = ["gen_ai_server_time_to_first_token_seconds_bucket", "gen_ai_server_time_per_output_token_seconds_bucket",
                     "gen_ai_server_request_duration_seconds_bucket", "gen_ai_client_token_usage_bucket",
                     "http_server_request_duration_seconds_count", "tl_engine_kv_blocks", "tl_engine_queue_depth",
                     "tl_engine_active_sequences", "tl_engine_batch_tokens", "tl_kv_transfer_bytes_total",
                     "tl_gateway_requests_total", "tl_gateway_workers"] }
expect = { match = "promql", query = "count({metric}{namespace=\"{deploy.namespace}\"})", bound = ">= 1" }

# Prometheus loads a PrometheusRule only when its labels match the stack's rule
# selector; the six alert names are fixed by otel/slo.schema.json, and none of
# the loaded rules may be in error.
[[step]]
name   = "slo-rules-loaded"
ci     = "kind"
http   = { method = "GET", url = "{deploy.prometheus}/api/v1/rules?type=alert" }
expect = { match = "regex", pattern = '(?s)\A(?!.*"health":"err")(?=.*"name":"TTFTBudgetBurnFast")(?=.*"name":"TTFTBudgetBurnSlow")(?=.*"name":"TPOTBudgetBurnFast")(?=.*"name":"TPOTBudgetBurnSlow")(?=.*"name":"AvailabilityBudgetBurnFast")(?=.*"name":"AvailabilityBudgetBurnSlow")' }

[[step]]
name   = "no-burn-alert-firing"
ci     = "kind"
expect = { match = "promql", query = "count(ALERTS{alertstate=\"firing\",alertname=~\"(TTFT|TPOT|Availability)BudgetBurn(Fast|Slow)\"}) or vector(0)", bound = "== 0" }

# One request's trace through the disaggregated path (otel/semconv.md, "The
# serving trace, by example"), from the requests of this run.
[[step]]
name   = "disaggregated-serving-trace"
ci     = "kind"
[step.expect]
match      = "trace"
service    = "{system}-gateway"
services   = ["{system}-gateway", "{system}-engine"]
spans      = ["gateway.route", "tl.engine.v1.EngineControl/Prefill", "engine.prefill", "kv.transfer", "gateway.proxy", "engine.decode"]
parents    = [["gateway.proxy", "gateway.route"], ["tl.engine.v1.EngineControl/Prefill", "gateway.route"],
              ["kv.transfer", "engine.prefill"], ["engine.decode", "POST /v1/chat/completions"]]
lookback_s = 900

# -- the error budget after drill ops.01 ------------------------------------------
# `requires` holds ops.01's verdict (ol drill end: detected, resolved, a
# postmortem). This step checks that the day that includes the drill and this
# run spent less than the availability budget allows.
[[step]]
name   = "error-budget-held-over-the-last-day"
ci     = "kind"
expect = { match = "promql", query = "(sum(increase(http_server_request_duration_seconds_count{namespace=\"{deploy.namespace}\",service=\"{system}-gateway\",http_response_status_code=~\"5..\"}[1d])) or vector(0)) / sum(increase(http_server_request_duration_seconds_count{namespace=\"{deploy.namespace}\",service=\"{system}-gateway\"}[1d]))", bound = "< 0.005" }
