# MS-C1: the capstone milestone (DESIGN 4.3 "MS-C1", 5.7 catalog; MS-P9
# includes it). Page: content/courses/build-an-llm/paths/course-p09-capstone-training/milestone.md (owned
# by the pass gate's author).
#
# Your capstone model, end to end through your own entry points: it trains
# under the subprocess activity contract (dur.09), reaches the calibrated
# held-out bar for its tier, writes samples your own seeded quality suite
# (craft.22) passes, trains again as a durable TrainRun whose trace reaches
# train.step, ships through your ModelRelease workflow (dur.12) with its
# gates and canary, and is served by your gateway. The artifacts (specs,
# report, zoo table, samples, model card, ledger, ADRs) are C1's check, so
# C1 is in `requires`; so are dur.12, craft.22, L11.1, ethics.03 (the model
# card and datasheet), and ethics.04 (the safety rows the release gates on).
#
# This file fixes these verbs (spec/cli-roles.md, "Verbs of later passes"):
#
#   {tinyllm} train --spec <file> --progress <file>
#       The subprocess activity verb (spec/subprocess-activity.md): the run
#       goes under TL_ARTIFACTS/runs/<TL_IDEMPOTENCY_KEY or spec name>/, its
#       checkpoints in ckpt/ with LATEST (formats/checkpoint.md). Final line:
#       {"steps", "final_loss", "ckpt"}.
#   {tinyllm} eval ppl --model <ckpt dir or model dir> --data <tokens.bin>
#       MS-L6's verb; a run's ckpt/ directory means its LATEST step. The
#       final line holds "bpb" (and "ppl", "tokens").
#   {tinyllm} eval --suite quality --model <dir> --seed S --samples N
#       N seeded samples (seeds S to S + N - 1) from "Once upon a time",
#       scored with your craft.22 evals. Final line: {"samples": N,
#       "repeat8": mean repeated word 8-gram rate, "distinct1": mean distinct
#       word fraction}.
#   {ctl} release --spec <release.json> --id <workflow id> [--approve] [--wait] [--json]
#       Starts ModelRelease (dur.12) on a release spec; --approve sends the
#       approve signal right after the start (unattended runs); with --wait
#       the final line is {"workflow_id", "status", "outcome", "served"}.
#   {ctl} train --spec ... --id ... --wait --json   as fixed by MS-durable.
#
# Tiers: the full run uses `vars` (specs/c1/tinystories-short.json, or
# change it to tinystories-10m.json); `ol milestone MS-C1 --smoke` (the
# nightly train-smoke job) uses `smoke_vars`, the about-1M-parameter smoke
# spec. The `<= calibrated` bars come from the reference's 5-seed runs per
# tier in course/fixtures/ref-thresholds.tsv (key MS-C1/<step>), recorded by
# `ol milestone MS-C1 --record-thresholds` on the author's machine
# (DESIGN 9, B11; DEVIATIONS B112-10).
#
# Your system.toml must declare [entry].tinyllm and [entry].ctl, the
# services of MS-durable (durable, worker) for the TrainRun steps, and
# [deploy] for the kind steps (release, serving, trace).
id       = "MS-C1"
title    = "Your capstone model, trained, evaluated, released through ModelRelease, and served"
requires = ["C1", "dur.12", "craft.22", "L11.1", "ethics.03", "ethics.04"]
pass     = 9
ci       = "nightly"

# -- 1. train under the subprocess contract, then the held-out bar -----------------------

[[step]]
name       = "prepare"
smoke      = true
ci         = "nightly"
run        = "tinyllm"
argv       = ["capstone", "prepare", "--spec", "{spec}", "{source_flag}", "{source}", "--out", "{out}/artifacts", "--holdout", "{holdout}", "--license", "{license}", "--seed", "{seed}"]
vars       = { spec = "specs/c1/tinystories-short.json", source_flag = "--inputs", source = "artifacts", holdout = "0", license = "CDLA-Sharing-1.0" }
smoke_vars = { spec = "specs/c1/smoke.json", source_flag = "--fixture", source = "MS-corpus/sources/stories.jsonl", holdout = "32", license = "CC0-1.0" }
expect     = { match = "json-last-line", metrics = { train_docs = ">= 1", val_tokens = ">= 2", vocab_size = ">= 256" } }
timeout_s  = 1800

[[step]]
name       = "train"
smoke      = true
ci         = "nightly"
run        = "tinyllm"
argv       = ["train", "--spec", "{out:prepare}/artifacts/train-spec.json", "--progress", "{out}/progress.jsonl"]
env        = { TL_ARTIFACTS = "{out:prepare}/artifacts", TL_IDEMPOTENCY_KEY = "c1" }
expect     = { match = "json-last-line", metrics = { steps = ">= 1", final_loss = "< 10" } }
timeout_s  = 43200

[[step]]
name       = "val-loss"
smoke      = true
ci         = "nightly"
run        = "tinyllm"
# The held-out split your own training run tokenized (the spec's data.val,
# under the run's TL_ARTIFACTS).
argv       = ["eval", "ppl", "--model", "{out:prepare}/artifacts/runs/c1/ckpt", "--data", "{out:prepare}/artifacts/{val}"]
vars       = { val = "tokens/ts-bpe-4k/ts-val.bin" }
smoke_vars = { val = "tokens/c1-bpe-512/stories-val.bin" }
expect     = { match = "json-last-line", metrics = { bpb = "<= calibrated" } }
timeout_s  = 1800

# -- 2. 20 seeded samples through your quality suite ---------------------------------------

[[step]]
name       = "seeded-samples"
smoke      = true
ci         = "nightly"
run        = "tinyllm"
argv       = ["eval", "--suite", "quality", "--model", "{out:prepare}/artifacts/runs/c1/ckpt", "--seed", "{seed}", "--samples", "20"]
expect     = { match = "json-last-line", metrics = { samples = "== 20", repeat8 = "<= 0.10", distinct1 = ">= 0.30" } }
timeout_s  = 1800

# -- 3. the durable run and its trace (your cluster, or the nightly kind job) --------------

[[step]]
name       = "train-run-on-the-platform"
ci         = "kind"
run        = "ctl"
argv       = ["train", "--spec", "{spec}", "--id", "c1-trainrun", "--wait", "--json"]
vars       = { spec = "specs/c1/smoke.json" }
expect     = { match = "json-schema", schema = { type = "object", required = ["status", "ckpt"], properties = { status = { const = "COMPLETED" } } } }
timeout_s  = 3600

[[step]]
name   = "one-trace-from-the-cli-to-train-step"
ci     = "kind"
expect = { match = "trace", spans = ["workflow TrainRun", "activity train", "train.run", "train.step"], parents = [["activity train", "workflow TrainRun"], ["train.run", "activity train"], ["train.step", "train.run"]], lookback_s = 3600 }

# -- 4. release through ModelRelease, then serve ------------------------------------------

[[step]]
name      = "model-release-promotes"
ci        = "kind"
run       = "ctl"
argv      = ["release", "--spec", "specs/c1/release.json", "--id", "c1-release", "--approve", "--wait", "--json"]
expect    = { match = "json-schema", schema = { type = "object", required = ["status", "outcome", "served"], properties = { status = { const = "COMPLETED" }, outcome = { const = "promoted" } } } }
timeout_s = 3600

[[step]]
name   = "served-through-the-gateway"
ci     = "kind"
expect = { match = "suite", suite = "openapi:v1:gateway" }
