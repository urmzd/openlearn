# MS-L3: the Part 3 milestone (DESIGN 4.3 "MS-L3", 5.7, 7.2). MS-P4 includes it.
#
# Your recurrent language models, run through your own entry point: an Elman
# RNN (L3.1, fused as one op by L3.6), an LSTM (L3.2), and a GRU (L3.3), each
# trained with stateful truncated BPTT (L3.6) on Tiny Shakespeare, the LSTM
# sampling text, and the LSTM trained on the MS-L2 story corpus and scored on
# its validation file, where it must beat the MS-L2 NPLM in bits per byte.
# L3.4 (the bidirectional encoder) is exercised by MS-L4.
#
# This file fixes the Pass 4 language-model verbs of your `tinyllm` role
# (spec/cli-roles.md, "Verbs of later passes"); exit 2 on a usage error, the
# last stdout line is one JSON object. Text files are read as UTF-8 bytes,
# .bin files as formats/tokens-bin.md shards of byte ids (D32).
#
#   {tinyllm} train rnnlm --cell rnn|lstm|gru --data <file> --out <dir> --steps S --seed S
#                 --d-emb E --hidden H --bptt K --batch B --lr X --clip G
#       The last 10% of the file's tokens (int(n * 0.1)) are held out. Builds
#       RNNLM(256, E, H, cell, rng=PCG32(seed).substream("init")), trains it
#       with train_tbptt(model, head, K, B, AdamW(lr=X, weight_decay=0), G, S)
#       and writes the model directory with save_rnnlm (tokenizer "bytes").
#       Final line: {"out", "arch": "rnnlm", "cell", "steps": S, "loss": <mean
#       of the last 50 losses>, "val_bpc": <mean nll of the tail, in bits>,
#       "val_tokens", "params"}
#
#   {tinyllm} eval --model <rnnlm dir> --data <file> [--tail-frac F]
#       RNNLM.nll over the file (or over its last int(n * F) tokens), summed
#       with M11.2's NLLAccumulator, one byte per token. Final line:
#       {"model": "rnnlm", "ppl", "nll_mean", "bpb", "tokens", "bytes"}
#
#   {tinyllm} generate --model <rnnlm dir> --prompt <text> --seed S --max-tokens N [--out <file>]
#       RNNLM.generate from the prompt's bytes at --temperature (default 1).
#       Final line {"ids", "text"}, also written to <file> with --out.
#
# Bars. A json-last-line metric compares with a constant or the reference's
# calibrated bar (mean + 3 sd over 5 seeds, ref-thresholds.tsv), never with
# another step, so the two comparisons of the design are fixed constants
# (DEVIATIONS B63-07): in the full run the RNN's bpc must stay ABOVE the
# LSTM's calibrated full bar (so a passing RNN and a passing LSTM are always
# ordered RNN > LSTM), and the LSTM's bits per byte on MS-L2's val.bin must be
# below 0.6261, the best of five reference NPLMs trained with MS-L2's config
# (0.6261 to 0.6559 bpb). Both are `ci = "nightly"` steps; --smoke runs the
# 300-step variants with their own calibrated bars.
#
# Corpora: course/fixtures/small-corpora/tinyshakespeare.txt (Karpathy's
# char-rnn file, public domain) and MS-L2's synthetic stand-in for the
# TinyStories token files (course-corpora is not published; DEVIATIONS
# B54-01, B63-06).
#
# `ol milestone MS-L3 --smoke` takes about a minute; the full run about 5.
id       = "MS-L3"
title    = "Your recurrent language models, trained, ordered, and scored through your CLI"
requires = ["L3.1", "L3.2", "L3.3", "L3.4", "L3.6"]
pass     = 4
ci       = "pr"

# -- 1. three cells on Tiny Shakespeare --------------------------------------------------------
[[step]]
name       = "rnn"
smoke      = true
run        = "tinyllm"
argv       = ["train", "rnnlm", "--cell", "rnn", "--data", "{fixture:small-corpora/tinyshakespeare.txt}",
              "--out", "{out}/rnn", "--steps", "{steps}", "--seed", "{seed}",
              "--d-emb", "32", "--hidden", "128", "--bptt", "32", "--batch", "32", "--lr", "0.01", "--clip", "1.0"]
vars       = { steps = "3000" }
smoke_vars = { steps = "300" }
expect     = { match = "json-last-line", metrics = { val_bpc = "<= calibrated", val_tokens = "== 111538" } }
timeout_s  = 300

[[step]]
name       = "lstm"
smoke      = true
run        = "tinyllm"
argv       = ["train", "rnnlm", "--cell", "lstm", "--data", "{fixture:small-corpora/tinyshakespeare.txt}",
              "--out", "{out}/lstm", "--steps", "{steps}", "--seed", "{seed}",
              "--d-emb", "32", "--hidden", "128", "--bptt", "32", "--batch", "32", "--lr", "0.01", "--clip", "1.0"]
vars       = { steps = "3000" }
smoke_vars = { steps = "300" }
expect     = { match = "json-last-line", metrics = { val_bpc = "<= calibrated" } }
timeout_s  = 300

[[step]]
name       = "gru"
smoke      = true
run        = "tinyllm"
argv       = ["train", "rnnlm", "--cell", "gru", "--data", "{fixture:small-corpora/tinyshakespeare.txt}",
              "--out", "{out}/gru", "--steps", "{steps}", "--seed", "{seed}",
              "--d-emb", "32", "--hidden", "128", "--bptt", "32", "--batch", "32", "--lr", "0.01", "--clip", "1.0"]
vars       = { steps = "3000" }
smoke_vars = { steps = "300" }
expect     = { match = "json-last-line", metrics = { val_bpc = "<= calibrated" } }
timeout_s  = 300

[[step]]
name   = "lstm-is-a-model-dir"
smoke  = true
expect = { match = "file-produced", glob = "{out:lstm}/lstm/config.json", schema = "course/contracts/formats/config.schema.json", contains = "\"rnnlm\"" }

# The ordering (full run only): the RNN's bits per character on the same tail
# stay above 2.558, the LSTM's calibrated full bar (mean 2.535 + 3 sd over 5 seeds; the reference RNN: 2.759 to 2.806).
[[step]]
name      = "rnn-trails-lstm"
ci        = "nightly"
run       = "tinyllm"
argv      = ["eval", "--model", "{out:rnn}/rnn", "--data", "{fixture:small-corpora/tinyshakespeare.txt}", "--tail-frac", "0.1"]
expect    = { match = "json-last-line", metrics = { bpb = ">= 2.558", tokens = "== 111538" } }
timeout_s = 120

# -- 2. the LSTM writes ---------------------------------------------------------------------------
[[step]]
name      = "lstm-samples"
smoke     = true
run       = "tinyllm"
argv      = ["generate", "--model", "{out:lstm}/lstm", "--prompt", "ROMEO:", "--seed", "7", "--max-tokens", "64",
             "--out", "{out}/gen.json"]
expect    = { match = "regex", pattern = '"ids": \[(\d+, ){63}\d+\]' }
timeout_s = 120

[[step]]
name      = "lstm-samples-again"
smoke     = true
run       = "tinyllm"
argv      = ["generate", "--model", "{out:lstm}/lstm", "--prompt", "ROMEO:", "--seed", "7", "--max-tokens", "64"]
expect    = { match = "tokens-equal", file = "{out:lstm-samples}/gen.json" }
timeout_s = 120

# -- 3. the LSTM against the NPLM on MS-L2's validation file ---------------------------------------
[[step]]
name       = "lstm-ts"
smoke      = true
run        = "tinyllm"
argv       = ["train", "rnnlm", "--cell", "lstm", "--data", "{fixture:MS-L2/train.bin}", "--out", "{out}/lstm-ts",
              "--steps", "{steps}", "--seed", "{seed}",
              "--d-emb", "32", "--hidden", "128", "--bptt", "32", "--batch", "32", "--lr", "0.01", "--clip", "1.0"]
vars       = { steps = "1500" }
smoke_vars = { steps = "300" }
expect     = { match = "json-last-line", metrics = { val_bpc = "<= calibrated" } }
timeout_s  = 300

[[step]]
name      = "lstm-ts-eval"
smoke     = true
run       = "tinyllm"
argv      = ["eval", "--model", "{out:lstm-ts}/lstm-ts", "--data", "{fixture:MS-L2/val.bin}"]
expect    = { match = "json-last-line", metrics = { bpb = "<= calibrated", tokens = "== 14674" } }
timeout_s = 120

[[step]]
name      = "lstm-ts-beats-nplm"
ci        = "nightly"
run       = "tinyllm"
argv      = ["eval", "--model", "{out:lstm-ts}/lstm-ts", "--data", "{fixture:MS-L2/val.bin}"]
expect    = { match = "json-last-line", metrics = { bpb = "< 0.6261" } }
timeout_s = 120
