# MS-gateway: the gateway component milestone (DESIGN 4.4 "MS-gateway", 5.7).
# MS-P7 includes it. Page: paths/course-p07-serving-platform/milestone.md.
#
# Your gateway (gw.01 to gw.07) in front of your engine (L10.5), started by the
# runner on allocated ports, as a client sees it: the gateway tier of
# openapi-subset.v1 passes (auth, limits, cache, headers, priority.internal;
# cases that declare requires = ["gw.08"], such as policy.451, report
# pending until the usage policy lands in Pass 10), the engine tier passes on
# its own (the provider side of craft.20's contract), and the usage ledger
# (gw.07) reconciles with the usage the engine reported for a fixed workload,
# through the admin API and through your CLI.
#
# Your system.toml must declare (spec/cli-roles.md, DESIGN 2.16):
#   [entry].engine     the --config form (L10.5), serving the byte-level model
#                      "tracer" (D32): "Once" is 4 prompt tokens
#   [entry].gateway    the --config form (gw.01)
#   [entry].ctl        your umbrella CLI, with the `usage` verb below
#   [services.engine]  health = "http://127.0.0.1:{health_port}/healthz"
#   [services.gateway] health = "http://127.0.0.1:{health_port}/readyz", after = ["engine"];
#                      its config template sets [gateway].usage_db = "{data}/usage.db"
#                      (a fresh ledger per run), routes model "tracer" to the
#                      engine, and accepts the key in [endpoints].api_key_env
#                      with the scopes infer and admin
#   [endpoints]        api_key_env (export that key)
#
# This milestone fixes the `usage` verb of your `ctl` role (cli-roles.md,
# "Verbs of later passes"):
#   {ctl} usage --gateway <base URL> [--tenant T] [--key-id K] [--since T] [--until T]
#               [--group-by none|model|tenant|key_id|api_version] [--json]
#     GET <base>/admin/v1/usage with the key in $TL_API_KEY. With --json: one
#     JSON line per row, then a final line of totals over the rows:
#     {"requests": N, "errors": E, "prompt_tokens": P, "completion_tokens": C, "cached_tokens": K}.
#     Exit 1 on an HTTP error, with the error's message on stderr.
#
# The workload steps run first, so the ledger holds exactly 12 requests when
# it is read: 8 completions and 4 streams of max_tokens 4 on "Once", each
# 4 prompt and 4 completion tokens.
#
# Failover before the first byte (DESIGN 4.4) is checked by gw.05's course
# tests (a backend killed before its first byte is retried elsewhere); a
# runner step that stops one engine instance mid-milestone is a harness
# addition (DEVIATIONS B94-17).
#
# `ol milestone MS-gateway --smoke` runs every step except the CLI step.
id       = "MS-gateway"
title    = "Your gateway passes conformance and its usage ledger reconciles with the engine"
requires = ["lang.11", "ds.09", "gw.01", "gw.02", "gw.03", "gw.04", "gw.05", "gw.06", "gw.07", "craft.20"]
pass     = 7
ci       = "pr"
services = ["engine", "gateway"]

# -- a fixed workload, then the ledger ------------------------------------------

[[step]]
name   = "completions-report-usage"
smoke  = true
matrix = { n = ["1", "2", "3", "4", "5", "6", "7", "8"] }
http   = { method = "POST", url = "{gateway.api_base}/completions", auth = true, json = { model = "tracer", prompt = "Once", max_tokens = 4, temperature = 0 } }
expect = { match = "json-schema", schema = { type = "object", required = ["usage"], properties = { usage = { type = "object", required = ["prompt_tokens", "completion_tokens"], properties = { prompt_tokens = { const = 4 }, completion_tokens = { const = 4 } } } } } }

[[step]]
name   = "streams-through-the-meter"
smoke  = true
matrix = { n = ["1", "2", "3", "4"] }
http   = { method = "POST", url = "{gateway.api_base}/completions", auth = true, json = { model = "tracer", prompt = "Once", max_tokens = 4, temperature = 0, stream = true } }
expect = { match = "sse", min_chunks = 1 }

# 12 rows, 48 prompt and 48 completion tokens: exactly what the engine
# reported above (streams included: the meter asked for their usage chunk).
[[step]]
name   = "ledger-reconciles-with-the-engine"
smoke  = true
http   = { method = "GET", url = "http://127.0.0.1:{gateway.port}/admin/v1/usage?group_by=model", auth = true }
expect = { match = "json-schema", schema = { type = "object", required = ["data"], properties = { data = { type = "array", minItems = 1, maxItems = 1, items = { type = "object", required = ["model", "requests", "errors", "prompt_tokens", "completion_tokens"], properties = { model = { const = "tracer" }, requests = { const = 12 }, errors = { const = 0 }, prompt_tokens = { const = 48 }, completion_tokens = { const = 48 } } } } } } }

[[step]]
name      = "usage-from-your-cli"
run       = "ctl"
argv      = ["usage", "--gateway", "http://127.0.0.1:{gateway.port}", "--group-by", "model", "--json"]
expect    = { match = "json-last-line", metrics = { requests = "== 12", prompt_tokens = "== 48", completion_tokens = "== 48", errors = "== 0" } }
timeout_s = 120

# -- the contract, both sides ---------------------------------------------------

[[step]]
name   = "gateway-conforms-openapi-v1"
smoke  = true
expect = { match = "suite", suite = "openapi:v1:gateway" }

[[step]]
name     = "engine-conforms-openapi-v1"
smoke    = true
services = ["engine"]
expect   = { match = "suite", suite = "openapi:v1:engine" }
