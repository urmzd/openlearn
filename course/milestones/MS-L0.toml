# MS-L0: the Part 0 milestone (DESIGN 4.3 "MS-L0", 5.7, 7.2). MS-P2 includes it.
# Page: content/courses/build-an-llm/paths/course-p02-foundations/milestone.md
#
# Your autograd (L0.1 to L0.4) checks its own gradients, retrains the tracer
# bigram to the count MLE in a model directory the unchanged tracer engine
# serves (L0.5), trains an MLP on the digits, and survives a kill: a resumed
# token-stream run ends bitwise equal to the uninterrupted one, cursor and
# generator included (L0.6).
#
# This file fixes the Pass 2 verbs of your `tinyllm` role (spec/cli-roles.md,
# "Verbs of later passes"). Every verb keeps the rules of that page: exit 2 on
# a usage error, the last stdout line is one JSON object.
#
#   {tinyllm} gradcheck --suite all
#       Runs F.gradcheck_all() (L0.2 over M04.1) in float64. Exit 0 only when
#       every check passes. Final line:
#       {"suite": "all", "checks": <int>, "failed": <int>, "max_rel_err": <float>, "worst": "<op>"}
#
#   {tinyllm} train bigram --method autograd --data <raw file> --out <dir> [--seed S]
#       Trains BigramLogits by gradient descent on the mean cross-entropy of
#       every (byte, next byte) pair of the file (steps, learning rate, and
#       optimizer are yours) and writes the Pass 1 model directory into <dir>:
#       config.json and model.safetensors with bigram.weight F32 [256, 256].
#       Final line: the Pass 1 keys {"out", "tokens", "nll"} (nll of the
#       trained table on the file, nats per byte); more keys are allowed.
#       `--method counts` (the default) is the Pass 1 verb, unchanged.
#
#   {tinyllm} train bigram --method autograd --data <shard.bin> --out <dir>
#                 --max-steps N --batch B --seq-len T --ckpt-every K [--seed S] [--resume]
#       A .bin --data is a formats/tokens-bin.md shard read by your TokenStream
#       (random windows from a PCG32 seeded with S). Every K steps, and at step
#       N, write an atomic checkpoint <dir>/ckpt/step-<nnnnnn>/ and
#       <dir>/ckpt/LATEST (formats/checkpoint.md). --resume continues from the
#       newest checkpoint under <dir>/ckpt/ that verifies. At the end write the
#       model directory into <dir> and the final line, also as <dir>/final.json:
#       {"step": N, "tokens_seen": <int>, "loss": <float>, "loss_hex": "<float.hex(loss)>",
#        "data_cursor": {"shard": <int>, "offset": <int>}, "params_sha256": "<hex>"}
#       where loss is the training loss of step N and params_sha256 hashes every
#       parameter in named_parameters() order (name bytes, then float32
#       little-endian C-order data). No path or time may appear in the line:
#       two runs that agree bit for bit print the same bytes.
#
#   {tinyllm} train mlp --data <digits.npz> --hidden H --epochs E --ckpt <dir> [--seed S]
#       A one-hidden-layer ReLU MLP with H hidden units trained for E epochs
#       (the npz holds x_train uint8 [3823, 64] in 0..16, y_train, x_test,
#       y_test; preprocessing is yours), checkpoints under <dir>/ckpt/. Final
#       line: {"step": <int>, "epochs": E, "train_loss": <float>, "test_acc": <float>}.
#
#   Failpoint (the TL_FAILPOINTS spec of the course testkits):
#       train/after-step   evaluated once after every optimizer step, after
#                          that step's checkpoint (if any) is complete.
#                          `train/after-step=N*crash` exits 137 on the Nth
#                          evaluation of this process, as a SIGKILL would.
#
# `ol milestone MS-L0 --smoke` runs the smoke steps (all of them: this
# milestone needs no services). Every later pass gate reruns them.
id       = "MS-L0"
title    = "Your autograd retrains the tracer and survives a kill"
requires = ["L0.1", "L0.2", "L0.3", "L0.4", "L0.5", "L0.6"]
pass     = 2
ci       = "pr"

# -- 1. gradients you can trust -------------------------------------------------
# L0.2 lists 25 ops (gelu counts once); gradcheck_all checks every one.
[[step]]
name      = "gradcheck-suite"
smoke     = true
run       = "tinyllm"
argv      = ["gradcheck", "--suite", "all"]
expect    = { match = "json-last-line", metrics = { failed = "== 0", checks = ">= 25", max_rel_err = "< 1e-5" } }
timeout_s = 120

# -- 2. the tracer, retrained by your autograd ----------------------------------
# The count MLE is the minimizer of this loss; its NLL on the fixture corpus is
# the conditional entropy H = 2.076630290 nats per byte
# (course/oracle/MS-L0/fixtures.py). 2.07763 = H + 1e-3, rounded down.
[[step]]
name      = "autograd-bigram"
smoke     = true
run       = "tinyllm"
argv      = ["train", "bigram", "--method", "autograd", "--data", "{fixture:MS-P1/corpus.txt}", "--out", "{out}", "--seed", "{seed}"]
expect    = { match = "json-last-line", metrics = { nll = "<= 2.07763", tokens = "== 2156" } }
timeout_s = 120

# The directory the tracer engine reads: same config keys as Pass 1.
[[step]]
name   = "autograd-bigram-is-a-model-dir"
smoke  = true
expect = { match = "file-produced", glob = "{out:autograd-bigram}/config.json", schema = "course/contracts/formats/config.schema.json", contains = "\"bigram\"" }

# Greedy decoding compares counts within one row, and the count MLE orders each
# row as the add-one model of Pass 1 does; the top-2 log margin on this path is
# at least 0.74 nats, so a table within 1e-3 nats of the MLE decodes the same
# 32 ids as MS-P1.
[[step]]
name      = "greedy-from-autograd-bigram"
smoke     = true
run       = "tinyllm"
argv      = ["generate", "--model", "{out:autograd-bigram}", "--prompt", "Once", "--max-tokens", "32", "--greedy"]
expect    = { match = "tokens-equal", file = "course/fixtures/MS-P1/greedy_once_32.json" }
timeout_s = 120

# -- 3. an MLP on the digits ------------------------------------------------------
# UCI optdigits, official split (writers disjoint). The reference standardizes
# each pixel and reaches test_acc 0.965 to 0.969 over seeds 0 to 4; plain x / 16
# lands near 0.953, too close to the bar.
[[step]]
name      = "train-mlp-digits"
smoke     = true
run       = "tinyllm"
argv      = ["train", "mlp", "--data", "{fixture:small-corpora/digits.npz}", "--hidden", "64", "--epochs", "30", "--seed", "{seed}", "--ckpt", "{out}"]
expect    = { match = "json-last-line", metrics = { test_acc = ">= 0.95", epochs = "== 30" } }
timeout_s = 300

[[step]]
name   = "mlp-checkpoints-are-complete"
smoke  = true
expect = { match = "file-produced", glob = "{out:train-mlp-digits}/ckpt/step-*/MANIFEST.json", min_count = 1, schema = "course/contracts/formats/manifest.schema.json" }

[[step]]
name   = "mlp-trainer-state"
smoke  = true
expect = { match = "file-produced", glob = "{out:train-mlp-digits}/ckpt/step-*/trainer_state.json", min_count = 1, schema = "course/contracts/formats/trainer-state.schema.json" }

# -- 4. kill and resume, bitwise ------------------------------------------------
# The same argv three times: once straight through, once killed after step 60
# (checkpoints at 25 and 50 are complete, 75 never starts), then resumed in
# the killed run's directory.
[[step]]
name      = "resume-uninterrupted"
smoke     = true
run       = "tinyllm"
argv      = ["train", "bigram", "--method", "autograd", "--data", "{fixture:MS-L0/corpus.bin}", "--out", "{out}",
             "--max-steps", "100", "--batch", "8", "--seq-len", "32", "--ckpt-every", "25", "--seed", "{seed}"]
expect    = { match = "json-last-line", metrics = { step = "== 100", tokens_seen = "== 25600" } }
timeout_s = 60

[[step]]
name      = "resume-killed"
smoke     = true
run       = "tinyllm"
argv      = ["train", "bigram", "--method", "autograd", "--data", "{fixture:MS-L0/corpus.bin}", "--out", "{out}",
             "--max-steps", "100", "--batch", "8", "--seq-len", "32", "--ckpt-every", "25", "--seed", "{seed}"]
env       = { TL_FAILPOINTS = "train/after-step=60*crash" }
expect    = { match = "exit-code", code = 137 }
timeout_s = 60

[[step]]
name   = "resume-killed-left-step-50"
smoke  = true
expect = { match = "file-produced", glob = "{out:resume-killed}/ckpt/LATEST", contains = "step-000050" }

# Restarting from step 0 would also print the same line, so the resumed process
# carries a failpoint that fires on its 51st step: a run that resumed from
# step 50 takes exactly 50 steps and never reaches it.
[[step]]
name      = "resume-after-kill"
smoke     = true
run       = "tinyllm"
argv      = ["train", "bigram", "--method", "autograd", "--data", "{fixture:MS-L0/corpus.bin}", "--out", "{out:resume-killed}",
             "--max-steps", "100", "--batch", "8", "--seq-len", "32", "--ckpt-every", "25", "--seed", "{seed}", "--resume"]
env       = { TL_FAILPOINTS = "train/after-step=51*crash" }
expect    = { match = "contains", file = "{out:resume-uninterrupted}/final.json" }
timeout_s = 60

[[step]]
name   = "resumed-trainer-state"
smoke  = true
expect = { match = "file-produced", glob = "{out:resume-killed}/ckpt/step-000100/trainer_state.json", schema = "course/contracts/formats/trainer-state.schema.json" }
