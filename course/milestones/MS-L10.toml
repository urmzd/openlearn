# MS-L10: the Part 10 milestone, your inference engine (DESIGN 4.3 "MS-L10",
# 5.7 catalog, 7.2). MS-P7 = MS-L10 + MS-gateway + MS-prod.
# Page: paths/course-p07-serving-platform/milestone.md (B9 paths work).
#
# Your Rust engine, started from your own entry point, serves the OpenAI
# subset v1 conformantly (streaming, stop strings, seeds, 16 concurrent
# streams, abort on disconnect, tool calls), keeps its KV pool clean under a
# burst of 64 requests from your own load generator, reports its metrics in
# the contract's names, keeps greedy output unchanged with prompt-lookup
# speculation on, and answers a forced tool call with a schema-valid call.
# PR CI runs on L7.9's committed tiny-llama-2l, in its 1024-position copy
# tiny-llama-2l-1k (the same weights: a tool request's schema prompt is about
# 470 byte tokens, past the original 256); the nightly step serves
# SmolLM2-135M-Instruct (`ol fetch smollm2-135m-instruct`) and lets it choose
# to call a tool.
#
# Your system.toml must declare (spec/cli-roles.md, DESIGN 2.16):
#   [entry].engine        `--config {config}` (L10.5): your tl-serve main reads
#                         runtime.toml; its [engine].model_dir is the model
#   [services.engine]     config = a runtime.toml template serving
#                         course/fixtures/L7.9/tiny-llama-2l-1k as the model
#                         [endpoints].model names (default "tracer")
#                         ({fixture:L7.9/tiny-llama-2l-1k} fills the path);
#                         health = "http://127.0.0.1:{health_port}/healthz"
#   [services.engine-spec]  the same template with
#                         [engine].speculative = { draft = "prompt_lookup", k = 4 }
#   [services.engine-instruct]  (nightly) model_dir = {asset:smollm2-135m-instruct}
#   [services.engine-prefill], [services.engine-decode-a], [services.engine-decode-b]
#                         the same model with [engine].role = "prefill" and
#                         "decode" (L10.6); the harness fills grpc_listen and
#                         kv_listen with allocated ports ({grpc_port}, {kv_port})
#   [entry].loadgen       {loadgen} --target <base url without /v1> --model <m>
#                         --prompt <text> --max-tokens <n> --mode burst
#                         --burst <n> --duration <d> --out <report.json>:
#                         writes the report (formats/loadgen-report.schema.json)
#                         to --out and prints it as the final stdout line
#                         (`{loadgen} compare` belongs to the optional load.02)
#
# Two matchers compare your engines with each other (course/harness disagg.py):
# `greedy-equal` (the plain and the speculative engine give one greedy text)
# and `disagg`, the disaggregated run without the gateway: tokenize on P,
# EngineControl.Prefill on P with decode_target = a decode engine's kv port,
# then the same request on that engine with X-TL-KV-Handle. Its cases: Info
# roles, greedy (plain and streamed, alternating the two decode engines) and
# seeded output equal to the unified engine, an unknown and a released handle
# answering 404 kv_handle_not_found, and a transfer reset mid-push (a harness
# proxy in front of the kv port) failing Prefill without leaking a KV block
# on either side, after which that decode engine serves again.
#
# Covered elsewhere, so not repeated here: Rust and Python samplers agree on
# fixture logits (L10.1's course tests, parity/sampler); the engine's greedy
# stream equals your Python on the tiny model (L10.1's runner tests and
# conformance chat.nonstream.greedy).
#
# `ol milestone MS-L10 --smoke` runs the conformance step only.
id       = "MS-L10"
title    = "Your inference engine: conformant, concurrent, observable, speculative, tool-calling"
requires = ["L10.1", "L10.2", "L10.3", "L10.4", "L10.5", "L10.6", "L10.7", "L10.8", "L10.9",
            "load.01"]
pass     = 7
ci       = "pr"
services = ["engine"]

# -- conformance (v1, engine tier) -----------------------------------------------

[[step]]
name   = "engine-conforms-openapi-v1"
smoke  = true
expect = { match = "suite", suite = "openapi:v1:engine" }

# The same suite against the engine with speculative decoding on: every
# greedy, stop, seed, stream, and concurrency case must hold with drafts.
[[step]]
name     = "speculative-engine-conforms"
services = ["engine-spec"]
expect   = { match = "suite", suite = "openapi:v1:engine", service = "engine-spec" }

# Greedy output is unchanged with prompt-lookup speculation on (L10.8): each
# prompt (one repeats a phrase, so drafts are proposed) gives one text and
# one token count on both engines.
[[step]]
name     = "speculative-greedy-unchanged"
services = ["engine", "engine-spec"]
expect   = { match = "greedy-equal", engines = ["engine", "engine-spec"], max_tokens = 32 }

# -- disaggregated serving (DESIGN 4.3 step 5) ----------------------------------------

[[step]]
name     = "disaggregated-equals-unified"
services = ["engine", "engine-prefill", "engine-decode-a", "engine-decode-b"]
expect   = { match = "disagg", unified = "engine", prefill = "engine-prefill", decode = ["engine-decode-a", "engine-decode-b"] }

# -- load: 64 at once from your load generator -------------------------------------

[[step]]
name      = "burst-of-64"
run       = "loadgen"
argv      = ["--target", "http://127.0.0.1:{engine.port}", "--model", "{endpoints.model}", "--prompt", "Once upon a time",
             "--max-tokens", "16", "--mode", "burst", "--burst", "64", "--duration", "1s", "--out", "{out}/report.json"]
timeout_s = 180
expect    = { match = "json-schema", schema = { type = "object", required = ["requests", "errors", "ttft_ms", "tpot_ms"], properties = { requests = { minimum = 64 }, errors = { maximum = 0 }, ttft_ms = { type = "object", required = ["p50"] }, tpot_ms = { type = "object", required = ["p50"] } } } }

# Every block of the burst is back: none used once the engine is idle.
[[step]]
name   = "kv-back-to-baseline"
http   = { method = "GET", url = "http://127.0.0.1:{engine.health_port}/metrics" }
expect = { match = "contains", text = "tl_engine_kv_blocks{state=\"used\"} 0" }

# -- metrics (L10.7) ------------------------------------------------------------------

[[step]]
name   = "ttft-histogram-served"
http   = { method = "GET", url = "http://127.0.0.1:{engine.health_port}/metrics" }
expect = { match = "contains", text = "gen_ai_server_time_to_first_token_seconds_bucket" }

# -- tool calls (L10.9) ---------------------------------------------------------------
# On a random tiny model the constraint alone guarantees a valid call, so PR CI
# forces the tool; the nightly step lets the instruct model choose.

[[step]]
name   = "forced-tool-call-tiny"
http   = { method = "POST", url = "{engine.api_base}/chat/completions", json = { model = "{endpoints.model}", max_tokens = 64, messages = [{ role = "user", content = "Weather in Paris?" }], tools = [{ type = "function", function = { name = "get_weather", parameters = { type = "object", properties = { city = { type = "string" } }, required = ["city"], additionalProperties = false } } }], tool_choice = { type = "function", function = { name = "get_weather" } } } }
expect = { match = "contains", text = "\"finish_reason\":\"tool_calls\"" }

[[step]]
name     = "tool-call-smollm2-instruct"
ci       = "nightly"
services = ["engine-instruct"]
expect   = { match = "suite", suite = "openapi:v1:engine", service = "engine-instruct", params = { "tools.call" = { tool_choice = "auto" }, "tools.stream" = { tool_choice = "auto" } } }
