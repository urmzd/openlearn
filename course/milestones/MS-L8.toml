# MS-L8: the Part 8 milestone (DESIGN 4.3 "MS-L8", 5.7, 7.2). MS-P6 includes it.
# Page: content/courses/build-an-llm/paths/course-p06-inference-and-kernels/milestone.md (B8 paths work).
#
# Your Python inference stack, run through your own entry point, on the Llama
# model of MS-L7: the same greedy tokens with no cache, your contiguous cache
# (L8.2, with float16 keys and values); quantized weights (L8.5, using M09.4's FP8 and
# microscaling conversions) that keep the model's predictions; speculative
# decoding (L8.6) that changes the speed and never
# the greedy output; and constrained decoding (L8.7) whose every document
# parses and validates. PR CI runs it on the committed tiny model; the
# nightly run uses SmolLM2-135M-Instruct pulled by MS-L7; the cache speedup
# is a local perf step.
#
# This file fixes the Pass 6 inference forms of your `tinyllm` role
# (spec/cli-roles.md, "Verbs of later passes": generate with --cache and
# --spec, eval ppl, bench decode). Every verb keeps the rules of that page:
# exit 2 on a usage error, the last stdout line is one JSON object.
#
#   {tinyllm} generate --model <llama dir> (--prompt <text> | --prompt-file <file>)
#                 [--max-tokens N] [--greedy | --temperature T] [--seed S]
#                 [--cache none|contiguous|paged] [--kv-dtype f32|f16]
#                 [--spec ngram|prompt-lookup --k K] [--json-schema <file>]
#       MS-L7's generate through L8.2's generate with the chosen cache
#       ("paged": the optional L8.3's pure-Python PagedKVCache, behind L8.2's
#       cache interface; not checked here). --spec runs L8.6's
#       speculative_generate with an NGramDraft fitted on the prompt's ids
#       (order 3) or a PromptLookupDraft. --json-schema decodes each prompt
#       under L8.7's constraint over the byte vocabulary until no token is
#       allowed. Final line: {"ids": [every prompt's generated ids,
#       concatenated], "text", "per_prompt" (with --prompt-file), and with
#       --spec {"drafted", "accepted", "acceptance_rate", "target_calls"},
#       with --json-schema {"documents", "valid", "valid_fraction"} (valid: the
#       text json-parses and satisfies the schema)}.
#
#   {tinyllm} eval ppl --model <llama dir> --data <text file> --quant int8|q4_g32|fp8_e4m3|mxfp4 [--tokens N]
#       Next-token NLL over the first N tokens (windows of up to 128), once
#       with the float32 model and once after L8.5's quantize_model, which uses
#       M09.4's Python format conversions. Final
#       line: {"tokens", "ppl_fp32", "ppl", "increase_pct", "top1_agree" (how
#       often the quantized model's argmax equals the float32 model's),
#       "nll_delta" (|mean NLL difference| in nats)}.
#
#   {tinyllm} bench decode --model <llama dir> [--tokens N] [--prompt <text>]
#       Greedy decode of N tokens with cache "none" and "contiguous" (best of
#       two each). Final line: {"tokens", "tok_s_none", "tok_s_contiguous",
#       "cache_speedup"}.
#
# DESIGN 4.3 step (5), "the L8.4 course tests pass from cargo test", and the
# rt.04 block pool are this milestone's `requires`: a fresh pass of L8.4 ran
# its Rust course tests with cargo, as MS-L9 treats its sanitizer step
# (DEVIATIONS B83-08). The tiny model is random, so its perplexity says
# little: the PR quantization steps bound top-1 agreement and the NLL shift;
# the nightly steps keep DESIGN 4.3's perplexity budgets on SmolLM2.
#
# `ol milestone MS-L8 --smoke` runs the tiny-model steps (seconds).
id       = "MS-L8"
title    = "Your Python inference stack matches no-cache output token for token"
requires = ["ds.07", "L8.1", "L8.2", "L8.4", "L8.5", "L8.6", "L8.7", "M09.4"]
pass     = 6
ci       = "pr"

# -- 1. cache equivalence on the committed tiny model (L8.2) --------------------------
[[step]]
name      = "tiny-cache-equivalence"
smoke     = true
run       = "tinyllm"
argv      = ["generate", "--model", "{fixture:L7.9/tiny-llama-2l/config.json}", "--prompt-file", "{fixture:L7.9/margin-prompts.txt}",
             "--max-tokens", "32", "--greedy", "--cache", "{cache}", "--kv-dtype", "f16"]
matrix    = { cache = ["none", "contiguous"] }
expect    = { match = "tokens-equal", file = "course/fixtures/L7.9/tiny_greedy_32.json" }
timeout_s = 120

# -- 2. quantized weights keep the predictions (L8.5) --------------------------------
[[step]]
name      = "tiny-quant-int8"
smoke     = true
run       = "tinyllm"
argv      = ["eval", "ppl", "--model", "{fixture:L7.9/tiny-llama-2l/config.json}", "--data", "{fixture:small-corpora/tinyshakespeare.txt}",
             "--quant", "int8", "--tokens", "2048"]
expect    = { match = "json-last-line", metrics = { top1_agree = ">= 0.95", nll_delta = "<= 0.05" } }
timeout_s = 120

[[step]]
name      = "tiny-quant-fp8"
smoke     = true
run       = "tinyllm"
argv      = ["eval", "ppl", "--model", "{fixture:L7.9/tiny-llama-2l/config.json}", "--data", "{fixture:small-corpora/tinyshakespeare.txt}",
             "--quant", "fp8_e4m3", "--tokens", "2048"]
expect    = { match = "json-last-line", metrics = { top1_agree = ">= 0.8", nll_delta = "<= 0.05" } }
timeout_s = 120

[[step]]
name      = "tiny-quant-q4"
smoke     = true
run       = "tinyllm"
argv      = ["eval", "ppl", "--model", "{fixture:L7.9/tiny-llama-2l/config.json}", "--data", "{fixture:small-corpora/tinyshakespeare.txt}",
             "--quant", "q4_g32", "--tokens", "2048"]
expect    = { match = "json-last-line", metrics = { top1_agree = ">= 0.5", nll_delta = "<= 0.1" } }
timeout_s = 120

# -- 3. speculative decoding: faster, same greedy tokens (L8.6) ------------------------
[[step]]
name      = "spec-ngram-greedy"
smoke     = true
run       = "tinyllm"
argv      = ["generate", "--model", "{fixture:L7.9/tiny-llama-2l/config.json}", "--prompt-file", "{fixture:L7.9/margin-prompts.txt}",
             "--max-tokens", "32", "--greedy", "--spec", "ngram", "--k", "4"]
expect    = { match = "tokens-equal", file = "course/fixtures/L7.9/tiny_greedy_32.json" }
timeout_s = 120

[[step]]
name      = "spec-prompt-lookup-greedy"
smoke     = true
run       = "tinyllm"
argv      = ["generate", "--model", "{fixture:L7.9/tiny-llama-2l/config.json}", "--prompt-file", "{fixture:L7.9/margin-prompts.txt}",
             "--max-tokens", "32", "--greedy", "--spec", "prompt-lookup", "--k", "4"]
expect    = { match = "tokens-equal", file = "course/fixtures/L7.9/tiny_greedy_32.json" }
timeout_s = 120

# The tiny model's greedy output repeats itself, which is what prompt lookup
# feeds on: the reference keeps 43 of 78 drafts (0.55) on these prompts.
[[step]]
name      = "spec-prompt-lookup-acceptance"
smoke     = true
run       = "tinyllm"
argv      = ["generate", "--model", "{fixture:L7.9/tiny-llama-2l/config.json}", "--prompt-file", "{fixture:L7.9/margin-prompts.txt}",
             "--max-tokens", "32", "--greedy", "--spec", "prompt-lookup", "--k", "4"]
expect    = { match = "json-last-line", metrics = { acceptance_rate = ">= 0.3" } }
timeout_s = 120

# -- 4. constrained decoding: every document parses (L8.7) -----------------------------
[[step]]
name      = "constrained-json"
smoke     = true
run       = "tinyllm"
argv      = ["generate", "--model", "{fixture:L7.9/tiny-llama-2l/config.json}", "--prompt-file", "{fixture:L7.9/margin-prompts.txt}",
             "--max-tokens", "80", "--greedy", "--json-schema", "{fixture:MS-L8/tool_schema.json}"]
expect    = { match = "json-last-line", metrics = { valid_fraction = "== 1" } }
timeout_s = 120

[[step]]
name      = "constrained-json-sampled"
smoke     = true
run       = "tinyllm"
argv      = ["generate", "--model", "{fixture:L7.9/tiny-llama-2l/config.json}", "--prompt-file", "{fixture:L7.9/margin-prompts.txt}",
             "--max-tokens", "80", "--temperature", "1.0", "--seed", "7", "--json-schema", "{fixture:MS-L8/tool_schema.json}"]
expect    = { match = "json-last-line", metrics = { valid_fraction = "== 1" } }
timeout_s = 120

# -- 5. nightly: SmolLM2-135M-Instruct (pulled by MS-L7's smollm2-pull) ----------------
[[step]]
name      = "smollm2-cache-equivalence"
ci        = "nightly"
run       = "tinyllm"
argv      = ["generate", "--model", "{models}/HuggingFaceTB--SmolLM2-135M-Instruct/12fd25f77366fa6b3b4b768ec3050bf629380bac",
             "--prompt-file", "{fixture:smollm2-parity/prompts.txt}", "--greedy", "--max-tokens", "32", "--cache", "{cache}", "--kv-dtype", "f16"]
matrix    = { cache = ["none", "contiguous"] }
expect    = { match = "tokens-equal", file = "course/fixtures/smollm2-parity/greedy_32.json", near_tie = { logits = "tinyllm", margin = 1e-3 } }
timeout_s = 900

[[step]]
name      = "smollm2-quant-int8"
ci        = "nightly"
run       = "tinyllm"
argv      = ["eval", "ppl", "--model", "{models}/HuggingFaceTB--SmolLM2-135M-Instruct/12fd25f77366fa6b3b4b768ec3050bf629380bac",
             "--data", "{fixture:small-corpora/tinyshakespeare.txt}", "--quant", "int8", "--tokens", "4096"]
expect    = { match = "json-last-line", metrics = { increase_pct = "<= 1" } }
timeout_s = 1800

[[step]]
name      = "smollm2-quant-q4"
ci        = "nightly"
run       = "tinyllm"
argv      = ["eval", "ppl", "--model", "{models}/HuggingFaceTB--SmolLM2-135M-Instruct/12fd25f77366fa6b3b4b768ec3050bf629380bac",
             "--data", "{fixture:small-corpora/tinyshakespeare.txt}", "--quant", "q4_g32", "--tokens", "4096"]
expect    = { match = "json-last-line", metrics = { increase_pct = "<= 5" } }
timeout_s = 1800

[[step]]
name      = "smollm2-quant-fp8"
ci        = "nightly"
run       = "tinyllm"
argv      = ["eval", "ppl", "--model", "{models}/HuggingFaceTB--SmolLM2-135M-Instruct/12fd25f77366fa6b3b4b768ec3050bf629380bac",
             "--data", "{fixture:small-corpora/tinyshakespeare.txt}", "--quant", "fp8_e4m3", "--tokens", "4096"]
expect    = { match = "json-last-line", metrics = { increase_pct = "<= 2" } }
timeout_s = 1800

[[step]]
name      = "smollm2-spec-ngram-greedy"
ci        = "nightly"
run       = "tinyllm"
argv      = ["generate", "--model", "{models}/HuggingFaceTB--SmolLM2-135M-Instruct/12fd25f77366fa6b3b4b768ec3050bf629380bac",
             "--prompt-file", "{fixture:smollm2-parity/prompts.txt}", "--greedy", "--max-tokens", "32", "--spec", "ngram", "--k", "4"]
expect    = { match = "tokens-equal", file = "course/fixtures/smollm2-parity/greedy_32.json", near_tie = { logits = "tinyllm", margin = 1e-3 } }
timeout_s = 900

# -- 6. local perf: the KV cache pays for itself (ol bench asserts it, never CI) ------
# The reference measured cache_speedup 2.7 on the 2-layer tiny model, where
# Python overhead dominates; DESIGN 4.3's ">= 5" is kept for SmolLM2.
[[step]]
name      = "tiny-decode-cache-speedup"
ci        = "local"
run       = "tinyllm"
argv      = ["bench", "decode", "--model", "{fixture:L7.9/tiny-llama-2l/config.json}", "--tokens", "256"]
expect    = { match = "perf", metric = "cache_speedup", budget = ">= 2" }
timeout_s = 300

[[step]]
name      = "smollm2-decode-cache-speedup"
ci        = "local"
run       = "tinyllm"
argv      = ["bench", "decode", "--model", "{models}/HuggingFaceTB--SmolLM2-135M-Instruct/12fd25f77366fa6b3b4b768ec3050bf629380bac", "--tokens", "256"]
expect    = { match = "perf", metric = "cache_speedup", budget = ">= 5" }
timeout_s = 1800
