# MS-L6: the Part 6 milestone (DESIGN 4.3 "MS-L6", 5.7, 7.2). MS-P5 includes it.
# Page: content/courses/build-an-llm/paths/course-p05-transformer/milestone.md (B7 paths work).
#
# Your objectives and your evaluation harness, run through your own entry
# point: a GPT trained on the byte corpus to the reference's calibrated
# validation loss; a BERT and an ELECTRA pretrained on the same in-domain
# text, each then fine-tuned with LoRA (r = 8) into a sentiment classifier
# that trains under 5% of its parameters and reaches the reference's
# calibrated accuracy; a perplexity with its confidence interval; and the
# model zoo scoring every family trained here in one report.
#
# Data (stand-ins, DEVIATIONS B73-05 and B73-06): the byte corpus of MS-L2
# (course/fixtures/MS-L2/{train,val}.bin) for GPT; the synthetic SST-2-shaped
# set course/fixtures/small-corpora/sst2-2k.tsv (split, sentence, label;
# 1600 train, 400 val) for the classifiers, and its train sentences as a
# token shard, course/fixtures/MS-L6/sst2-train.bin, for BERT and ELECTRA.
# Configs: course/fixtures/configs/{gpt-tiny,bert-tiny}.json.
#
# This file fixes the Pass 5 objective verbs of your `tinyllm` role
# (spec/cli-roles.md, "Verbs of later passes"). Every verb keeps the rules of
# that page: exit 2 on a usage error, the last stdout line is one JSON object.
# The byte tokenizer (D32) with four control bytes as specials: 0 [PAD],
# 1 [CLS], 2 [SEP], 3 [MASK]. Seeds: PCG32(S).substream("init") builds a
# model, .substream("shuffle") draws windows and batches, .substream("sample")
# masks and samples.
#
#   {tinyllm} train gpt --cfg <config.json> --data <train.bin> --val <val.bin> --out <dir> [--steps S] [--seed S]
#       GPTConfig(vocab 256, n_ctx, d_model, n_heads, n_layers, d_ff,
#       dropout from the config); L0.6's TokenStream(seq_len n_ctx, batch);
#       L6.1's fit_gpt for S updates (default: the config's steps) at lr with
#       warmup; save_gpt (tokenizer bytes). val_loss is L6.7's eval_ppl on
#       val.bin with ctx n_ctx and stride n_ctx / 2: the mean NLL in nats.
#       Final line: {"out", "arch": "gpt", "steps", "train_loss" (mean of the
#       last 20 updates), "val_loss", "val_bpb", "params"}.
#
#   {tinyllm} train bert --cfg <config.json> --data <train.bin> --out <dir> [--steps S] [--seed S]
#       BertForMLM(BertConfig(vocab 256, max_len, d_model, n_heads, n_layers,
#       d_ff)); each update draws `batch` windows of `window` bytes at
#       shuffle.below(n - window), wraps each as [CLS] window [SEP], masks with
#       L6.2's mlm_mask (p, the specials never picked, mask id 3), and takes
#       one M10.3 AdamW step (lr, weight_decay). save_bert (tokenizer bytes).
#       Final line: {"out", "arch": "bert", "steps", "mlm_loss" (mean of the
#       last 20), "params"}.
#
#   {tinyllm} train electra --cfg <config.json> --data <train.bin> --out <dir> [--steps S] [--seed S]
#       L6.3's ELECTRA(generator: gen_layers layers of gen_d_ff, discriminator:
#       the config; tied embeddings), the same windows, electra_step with
#       lam = lambda; save_electra(mask_id 3, specials 0 to 3). Final line:
#       {"out", "arch": "electra", "steps", "loss", "disc_loss", "params"}.
#
#   {tinyllm} finetune classify --base <bert or electra dir> --data <split.tsv> --lora r=8[,alpha=16]
#                 --out <dir> [--steps 300] [--batch 16] [--lr 0.003] [--pool mean] [--seed S]
#       The base's encoder (BERT's, or ELECTRA's discriminator body) under an
#       L6.5 SequenceClassifier (2 classes), L6.5's lora_classifier (L6.6
#       adapters on the attention queries and values, the head trainable),
#       train_classifier on the train rows encoded [CLS] bytes [SEP], then
#       merge_lora and save_classifier (arch = the base's). Accuracy on the
#       val rows with M07.4's Wilson interval. Final line: {"out", "arch",
#       "steps", "train_loss", "acc", "acc_lo", "acc_hi", "n",
#       "trainable_frac" (L6.6's, before merging)}.
#
#   {tinyllm} eval ppl --model <gpt dir> --data <tokens.bin> [--ctx C] [--stride S]
#       L6.7's eval_ppl (default ctx n_ctx, stride ctx / 2), one byte per
#       token. Final line: {"model", "arch", "ctx", "stride", "tokens", "ppl",
#       "ppl_lo", "ppl_hi", "bpb", "bpb_lo", "bpb_hi", "nll_mean"}.
#
#   {tinyllm} zoo add --manifest <zoo.json> --id <id> --dir <dir> --task <name> --data <file> [--set key=json ...]
#       Adds (or replaces) one entry of the zoo manifest (contracts/py/tinyllm/eval/zoo.pyi),
#       with absolute paths. Final line: {"manifest", "models", "added"}.
#
#   {tinyllm} eval --suite zoo --manifest <zoo.json> [--out <report.json>] [--seed S]
#       L6.7's run_zoo with PCG32(S).substream("sample"); writes the
#       formats/eval-results.schema.json report (default: zoo-report.json next
#       to the manifest) and prints one line per row. Final line: {"suite",
#       "report", "rows", "ok", "errors", "skipped"}.
#
# `ol milestone MS-L6 --smoke` runs every step with 10% of the updates (about
# a minute on a laptop). The full run takes about 4 minutes.
id       = "MS-L6"
title    = "GPT, BERT, ELECTRA, and LoRA through your CLI, scored by your model zoo"
requires = ["L6.1", "L6.2", "L6.3", "L6.5", "L6.6", "L6.7"]
pass     = 5
ci       = "pr"

# -- 1. GPT on the byte corpus ---------------------------------------------------------------
[[step]]
name       = "gpt-train"
smoke      = true
run        = "tinyllm"
argv       = ["train", "gpt", "--cfg", "{fixture:configs/gpt-tiny.json}", "--data", "{fixture:MS-L2/train.bin}",
              "--val", "{fixture:MS-L2/val.bin}", "--steps", "{steps}", "--seed", "{seed}", "--out", "{out}/gpt"]
vars       = { steps = "2000" }
smoke_vars = { steps = "200" }
expect     = { match = "json-last-line", metrics = { val_loss = "<= calibrated" } }
timeout_s  = 600

[[step]]
name   = "gpt-is-a-model-dir"
smoke  = true
expect = { match = "file-produced", glob = "{out:gpt-train}/gpt/config.json", schema = "course/contracts/formats/config.schema.json", contains = "\"gpt\"" }

# -- 2. BERT and ELECTRA, then LoRA classifiers on both ---------------------------------------
# Sanity bars: the MLM loss below a uniform byte guess (ln 256 = 5.545 nats),
# the replaced-token loss below a coin flip (ln 2 = 0.693).
[[step]]
name       = "bert-train"
smoke      = true
run        = "tinyllm"
argv       = ["train", "bert", "--cfg", "{fixture:configs/bert-tiny.json}", "--data", "{fixture:MS-L6/sst2-train.bin}",
              "--steps", "{steps}", "--seed", "{seed}", "--out", "{out}/bert"]
vars       = { steps = "400" }
smoke_vars = { steps = "40" }
expect     = { match = "json-last-line", metrics = { mlm_loss = "< 5.545" } }
timeout_s  = 600

[[step]]
name       = "electra-train"
smoke      = true
run        = "tinyllm"
argv       = ["train", "electra", "--cfg", "{fixture:configs/bert-tiny.json}", "--data", "{fixture:MS-L6/sst2-train.bin}",
              "--steps", "{steps}", "--seed", "{seed}", "--out", "{out}/electra"]
vars       = { steps = "400" }
smoke_vars = { steps = "40" }
expect     = { match = "json-last-line", metrics = { disc_loss = "< 0.6932" } }
timeout_s  = 600

[[step]]
name       = "finetune-bert"
smoke      = true
run        = "tinyllm"
argv       = ["finetune", "classify", "--base", "{out:bert-train}/bert", "--data", "{fixture:small-corpora/sst2-2k.tsv}",
              "--lora", "r=8", "--steps", "{steps}", "--seed", "{seed}", "--out", "{out}/clf-bert"]
vars       = { steps = "300" }
smoke_vars = { steps = "30" }
expect     = { match = "json-last-line", metrics = { acc = ">= calibrated", trainable_frac = "< 0.05", n = "== 400" } }
timeout_s  = 600

[[step]]
name       = "finetune-electra"
smoke      = true
run        = "tinyllm"
argv       = ["finetune", "classify", "--base", "{out:electra-train}/electra", "--data", "{fixture:small-corpora/sst2-2k.tsv}",
              "--lora", "r=8", "--steps", "{steps}", "--seed", "{seed}", "--out", "{out}/clf-electra"]
vars       = { steps = "300" }
smoke_vars = { steps = "30" }
expect     = { match = "json-last-line", metrics = { acc = ">= calibrated", trainable_frac = "< 0.05", n = "== 400" } }
timeout_s  = 600

# -- 3. a perplexity with its interval ----------------------------------------------------------
[[step]]
name      = "gpt-ppl"
smoke     = true
run       = "tinyllm"
argv      = ["eval", "ppl", "--model", "{out:gpt-train}/gpt", "--data", "{fixture:MS-L2/val.bin}"]
expect    = { match = "json-last-line", metrics = { tokens = "== 14674", ppl = "> 1", ppl_lo = "> 1", ppl_hi = "< 256" } }
timeout_s = 120

# -- 4. the model zoo -----------------------------------------------------------------------------
[[step]]
name      = "zoo-add-gpt"
smoke     = true
run       = "tinyllm"
argv      = ["zoo", "add", "--manifest", "{out}/zoo.json", "--id", "gpt", "--dir", "{out:gpt-train}/gpt",
             "--task", "ts-val", "--data", "{fixture:MS-L2/val.bin}", "--set", "stride=32"]
expect    = { match = "json-last-line", metrics = { models = "== 1" } }
timeout_s = 60

[[step]]
name      = "zoo-add-bert"
smoke     = true
run       = "tinyllm"
argv      = ["zoo", "add", "--manifest", "{out:zoo-add-gpt}/zoo.json", "--id", "bert", "--dir", "{out:bert-train}/bert",
             "--task", "sst2-mlm", "--data", "{fixture:small-corpora/sst2-2k.tsv}"]
expect    = { match = "json-last-line", metrics = { models = "== 2" } }
timeout_s = 60

[[step]]
name      = "zoo-add-electra"
smoke     = true
run       = "tinyllm"
argv      = ["zoo", "add", "--manifest", "{out:zoo-add-gpt}/zoo.json", "--id", "electra", "--dir", "{out:electra-train}/electra",
             "--task", "sst2-rtd", "--data", "{fixture:small-corpora/sst2-2k.tsv}"]
expect    = { match = "json-last-line", metrics = { models = "== 3" } }
timeout_s = 60

[[step]]
name      = "zoo-add-classifiers"
smoke     = true
run       = "tinyllm"
argv      = ["zoo", "add", "--manifest", "{out:zoo-add-gpt}/zoo.json", "--id", "clf-bert", "--dir", "{out:finetune-bert}/clf-bert",
             "--task", "sst2", "--data", "{fixture:small-corpora/sst2-2k.tsv}"]
expect    = { match = "json-last-line", metrics = { models = "== 4" } }
timeout_s = 60

[[step]]
name      = "zoo-add-electra-classifier"
smoke     = true
run       = "tinyllm"
argv      = ["zoo", "add", "--manifest", "{out:zoo-add-gpt}/zoo.json", "--id", "clf-electra", "--dir", "{out:finetune-electra}/clf-electra",
             "--task", "sst2", "--data", "{fixture:small-corpora/sst2-2k.tsv}"]
expect    = { match = "json-last-line", metrics = { models = "== 5" } }
timeout_s = 60

[[step]]
name      = "zoo-eval"
smoke     = true
run       = "tinyllm"
argv      = ["eval", "--suite", "zoo", "--manifest", "{out:zoo-add-gpt}/zoo.json", "--out", "{out}/zoo-report.json", "--seed", "{seed}"]
expect    = { match = "json-last-line", metrics = { rows = "== 5", ok = "== 5", errors = "== 0" } }
timeout_s = 300

[[step]]
name   = "zoo-report-valid"
smoke  = true
expect = { match = "file-produced", glob = "{out:zoo-eval}/zoo-report.json", schema = "course/contracts/formats/eval-results.schema.json", contains = "\"electra\"" }
