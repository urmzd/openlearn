# MS-durable-ha: Raft HA for the durable log (optional; DESIGN 4.4
# "MS-durable-ha", 5.7 catalog). Not part of the MS-P8 gate.
#
# Your durable server with `--replicas 3` (three nodes of your dur.10 Raft,
# talking tl.raft.v1) carries the durable kill loop: workflows run while the
# leader is killed and partitioned away, every acknowledged append survives,
# and the client history is linearizable.
#
# What runs today, and what does not. A local three-replica run needs every
# replica's raft port before the first starts (the runner allocates ports one
# service at a time and starts each before the next exists), and the kill
# loop needs the runner to SIGKILL the current leader, cut links between
# services (testkit chaosproxy), record the history, and check it. The runner
# now SIGKILLs and restarts named services (`chaos.kill`) and starts the
# effects sink (`sink`, matcher `effects`), but leader:<glob> targets,
# `chaos.partition`, `history = "linearizability"`, the `linearizable` check,
# and all-ports-first allocation are not built (DEVIATIONS B103-05, X28), so
# this file holds:
#   - the steps that run now: dur.10's course tests carry the same checks
#     against your raft package in-process (a seeded simulation with
#     partitions, drops, reordering, crash-restarts, and a linearizability
#     check over the client history; a leader kill with 20 acknowledged
#     appends), and on kind your StatefulSet runs three Ready replicas that
#     complete a workflow through the NodePort;
#   - the proposed kill-loop steps, commented at the end, as the target of
#     the harness change.
#
# Your system.toml, besides MS-durable's: on kind, the durable chart renders
# replicas: 3 with [durable].raft.enabled, raft.id from the pod ordinal, and
# the peers `<system>-durable-<i>.<system>-durable-headless:7234` (dep.06's
# headless Service). A follower answers a client RPC with UNAVAILABLE and the
# trailer `tl-raft-leader` (proto/tl/raft/v1/raft.proto); your `ctl` retries
# against the leader it names, so `--durable 127.0.0.1:30733` reaches
# whichever pod the NodePort picks.
id       = "MS-durable-ha"
title    = "Your durable log survives leader kills and partitions on three Raft replicas"
requires = ["dur.10", "MS-durable", "ops.12"]
pass     = 8
ci       = "nightly"

[[step]]
name   = "three-replicas-ready"
ci     = "kind"
expect = { match = "promql", query = "sum(kube_statefulset_status_replicas_ready{namespace=\"{deploy.namespace}\",statefulset=\"{system}-durable\"})", bound = "== 3" }

[[step]]
name      = "workflow-through-the-replicated-server"
ci        = "kind"
run       = "ctl"
argv      = ["wf", "start", "Echo", "--id", "ms-durable-ha-echo", "--input-json", "\"ha\"", "--durable", "127.0.0.1:30733", "--wait", "--json"]
expect    = { match = "json-schema", schema = { type = "object", required = ["status", "result"], properties = { status = { const = "COMPLETED" }, result = { const = "ha" } } } }
timeout_s = 120

# The history reads back through whichever replica the NodePort picks (a
# follower redirects to the leader). Killing the leader between these two
# steps is part of the pending kill loop below.
[[step]]
name      = "history-reads-back-through-any-replica"
ci        = "kind"
run       = "ctl"
argv      = ["wf", "history", "ms-durable-ha-echo", "--durable", "127.0.0.1:30733", "--json"]
expect    = { match = "json-schema", schema = { type = "object", required = ["first", "last"], properties = { first = { const = "WorkflowExecutionStarted" }, last = { const = "WorkflowExecutionCompleted" } } } }
timeout_s = 60

# -- PENDING: the kill loop against three replicas (needs the runner features named in the header:
# leader:<glob>, partition, history, linearizable, and all-ports-first; sink and kill of a
# named service exist)
#
# services = ["durable-1", "durable-2", "durable-3", "worker"]   # ports allocated for all three first
#
