# name      = "kill-loop-with-leader-kills-and-partitions"
# sink      = "effects"
# history   = "linearizability"              # the runner records invoke/return of every client op
# run       = "ctl"
# argv      = ["wf", "start", "tl.test.Batch", "--id", "ms-durable-ha-kill", "--input-json", "500", "--wait", "--json"]
# chaos     = { kill = ["leader:durable-*"], partition = ["leader:durable-*"], every_s = "3..8", count = 12, seed = 1 }
# expect    = { match = "effects", keys = "0..499", prefix = "ms-durable-ha-kill/", exactly_once = true, linearizable = true }
# timeout_s = 900

# ops.12 is an optional end-to-end partition drill. The module verdict covers
# fault detection and its postmortem; this step keeps its runbook present in
# the learner's Raft HA deployment.
[[step]]
name   = "ops.12-raft-partition-runbook-present"
ci     = "kind"
expect = { match = "file-produced", glob = "docs/runbooks/RaftPartition.md", contains = "linearizability" }
