# Pass 0 gate (DESIGN 5.7 milestone catalog, 7.4). Page: paths/course-p00-setup/milestone.md
#
# Pass condition: the learner's own CI (commit lint, native tests, and
# `ol check --all --ci`) is green on their first conventional commit, and the
# lang.01 and lang.02 primer exercises pass. `requires` makes the primers and
# craft.01 gate the run (exit 3 until each has a fresh pass of your own).
# Both steps are smoke steps, so every later pass gate (MS-P1 onwards) reruns
# them: a red CI or a non-conventional HEAD breaks every later gate too.
id       = "MS-P0"
title    = "Your repo's CI is green on your first conventional commit"
requires = ["lang.01", "lang.02", "craft.01"]
pass     = 0
ci       = "pr"

[[step]]
name   = "HEAD is a conventional commit"
smoke  = true
expect = { match = "git-log", n = 1 }

[[step]]
name   = "your CI is green"
smoke  = true
expect = { match = "ci-status" }     # GitHub remote: latest run on the default branch; otherwise [ci].local in system.toml
