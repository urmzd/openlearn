# My triage of the ten survivors (primers/craft.07/survivors/): for each, is
# it equivalent (no test can tell it from the reference) or killable (a real
# bug my suite missed)? A killable one names the test that now kills it.

[s01]
verdict = "equivalent"
reason  = "with hyp_len == ref_len the penalty is exp(1 - 1) = 1 either way, and hyp_len = 0 never gets there: no match returns 0 first"

[s02]
verdict = "killable"
reason  = "equidistant references now resolve to the longer one; a 7-token hypothesis against 9 and 5 tokens shows it"
test    = "test_closest_reference_tie_goes_to_the_shorter"

[s03]
verdict = "equivalent"
reason  = "total_n = 0 means the hypothesis is shorter than n tokens, so every higher order is 0 too and every remaining log stays log 0"

[s04]
verdict = "killable"
reason  = "without unescaping, &amp; tokenizes as & amp ; and no longer matches a reference &"
test    = "test_13a_unescapes_entities"

[s05]
verdict = "equivalent"
reason  = "when c equals the stored maximum, the assignment writes the value that is already there"

[s06]
verdict = "killable"
reason  = "two references can tie on sentence chrF with different statistics; keeping the last changes the pooled corpus score"
test    = "test_chrf_best_reference_tie_keeps_the_first"

[s07]
verdict = "killable"
reason  = "13a deletes a dash-newline pair, so a line ending in '-\\n' tokenizes differently without the rstrip"
test    = "test_13a_sees_the_line_after_rstrip"

[s08]
verdict = "equivalent"
reason  = "every bootstrap resample has exactly n rows, so len(picked) == len(rows) on every call"

[s09]
verdict = "killable"
reason  = "a reference shorter than the order adds hypothesis n-grams to the pooled precision denominator"
test    = "test_chrf_hypothesis_count_needs_reference_ngrams"

[s10]
verdict = "equivalent"
reason  = "precision and recall are averages of non-negative ratios, so their sum is never below zero"
