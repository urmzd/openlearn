# primers/craft.06/budget.toml: the performance budget my gate enforces.
#
# A metric is nanoseconds per call (lower is better). The gate times the
# base and the head kernels.c alternately, `runs` times each, keeps the best
# of each, and fails when head > base * (1 + budget). 0.30 allows 30% of
# noise and still catches a 2x slowdown (+100%) with room to spare.
runs = 3

[budget]
matmul_ns = 0.30
sum_ns = 0.30
rmsnorm_ns = 0.30
count_below_ns = 0.50   # microseconds per call: the noisiest metric
