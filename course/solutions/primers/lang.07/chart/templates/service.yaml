apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-hello
  labels:
    {{- include "hello.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "hello.labels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      nodePort: {{ .Values.service.nodePort }}
