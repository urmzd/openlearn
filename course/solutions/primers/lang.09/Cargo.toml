# primers/lang.09: async Rust on tokio and hyper (lang.09 section 4).
# One package, two targets:
#
#   src/lib.rs   the `ticker` library: the SSE producer over a bounded
#                channel, bounded admission, the routes, the server loop
#   src/main.rs  the `ticker` binary: --port, SIGTERM drains and exits 0
[package]
name = "ticker"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ticker"
path = "src/main.rs"

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
