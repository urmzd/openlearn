# The system's Python project: the `tinyllm` CLI and every
# Python unit under python/tinyllm/. Not a built package: the CLI runs as a script (spec/cli-roles.md).
[project]
name = "tinyllm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pyarrow>=18", "zstandard>=0.23", "pillow>=11"]

[tool.uv]
package = false
