apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: forge-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-agent
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--queue", "agent", "--durable-address", "{{ .Values.durableAddress }}"]
          env:
            - name: PROVIDER_BASE_URL
              value: {{ .Values.provider.baseUrl | quote }}
            - name: PROVIDER_MODEL
              value: {{ .Values.provider.model | quote }}
            - name: PROVIDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.provider.apiKey.name }}
                  key: {{ .Values.provider.apiKey.key }}
          ports:
            - name: health
              containerPort: 9464
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: health
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: health
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
          volumeMounts:
            - name: artifacts
              mountPath: {{ .Values.artifacts.mountPath }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifacts
          hostPath:
            path: {{ .Values.artifacts.hostPath }}
            type: Directory
        - name: tmp
          emptyDir: {}
