# Tells tools (Tilt, ko, skaffold) where the cluster's local registry is
# (KEP-1755, "Communicating a local registry"). up.sh applies it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-registry-hosting
  namespace: kube-public
data:
  localRegistryHosting.v1: |
    host: "localhost:5001"
    help: "https://kind.sigs.k8s.io/docs/user/local-registry/"
