# rust/Cargo.toml: the Cargo workspace of the Rust side of the system. Later
# modules add members and dependencies here as they create crates (tl-ds,
# tl-tok, tl-engine).
[workspace]
resolver = "2"
members = ["crates/tl-serve", "crates/tl-ds", "crates/tl-tok", "crates/tl-engine", "crates/tl-kv-format"]
