# tl-tok: byte-level BPE exact against GPT-2 and SmolLM2, the tokenizer.json
# loader, the streaming UTF-8 decoder, and the byte tokenizer (L1.5).
# The binary src/main.rs (`tl-tok encode`, `tl-tok bench`) is yours (D16).
[package]
name = "tl-tok"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
tl-ds = { path = "../tl-ds" }
serde_json = "1"

[dev-dependencies]
proptest = "1"
