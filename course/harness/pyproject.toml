[project]
name = "olcourse"
version = "0.1.0"
description = "Course harness behind practice/bin/ol: registry, overlay, stubber, verdicts, lint, verify"
requires-python = ">=3.11"
# The core harness is stdlib only (tomllib, ast, subprocess) plus PyYAML,
# which `ol conform` needs to read the OpenAPI contracts, and SymPy, which only
# the solve checker's subprocess imports (olcourse.solve_worker). Learner-facing
# test dependencies (pytest, hypothesis, numpy) are resolved in the learner's
# own uv environment with `uv run --with`, never here.
dependencies = [
    "pyyaml>=6",
    "sympy>=1.13",
]

[dependency-groups]
dev = ["pytest>=8", "numpy>=2", "pyarrow>=18", "zstandard>=0.23", "pillow>=11"]

[build-system]
requires = ["uv_build>=0.8.3,<0.9"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests", "../../practice/bin/tests"]
