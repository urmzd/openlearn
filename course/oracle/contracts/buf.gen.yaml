# Go output for course/contracts/go/gen (DESIGN 2.7). Run gen-proto.sh, not
# buf directly: it builds the pinned plugins first.
version: v2
plugins:
  - local: protoc-gen-go
    out: ../../contracts/go/gen
    opt: module=openlearn.urmzd.com/tl/contracts/gen
  - local: protoc-gen-go-grpc
    out: ../../contracts/go/gen
    opt: module=openlearn.urmzd.com/tl/contracts/gen
