# The reference system's harness manifest (DESIGN 2.16, 3.2). `ss verify
# course --e2e` copies it into a learner repo assembled from course/ref and
# course/ref/entry; milestone roles point at the reference entry points.
[system]
name = "forge"
version = "0.1.0"
course_version = "0.1.0"

# Run from the repo root before any service starts. The last step trains the
# model directory the engine entry serves (MS-P1).
[build]
steps = [
  ["cargo", "build", "--release", "--quiet", "--manifest-path", "rust/Cargo.toml", "-p", "tl-serve"],
  # The gateway (its --config form routes through gw.05, which calls the
  # engine's gRPC services), durable, worker, and ctl import the vendored
  # contracts module, which builds in workspace mode (see go/go.mod). The
  # workspace file lives in go/bin, which git ignores; GOWORK must be absolute.
  ["sh", "-c", "mkdir -p go/bin && cd go/bin && rm -f go.work && go work init .. ../../contracts/go"],
  ["sh", "-c", "GOWORK=\"$PWD/go/bin/go.work\" exec go build -C go -o \"bin/$0\" \"./cmd/$0\"", "gateway"],
  # Pass 7 (MS-L10, MS-prod): the load generator.
  ["sh", "-c", "GOWORK=\"$PWD/go/bin/go.work\" exec go build -C go -o \"bin/$0\" \"./cmd/$0\"", "loadgen"],
  ["sh", "-c", "GOWORK=\"$PWD/go/bin/go.work\" exec go build -C go -o \"bin/$0\" \"./cmd/$0\"", "durable"],
  ["sh", "-c", "GOWORK=\"$PWD/go/bin/go.work\" exec go build -C go -o \"bin/$0\" \"./cmd/$0\"", "worker"],
  ["sh", "-c", "GOWORK=\"$PWD/go/bin/go.work\" exec go build -C go -o \"bin/$0\" \"./cmd/$0\"", "ctl"],
  # Pass 10 (MS-agent): the agent worker, the course-docs RAG index that
  # `ctl agent ask --suite course-docs` searches (ag.06, hash16 vectors), and
  # the hash16 usage-policy head the local gateway's policy reads (gw.08).
  ["sh", "-c", "GOWORK=\"$PWD/go/bin/go.work\" exec go build -C go -o \"bin/$0\" \"./cmd/$0\"", "agent"],
  ["go/bin/ctl", "rag", "ingest", "--source", "docs", "--index", "artifacts/rag/course-docs"],
  ["uv", "run", "--quiet", "--project", "python", "python", "scripts/fit_policy_head.py",
   "--data", "config/policy-train.jsonl", "--out", "artifacts/models/hash16/heads/usage.json"],
  ["uv", "run", "--quiet", "--project", "python", "python", "python/tinyllm/__main__.py",
   "train", "bigram", "--data", "{fixture:MS-P1/corpus.txt}", "--out", "artifacts/models/bigram"],
  # The model the v1 engine serves in PR CI: L7.9's committed tiny-llama-2l,
  # in its 1024-position copy (tiny-llama-2l-1k: same weights) so a tool
  # request's schema prompt fits.
  ["sh", "-c", "mkdir -p artifacts/models/tiny && cp \"$0/config.json\" \"$0/model.safetensors\" artifacts/models/tiny/",
   "{fixture:L7.9/tiny-llama-2l-1k}"],
]

[entry]
tinyllm = ["uv", "run", "--quiet", "--project", "python", "python", "python/tinyllm/__main__.py"]
# The v1 server (L10.5) with its runtime.toml template; `--model-dir` (the tracer form)
# is still accepted for the Pass 1 entry point.
engine  = ["rust/target/release/tl-serve", "--config", "{config}"]
# The --config form (gw.01): config/gateway.runtime.toml. The tracer form
# (--port, --health-port, --upstream) still works for the Pass 1 entry point.
gateway = ["go/bin/gateway", "--config", "{config}"]
# Pass 7 (load.01): `{loadgen} --target ...` and `{loadgen} compare ...`.
loadgen = ["go/bin/loadgen"]
# Pass 3 (MS-L1): built on first use, so the earlier passes' [build] stays as it was.
tl-tok  = ["cargo", "run", "--release", "--quiet", "--manifest-path", "rust/Cargo.toml", "-p", "tl-tok", "--"]
# Pass 3 (MS-corpus): the Python corpus CLI.
corpus  = ["uv", "run", "--quiet", "--project", "python", "python", "python/corpus/__main__.py"]
# Pass 8 (MS-durable): the durable server, the worker (its Python activities
# exec the tinyllm and corpus entries above, named by environment variables),
# and the umbrella CLI.
durable = ["go/bin/durable", "--config", "{config}"]
worker  = ["env",
           "TL_TINYLLM_ENTRY=uv run --quiet --project python python python/tinyllm/__main__.py",
           "TL_CORPUS_ENTRY=uv run --quiet --project python python python/corpus/__main__.py",
           "go/bin/worker"]
ctl     = ["go/bin/ctl"]
# Pass 10 (MS-agent): the agent worker (AgentRun on the agent queue).
agent   = ["go/bin/agent"]

[services.engine]
config = "config/engine.runtime.toml"
health = "http://127.0.0.1:{health_port}/healthz"
ready_timeout_s = 30

# MS-L10: the same engine with prompt-lookup speculation on.
[services.engine-spec]
entry   = "engine"
section = "engine"
config = "config/engine-spec.runtime.toml"
health = "http://127.0.0.1:{health_port}/healthz"
ready_timeout_s = 30

# MS-L10, the disagg suite: one prefill engine and two decode engines of the
# same model. The harness fills [engine].grpc_listen (EngineControl) and
# kv_listen (tl.kv.v1) with allocated ports, and passes P a decode engine's
# {kv_port} as Prefill's decode_target.
[services.engine-prefill]
entry   = "engine"
section = "engine"
config = "config/engine-prefill.runtime.toml"
health = "http://127.0.0.1:{health_port}/healthz"
ready_timeout_s = 30

[services.engine-decode-a]
entry   = "engine"
section = "engine"
config = "config/engine-decode.runtime.toml"
health = "http://127.0.0.1:{health_port}/healthz"
ready_timeout_s = 30

[services.engine-decode-b]
entry   = "engine"
section = "engine"
config = "config/engine-decode.runtime.toml"
health = "http://127.0.0.1:{health_port}/healthz"
ready_timeout_s = 30

[services.gateway]
config = "config/gateway.runtime.toml"
health = "http://127.0.0.1:{health_port}/readyz"
after = ["engine"]
ready_timeout_s = 30

# MS-durable: the WAL under {data}; one worker on both queues (default for
# the test workflows and TrainRun, data for CorpusBuild), its artifacts root
# {data} (config/worker.runtime.toml).
[services.durable]
config = "config/durable.runtime.toml"
health = "http://127.0.0.1:{health_port}/healthz"
ready_timeout_s = 30

[services.worker]
config = "config/worker.runtime.toml"
args = ["--config", "{config}", "--queue", "default,data", "--durable", "127.0.0.1:{durable.grpc_port}", "--test-activities"]
health = "http://127.0.0.1:{health_port}/healthz"
after = ["durable"]
ready_timeout_s = 30

# MS-agent: the agent worker on the agent queue (config/agent.runtime.toml):
# faketool rules for the model in PR CI, the course-docs index.
[services.agent]
config = "config/agent.runtime.toml"
args = ["--config", "{config}"]
health = "http://127.0.0.1:{health_port}/readyz"
after = ["durable"]
ready_timeout_s = 30

[endpoints]
api_base    = "http://127.0.0.1:{gateway.port}/v1"
api_key_env = "TL_API_KEY"
model       = "tracer"

# MS-P0 ci-status without a GitHub remote: the reference runs its CI locally.
[ci]
local = [["bash", "scripts/ci-local.sh"]]

# The kind deployment of dep.00 (chapter section 2.7).
[deploy]
kube_context = "kind-forge"
namespace    = "forge"
gateway_url  = "http://127.0.0.1:30080"
prometheus   = "http://127.0.0.1:30090"   # dep.03: kube-prometheus-stack, NodePort 30090
traces       = "http://127.0.0.1:30686"
services     = { engine = "deploy/forge-engine", gateway = "deploy/forge-gateway" }
