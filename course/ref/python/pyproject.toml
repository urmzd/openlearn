# The learner's python/pyproject.toml (DESIGN 2.15). `ol start` copies it into
# your repo when python/pyproject.toml is absent and never rewrites it: add your
# own dependencies to your copy. The course tests run in this project's
# environment (DESIGN 5.4), so a package your units import must be listed here.
#
# Dependencies are the contracts/allowed-deps.toml entries the course units
# use so far: numpy (tinyllm, corpus), zstandard (corpus raw documents,
# formats/corpus-shard.md; data.01), and pyarrow (corpus Parquet shards;
# data.06).
[project]
name = "tinyllm-course"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "pyarrow>=18", "zstandard>=0.23"]

[tool.uv]
package = false
