# ops.02 durable-kill9 (DESIGN 4.5, 5.10). Chapter:
# systems/05-incident-response-and-chaos/02-durable-kill9.md
#
# While your CorpusBuild `drill-kill9` runs on kind (`ol drill start` starts
# it, the [workload] below, before the first kill), the durable server's
# pod is SIGKILLed five times, 30 s apart (`kubectl delete pod
# --grace-period=0 --force`: the container gets SIGKILL, never SIGTERM). Each
# time the StatefulSet recreates the pod on the same WAL claim, the server
# recovers its log (dur.01), and every activity whose lease was live when it
# died is delivered again after its visibility timeout: redeliveries spike.
# The build must still finish with exactly the corpus a clean run produces,
# every shard written once.
#
# Detection is your alert DurableRedeliveriesSpike (deploy/observability/
# rules/durable.yaml, this drill's artifact), on tl_durable_redeliveries_total
# from otel/metrics.yaml. The durable alerts are not SLO burn alerts, so this
# drill runs without an SLO profile.
id             = "ops.02"
title          = "The durable server is SIGKILLed in a loop during a corpus build"
# The charts it kills pods of (dep.06) and the control-plane scrapes and
# dashboard it is diagnosed on (obs.05). MS-durable cannot be required: it
# requires ops.02.
requires       = ["dep.06", "obs.05"]
seeded         = true                  # which replica dies (one, today) is seeded, revealed at `end`
time_limit_min = 45
symptom        = "PAGE: DurableRedeliveriesSpike: activity tasks are being delivered again and again; the corpus build drill-kill9 has not finished"

# The build the kills land in: `ol drill start` runs this command through
# your [entry].ctl in the background before the first injection (its output
# in .ol/drills/<run>/workload.log); `ol drill reset` kills it if it still runs.
[workload]
role = "ctl"
argv = ["data", "build", "--config", "{fixture:MS-corpus/corpus.toml}", "--id", "drill-kill9", "--durable", "127.0.0.1:30733", "--json"]

[[inject]]
kind   = "pod-kill"
target = "{deploy.services.durable}"
pick   = "random-ready-replica"
at     = "+20s"

[[inject]]
kind   = "pod-kill"
target = "{deploy.services.durable}"
at     = "+30s"                        # each `at` counts from the previous injection

[[inject]]
kind   = "pod-kill"
target = "{deploy.services.durable}"
at     = "+30s"

[[inject]]
kind   = "pod-kill"
target = "{deploy.services.durable}"
at     = "+30s"

[[inject]]
kind   = "pod-kill"
target = "{deploy.services.durable}"
at     = "+30s"

[detect]
alert    = "DurableRedeliveriesSpike"
within_s = 300

# Resolved: the server and the workers are whole, nothing is dead-lettered,
# and every queue drained (the build finished), each held for a minute.
[[resolve.check]]
rollout   = "{deploy.services.durable}"
timeout_s = 120

[[resolve.check]]
rollout   = "{deploy.services.worker}"
timeout_s = 120

[[resolve.check]]
promql = "(sum(tl_durable_dlq_size{namespace=\"{deploy.namespace}\"}) or vector(0)) == 0"
hold_s = 60

[[resolve.check]]
promql = "(sum(tl_durable_task_queue_depth{namespace=\"{deploy.namespace}\"}) or vector(0)) == 0"
hold_s = 60

# The pass condition of DESIGN 4.5 (the corpus equals a clean run's; every
# effect happened once) is two command checks `ol drill end` runs as resolve
# checks, graded with the milestone matchers:
#   1. The same start again returns the finished run (started = false) and
#      its result holds the clean-run numbers MS-corpus fixes.
#   2. data.08's ledger check over the artifacts: one ledger row per source
#      document and shard, none twice.
[[resolve.run]]
role   = "ctl"
argv   = ["data", "build", "--config", "{fixture:MS-corpus/corpus.toml}", "--id", "drill-kill9", "--durable", "127.0.0.1:30733", "--wait", "--json"]
expect = { match = "json-last-line", metrics = { n_docs = "== 169", n_shards = "== 3", train_tokens = "== 75164", val_tokens = "== 6868" } }

[[resolve.run]]
role   = "corpus"
argv   = ["ledger", "verify", "--config", "{fixture:MS-corpus/corpus.toml}"]
env    = { TL_ARTIFACTS = "artifacts" }   # kind mounts ./artifacts as the workers' /artifacts (dep.02)

# Evidence: one CorpusBuild activity span tree in the window (obs.05).
[evidence.trace]
service  = "{system}-worker"
services = ["{system}-worker"]
spans    = ["workflow CorpusBuild"]

[[doc]]
label    = "runbook"
path     = "docs/runbooks/DurableRedeliveriesSpike.md"
sections = ["Symptoms", "Diagnosis", "Mitigation"]

[postmortem]
path     = "docs/postmortems/{date}-durable-kill9.md"
sections = ["Summary", "Impact", "Timeline", "Root cause", "Detection", "Resolution", "Action items"]
