# ops.03 poison-task (DESIGN 4.5, 5.10). Chapter:
# content/tracks/systems/05-incident-response-and-chaos/03-poison-task.md
#
# A bad rollout ships a debug fault to the workers: the worker Deployment
# gains TL_FAILPOINTS=dur/activity/poison/shard-00001=panic, so the activity
# shard-00001 of every CorpusBuild panics on every attempt. Each attempt is a
# retryable failure (type Panic); after [durable].dlq_after_attempts (5)
# deliveries the task is dead-lettered and the build `drill-poison` waits on
# it forever. Detection is your alert DurableDeadLetters on tl_durable_dlq_size.
# You find the cause, remove it with a rollout, redrive the dead letter, and
# the build completes.
#
# Contract this drill relies on (DEVIATIONS B103-07): before it runs an
# activity task, your worker (dur.04) evaluates the failpoint
# `dur/activity/poison/<activity id>` with the TL_FAILPOINTS syntax of
# course/testkit (crash, panic, error(msg), sleep(d)); a panic in an activity
# is recovered by the worker and reported as a retryable failure of type
# Panic. CorpusBuild (data.09) gives its per-shard tasks the activity ids
# shard-00000, shard-00001, ...
id             = "ops.03"
title          = "A poison task lands in the dead-letter queue"
requires       = ["dep.06", "obs.05"]
seeded         = false
time_limit_min = 45
symptom        = "PAGE: DurableDeadLetters: queue data has dead-lettered tasks; the corpus build drill-poison has stopped making progress"

[[inject]]
kind      = "activity-poison"
target    = "{deploy.services.worker}"
failpoint = "dur/activity/poison/shard-00001"
action    = "panic"
at        = "start"

# The build the poison lands in, started once the poisoned workers are rolled
# out: after the injection, `ol drill start` waits for `kubectl rollout
# status` on the workers, then runs this command through your [entry].ctl in
# the background (.ol/drills/<run>/workload.log); `ol drill reset` kills it.
[workload]
role         = "ctl"
argv         = ["data", "build", "--config", "{fixture:MS-corpus/corpus.toml}", "--id", "drill-poison", "--durable", "127.0.0.1:30733", "--json"]
after_inject = true
wait_rollout = "{deploy.services.worker}"

[detect]
alert    = "DurableDeadLetters"
within_s = 600                         # 5 attempts with backoff 1, 2, 4, 8 s plus the rollout and the scrape

# Resolved: the workers run a clean rollout, the dead letter was redriven and
# done, every queue drained, each held for a minute.
[[resolve.check]]
rollout   = "{deploy.services.worker}"
timeout_s = 120

[[resolve.check]]
promql = "(sum(tl_durable_dlq_size{namespace=\"{deploy.namespace}\"}) or vector(0)) == 0"
hold_s = 60

[[resolve.check]]
promql = "(sum(tl_durable_task_queue_depth{namespace=\"{deploy.namespace}\"}) or vector(0)) == 0"
hold_s = 60

# The workflow completed, with nothing dead-lettered: a command check
# `ol drill end` runs as a resolve check.
[[resolve.run]]
role   = "ctl"
argv   = ["wf", "describe", "drill-poison", "--durable", "127.0.0.1:30733", "--json"]
expect = { match = "json-schema", schema = { type = "object", required = ["status", "dead_lettered"], properties = { status = { const = "COMPLETED" }, dead_lettered = { const = 0 } } } }

[[doc]]
label    = "runbook"
path     = "docs/runbooks/DurableDeadLetters.md"
sections = ["Symptoms", "Diagnosis", "Mitigation"]

[postmortem]
path     = "docs/postmortems/{date}-poison-task.md"
sections = ["Summary", "Impact", "Timeline", "Root cause", "Detection", "Resolution", "Action items"]
