# ops.00 engine-crashloop (DESIGN 4.5, 5.10). Chapter:
# content/tracks/systems/05-incident-response-and-chaos/00-first-drill.md
#
# A bad rollout points the engine at a model directory that does not exist.
# The engine exits at startup, Kubernetes restarts it with growing back-off
# (CrashLoopBackOff), the gateway's /readyz turns 503, and every completion
# through the gateway fails with 503 no_capacity.
#
# There is no Prometheus before Pass 7, so there is no [detect] block: you
# detect by hand with kubectl and the symptom is graded manually (DESIGN 4.5).
id             = "ops.00"
title          = "The engine crashloops after a bad rollout"
requires       = ["dep.00"]
seeded         = false
time_limit_min = 45
symptom        = "PAGE: the engine has been restarting in a loop since the last rollout; users may get 503 no_capacity"

# The tracer engine takes flags (spec/cli-roles.md, tracer form), and inside
# Kubernetes it listens on 8000 (HTTP) and 9464 (health) (DESIGN 2.13). The
# patch replaces the engine container's args with the same flags pointing at
# /missing; `ol drill reset` restores your args from the journal.
[[inject]]
kind      = "deploy-patch"
target    = "{deploy.services.engine}"
container = 0
args      = ["--model-dir", "/missing", "--port", "8000", "--health-port", "9464"]

# Resolved (DESIGN 4.5: rollout healthy): the engine rollout has converged, and
# the gateway NodePort serves the v0 smoke cases again through it.
[[resolve.check]]
rollout   = "{deploy.services.engine}"
timeout_s = 60

[[resolve.check]]
suite = "openapi:v0:gateway:smoke"

# The runbook this drill teaches (DESIGN 4.5), graded by `ol drill end` like
# the postmortem.
[[doc]]
label    = "runbook"
path     = "docs/runbooks/engine-crashloop.md"
sections = ["Symptoms", "Diagnosis", "Mitigation"]

[postmortem]
path     = "docs/postmortems/{date}-engine-crashloop.md"
sections = ["Summary", "Impact", "Timeline", "Root cause", "Detection", "Resolution", "Action items"]
