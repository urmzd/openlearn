# ops.01 kill-decode (DESIGN 4.5, 5.10). Chapter:
# content/tracks/systems/05-incident-response-and-chaos/01-kill-decode.md
#
# Under load (your loadgen at 20 rps through the gateway NodePort), one ready
# decode pod is deleted with no grace period. Its in-flight streams die mid
# generation; Kubernetes starts a replacement, which loads the model and warms
# up before it is Ready; until then the surviving decode replica carries the
# whole load, its queue grows, and TTFT climbs. The gateway must fail new
# requests over before the first byte and end the broken streams with an SSE
# error event, never by truncating them or splicing another engine's tokens in.
#
# Detection is the fast TTFT burn alert of obs.03, under the drill SLO profile
# (windows compressed 12x: 5m/25s), so it can fire within the 300 s budget.
id             = "ops.01"
title          = "A decode worker dies mid-stream"
# The serving SLO rules (obs.03) are what detects it. MS-prod cannot be
# required here: it requires ops.01 itself (B95-07).
requires       = ["obs.03"]
seeded         = true                  # which replica dies is chosen from --seed, revealed at `end`
time_limit_min = 45                    # enforced locally; CI uses respond.sh instead
slo_profile    = "drill"
symptom        = "PAGE: TTFTBudgetBurnFast (drill profile): time to first token is burning the error budget; some users report streams that stop mid-sentence"

# Your loadgen (load.01), started by `ol drill start` before the injection.
[loadgen]
argv = ["--target", "{deploy.gateway_url}", "--rate", "20", "--duration", "900s", "--seed", "1"]

[[inject]]
kind   = "pod-kill"
target = "{deploy.services.decode}"
pick   = "random-ready-replica"
at     = "loadgen+30s"                 # 30 s of steady load first, so there is a baseline

[detect]
alert    = "TTFTBudgetBurnFast"        # a name fixed by otel/slo.schema.json
within_s = 300

# Resolved (DESIGN 4.5 ops.01): the decode Deployment is whole again, TTFT p95
# is back under 500 ms and the 5xx ratio under budget, each held, and the API
# contract still holds through the gateway.
[[resolve.check]]
rollout   = "{deploy.services.decode}"
timeout_s = 120

[[resolve.check]]
promql = "histogram_quantile(0.95, sum(rate(gen_ai_server_time_to_first_token_seconds_bucket{job=\"{system}-gateway\"}[5m])) by (le)) < 0.5"
hold_s = 300

[[resolve.check]]
promql = "sum(rate(http_server_request_duration_seconds_count{job=\"{system}-gateway\",http_response_status_code=~\"5..\"}[5m])) / sum(rate(http_server_request_duration_seconds_count{job=\"{system}-gateway\"}[5m])) < 0.005"
hold_s = 120

[[resolve.check]]
suite = "openapi:v1:gateway:smoke"

# Evidence: one trace of the window spans the gateway and an engine, so the
# postmortem's timeline can point at real requests.
[evidence.trace]
service = "{system}-gateway"
services = ["{system}-gateway", "{system}-engine"]
spans    = ["gateway.proxy"]

# The page links here (the alert's runbook annotation, obs.03).
[[doc]]
label    = "runbook"
path     = "docs/runbooks/TTFTBudgetBurnFast.md"
sections = ["Symptoms", "Diagnosis", "Mitigation"]

[postmortem]
path     = "docs/postmortems/{date}-kill-decode.md"
sections = ["Summary", "Impact", "Timeline", "Root cause", "Detection", "Resolution", "Action items"]
