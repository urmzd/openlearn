# S-M03a answer key (hidden; honor system, DESIGN D34). `ol verify course S-M03a`
# check 7 proves every `expect` passes and every `reject` canary fails;
# course/oracle/solve/S-M03a.py recomputes every value independently.
# 48 items, 4 proofs (DESIGN 4.2): Gauss/LU (q1-q10), span, basis, dimension
# (q11-q20), maps and rank-nullity (q21-q28), determinants (q29-q34), eigen
# (q35-q44), orthogonality and QR (q45-q48).

# ---- Gaussian elimination and LU ----------------------------------------------------

[q1]
type   = "vector"
expect = "[-4, 9/2]"
[[q1.reject]]
answer = "[9/2, -4]"               # x and y swapped

[q2]
type   = "vector"
expect = "[1, 2, 3]"
[[q2.reject]]
answer = "[3, 2, 1]"

[q3]
type   = "matrix"
expect = "[[1, 2, 0], [0, 0, 1]]"
[[q3.reject]]
answer = "[[1, 2, 3], [0, 0, 1]]"  # echelon form, not reduced

# why: M03.2's lu returns exactly these factors (with P = I here).
[q4]
type   = "matrix"
expect = "[[1, 0], [2, 1]]"
[[q4.reject]]
answer = "[[1, 0], [1/2, 1]]"      # multiplier inverted

[q5]
type   = "matrix"
expect = "[[2, 1], [0, 3]]"
[[q5.reject]]
answer = "[[2, 1], [0, 5]]"        # forgot to subtract 2 * row 1

# why: partial pivoting puts the largest |pivot| on top, so every multiplier has |l| <= 1.
[q6]
type   = "matrix"
expect = "[[1, 0], [1/3, 1]]"
[[q6.reject]]
answer = "[[1, 0], [3, 1]]"        # no pivoting

[q7]
type   = "matrix"
expect = "[[3, 4], [0, 2/3]]"
[[q7.reject]]
answer = "[[1, 2], [0, -2]]"       # no pivoting

[q8]
type   = "number"
expect = "0"
exact  = true
[[q8.reject]]
answer = "1"

[q9]
type   = "set"
expect = "{1}"
[[q9.reject]]
answer = "{1, -1}"                 # k = -1 makes the system inconsistent, not underdetermined

[q10]
type   = "proof"
rubric = [
  "Existence: shows x = A^-1 b satisfies Ax = b",
  "Uniqueness: assumes Ax = b and Ay = b and derives x = y (for example A(x - y) = 0, then multiply by A^-1)",
  "Uses only the definition of the inverse (A^-1 A = A A^-1 = I) and associativity",
  "Concludes exactly one solution for every b",
]

# ---- span, independence, basis, dimension ---------------------------------------

[q11]
type   = "bool"
expect = "true"
[[q11.reject]]
answer = "false"

[q12]
type   = "bool"
expect = "false"
[[q12.reject]]
answer = "true"

[q13]
type   = "number"
expect = "2"
exact  = true
[[q13.reject]]
answer = "3"                       # (1, 1, 2) is the sum of the other two

[q14]
type   = "basis"
expect = "[[1, 2, 3]]"
[[q14.reject]]
answer = "[[1, 2, 3], [2, 4, 6]]"  # dependent vectors are not a basis

[q15]
type   = "basis"
expect = "[[-1, 1, 0], [-1, 0, 1]]"
[[q15.reject]]
answer = "[[1, 1, 1]]"             # the row space, not the null space
[[q15.reject]]
answer = "[[-1, 1, 0]]"            # one vector short

[q16]
type   = "vector"
expect = "[4, -1]"
[[q16.reject]]
answer = "[-1, 4]"

[q17]
type   = "number"
expect = "3"
exact  = true
[[q17.reject]]
answer = "4"

[q18]
type   = "set"
expect = "{-2, 2}"
[[q18.reject]]
answer = "{2}"                     # the negative root dropped

[q19]
type   = "number"
expect = "2"
exact  = true
[[q19.reject]]
answer = "1"                       # the rank, not the nullity

[q20]
type   = "proof"
rubric = [
  "Writes the n + 1 vectors as the columns of an n x (n + 1) matrix A, so dependence means Ac = 0 for some c != 0",
  "Argues Ac = 0 has a nonzero solution: elimination leaves at most n pivots, so at least one free variable",
  "Uses the free variable to build a nonzero c explicitly (set it to 1 and solve for the pivots)",
  "Concludes the vectors are linearly dependent",
]

# ---- linear maps and rank-nullity -------------------------------------------------

# why: M00.2's rotate_pairs and RoPE (L7.3) apply this matrix to pairs of coordinates.
[q21]
type   = "matrix"
expect = "[[0, -1], [1, 0]]"
[[q21.reject]]
answer = "[[0, 1], [-1, 0]]"       # clockwise

[q22]
type   = "matrix"
expect = "[[1, 1], [2, 0], [0, 1]]"
[[q22.reject]]
answer = "[[1, 2, 0], [1, 0, 1]]"  # the transpose: images as rows

[q23]
type   = "number"
expect = "2"
exact  = true
[[q23.reject]]
answer = "3"

[q24]
type   = "number"
expect = "1"
exact  = true
[[q24.reject]]
answer = "0"

[q25]
type   = "number"
expect = "3"
exact  = true
[[q25.reject]]
answer = "1"                       # 5 - 4 counts rows, not columns

[q26]
type   = "bool"
expect = "false"
[[q26.reject]]
answer = "true"

# why: composition is a matrix product in the reverse order of application.
[q27]
type   = "matrix"
expect = "[[0, 2], [1, 0]]"
[[q27.reject]]
answer = "[[0, 1], [2, 0]]"        # T S instead of S T

[q28]
type   = "proof"
rubric = [
  "Shows 0 is in the null space (A0 = 0)",
  "Shows closure under addition: Ax = 0 and Ay = 0 give A(x + y) = Ax + Ay = 0",
  "Shows closure under scalar multiplication: A(cx) = c(Ax) = 0",
  "Names the linearity of matrix multiplication as the reason and concludes it is a subspace of R^n",
]

