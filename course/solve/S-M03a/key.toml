exact  = true
[[q29.reject]]
answer = "15"                      # 2*4 + 1*7

[q30]
type   = "number"
expect = "24"
exact  = true
[[q30.reject]]
answer = "11"                      # the trace

[q31]
type   = "number"
expect = "-3"
exact  = true
[[q31.reject]]
answer = "3"
[[q31.reject]]
answer = "0"                       # the determinant of the 1..9 matrix

[q32]
type   = "number"
expect = "40"
exact  = true
[[q32.reject]]
answer = "10"                      # det(2A) = 2^n det A, not 2 det A

[q33]
type   = "number"
expect = "1/4"
exact  = true
[[q33.reject]]
answer = "-4"

[q34]
type   = "number"
expect = "5"
exact  = true
[[q34.reject]]
answer = "7"                       # 3*2 + 1*1

# ---- eigenvalues and eigenvectors -----------------------------------------------------

[q35]
type   = "set"
expect = "{2, 3}"
[[q35.reject]]
answer = "{5}"

[q36]
type   = "set"
expect = "{1, 3}"
[[q36.reject]]
answer = "{2}"                     # the diagonal entries

[q37]
type   = "vector"
expect = "[1, 1]"
up_to  = "scalar"
[[q37.reject]]
answer = "[1, -1]"                 # the eigenvector of 1

[q38]
type   = "expr"
expect = "t^2 - 5*t - 2"
vars   = { t = "real" }
[[q38.reject]]
answer = "t^2 - 5*t + 4"           # the off-diagonal product dropped
[[q38.reject]]
answer = "t^2 + 5*t - 2"

[q39]
type   = "set"
expect = "{I, -I}"
[[q39.reject]]
answer = "{1, -1}"

[q40]
type   = "number"
expect = "10"
exact  = true
[[q40.reject]]
answer = "7"                       # the sum (trace), not the product

[q41]
type   = "vector"
expect = "[59049, 59049]"
[[q41.reject]]
answer = "[30, 30]"                # 10 * 3 instead of 3^10

# why: a spectral radius below 1 makes repeated multiplication shrink (L3.1's vanishing gradients).
[q42]
type   = "number"
expect = "9/10"
exact  = true
[[q42.reject]]
answer = "1/2"                     # the diagonal entry
[[q42.reject]]
answer = "1/10"

# why: M03.4's power_iteration converges at this rate.
[q43]
type   = "number"
expect = "1/3"
exact  = true
[[q43.reject]]
answer = "3"

[q44]
type   = "proof"
rubric = [
  "Assumes c1 v1 + c2 v2 = 0 and aims to show c1 = c2 = 0",
  "Applies A (or A - lambda2 I) to get a second equation, for example c1 lambda1 v1 + c2 lambda2 v2 = 0",
  "Eliminates one vector to get c1 (lambda1 - lambda2) v1 = 0, and uses lambda1 != lambda2 and v1 != 0",
  "Concludes c1 = 0, then c2 = 0, so v1 and v2 are independent",
]

# ---- orthogonality and QR ---------------------------------------------------------------

# why: projection onto a direction is the inner-product step of M03.6 and of Gram-Schmidt.
[q45]
type   = "vector"
expect = "[2, 2, 2]"
[[q45.reject]]
answer = "[6, 6, 6]"               # forgot to divide by |u|^2 = 3

[q46]
type   = "matrix"
expect = "[[1/sqrt(2), 1/sqrt(6)], [1/sqrt(2), -1/sqrt(6)], [0, 2/sqrt(6)]]"
[[q46.reject]]
answer = "[[1/sqrt(2), 1/2], [1/sqrt(2), -1/2], [0, 1]]"   # second column not normalized
[[q46.reject]]
answer = "[[1/sqrt(2), -1/sqrt(6)], [1/sqrt(2), 1/sqrt(6)], [0, -2/sqrt(6)]]"   # negative diagonal of R

[q47]
type   = "matrix"
expect = "[[sqrt(2), 1/sqrt(2)], [0, sqrt(6)/2]]"
[[q47.reject]]
answer = "[[sqrt(2), 1/sqrt(2)], [0, sqrt(3/2)/2]]"
[[q47.reject]]
answer = "[[1, 1], [0, 1]]"

# why: M03.5's lstsq solves exactly this problem through QR.
[q48]
type   = "number"
expect = "11/14"
exact  = true
[[q48.reject]]
answer = "5/6"                     # sum(y) / sum(x)
[[q48.reject]]
answer = "1"
