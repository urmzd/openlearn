[q12]
type   = "proof"
rubric = [
  "States the product rule (u v)' = u' v + u v' for differentiable u and v",
  "Integrates both sides from a to b and applies the fundamental theorem to the left side: [u v] from a to b",
  "Uses linearity of the integral to split the right side and rearranges to the formula",
  "Names the assumption that u' v and u v' are integrable (for example, continuous) on [a, b]",
]

# ---- improper integrals and the Gaussian -----------------------------------------

[q13]
type   = "number"
expect = "1"
exact  = true
[[q13.reject]]
answer = "oo"

[q14]
type   = "number"
expect = "1/2"
exact  = true
[[q14.reject]]
answer = "2"

[q15]
type   = "number"
expect = "2"
exact  = true
[[q15.reject]]
answer = "oo"                      # improper at 0 but convergent

# why: the normalizer of the normal density (M07.0) is this integral rescaled.
[q16]
type   = "number"
expect = "sqrt(pi)"
exact  = true
[[q16.reject]]
answer = "sqrt(2*pi)"              # the normalizer of exp(-x^2/2) instead
[[q16.reject]]
answer = "pi"

# why: E[relu(z)^2] = Var(z)/2 is the factor Kaiming init (M07.3) undoes with gain sqrt(2).
[q17]
type   = "number"
expect = "1/2"
exact  = true
[[q17.reject]]
answer = "1"                       # the full second moment
[[q17.reject]]
answer = "1/sqrt(2*pi)"

[q18]
type   = "proof"
rubric = [
  "Writes I^2 as the double integral of exp(-(x^2 + y^2)) over the plane, using that the integral converges",
  "Changes to polar coordinates with the area element r dr dtheta (the Jacobian r)",
  "Evaluates the inner integral of r exp(-r^2) from 0 to oo as 1/2 and the outer as 2 pi, so I^2 = pi",
  "Concludes I = sqrt(pi) because I > 0 (the integrand is positive)",
]

