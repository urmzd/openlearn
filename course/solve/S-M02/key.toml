[q30]
type   = "proof"
rubric = [
  "Names the method: grouping terms in blocks of length 2^k, or the integral test against 1/x",
  "Shows a lower bound that grows without limit (each block is at least 1/2, or the partial sum is at least ln(N + 1))",
  "Justifies every inequality used (1/n >= 1/2^k on the block, or 1/n >= the integral of 1/x from n to n + 1)",
  "Concludes the partial sums are unbounded, so the series diverges, even though its terms tend to 0",
]

# ---- Taylor series and remainders ----------------------------------------------------

[q31]
type   = "expr"
expect = "1 + x + x^2/2 + x^3/6"
vars   = { x = "real" }
check  = "symbolic"
[[q31.reject]]
answer = "1 + x + x^2 + x^3"       # forgot the factorials
[[q31.reject]]
answer = "1 + x + x^2/2"

[q32]
type   = "expr"
expect = "x - x^2/2 + x^3/3"
vars   = { x = "real" }
check  = "symbolic"
[[q32.reject]]
answer = "x + x^2/2 + x^3/3"       # alternating signs lost

[q33]
type   = "number"
expect = "1/120"
exact  = true
[[q33.reject]]
answer = "-1/120"
[[q33.reject]]
answer = "1/5"

[q34]
type   = "expr"
expect = "1 - x^2/2 + x^4/24"
vars   = { x = "real" }
check  = "symbolic"
[[q34.reject]]
answer = "1 - x^2/2 + x^4/4"

# why: M02.1's tests check that the Lagrange bound holds for its exp polynomial.
[q35]
type   = "number"
expect = "exp(1/2)/384"
exact  = true
[[q35.reject]]
answer = "exp(1/2)/96"             # (1/2)^3/3!: the bound of T_2, one degree short
[[q35.reject]]
answer = "1/384"                   # dropped the e^c factor

[q36]
type   = "number"
expect = "9"
exact  = true
[[q36.reject]]
answer = "10"                      # the value of n + 1

[q37]
type   = "expr"
expect = "1 + x + x^2 + x^3"
vars   = { x = "real" }
check  = "symbolic"
[[q37.reject]]
answer = "1 - x + x^2 - x^3"       # the series of 1/(1 + x)

# why: M02.1's exp_range_reduced and the C tl_expf (M09.6) use exactly this reduction.
[q38]
type   = "number"
expect = "5 - 7*log(2)"
exact  = true
[[q38.reject]]
answer = "5 - 8*log(2)"            # rounded up instead of to nearest: |r| > ln(2)/2
[[q38.reject]]
answer = "5/log(2) - 7"

# why: M02.1's erf_series feeds M01.3's exact GELU.
[q39]
type   = "expr"
expect = "2/sqrt(pi)*(x - x^3/3 + x^5/10)"
vars   = { x = "real" }
check  = "symbolic"
[[q39.reject]]
answer = "2/sqrt(pi)*(x - x^3/3 + x^5/5)"   # integrated t^4/2 as t^5/5 without the 1/2
[[q39.reject]]
answer = "x - x^3/3 + x^5/10"               # the 2/sqrt(pi) dropped

[q40]
type   = "proof"
rubric = [
  "Identifies x - x^3/6 as the Taylor polynomial of sin of degree 3 and also of degree 4 (the x^4 coefficient is 0)",
  "Writes the Lagrange remainder of degree 4: R(x) = f^(5)(c) x^5 / 5! for some c between 0 and x",
  "Bounds |f^(5)(c)| = |cos c| <= 1",
  "Concludes |sin x - (x - x^3/6)| <= |x|^5 / 120 for every real x, including x = 0",
]

