# ---- the law of large numbers and the CLT -----------------------------------

# why: expectation is linear, so averaging keeps the mean.
[q1.a]
type   = "expr"
expect = "mu"
vars   = { mu = "real", n = "positive" }
domain = { mu = [-3.0, 3.0], n = [1.0, 50.0] }
[[q1.a.reject]]
answer = "mu/n"                    # divided once too often
[[q1.a.reject]]
answer = "0"

# why: independent variances add, and the 1/n factor is squared: sigma^2 / n.
[q1.b]
type   = "expr"
expect = "s2/n"
vars   = { s2 = "positive", n = "positive" }
domain = { s2 = [0.1, 4.0], n = [1.0, 50.0] }
[[q1.b.reject]]
answer = "s2"                      # the variance of one draw
[[q1.b.reject]]
answer = "s2/n^2"                  # the 1/n^2 without the n terms of the sum
[[q1.b.reject]]
answer = "sqrt(s2/n)"              # the standard error, not the variance

# why: Chebyshev with Var(Xbar) = s2/n; the LLN follows as n grows.
[q2]
type   = "expr"
expect = "s2/(n*eps^2)"
vars   = { s2 = "positive", n = "positive", eps = "positive" }
domain = { s2 = [0.1, 4.0], n = [1.0, 50.0], eps = [0.1, 2.0] }
[[q2.reject]]
answer = "s2/eps^2"                # the bound for one draw
[[q2.reject]]
answer = "s2/(n*eps)"              # epsilon not squared

# why: heads ~ mean 50, sd 5; z = (60 - 50) / 5 = 2; one-sided tail.
[q3]
type   = "number"
expect = "1 - 0.97725"
rtol   = 1e-3
[[q3.reject]]
answer = "2*(1 - 0.97725)"         # two-sided
[[q3.reject]]
answer = "0.97725"                 # the CDF, not the tail

# why: the width is proportional to 1 / sqrt(n).
[q4]
type   = "number"
expect = "4"
exact  = true
[[q4.reject]]
answer = "2"
[[q4.reject]]
answer = "16"

[q5]
type   = "proof"
rubric = [
  "Computes E[Xbar_n] = mu and Var(Xbar_n) = sigma^2 / n, using independence for the variance of the sum",
  "States Chebyshev's inequality (or derives it from Markov's applied to (Xbar_n - mu)^2) and applies it to Xbar_n",
  "Concludes P(|Xbar_n - mu| >= eps) <= sigma^2 / (n eps^2), which tends to 0 as n grows, for every fixed eps > 0",
  "Names where finite variance is used, and every symbol is defined before use",
]

# ---- confidence intervals ----------------------------------------------------

# why: mean -+ t * s / sqrt(n) = 10 -+ 2.064 * 2 / 5 = 10 -+ 0.8256.
[q6]
type   = "interval"
expect = "[9.1744, 10.8256]"
[[q6.reject]]
answer = "[9.216, 10.784]"         # the normal 1.96 in place of t
[[q6.reject]]
answer = "[5.872, 14.128]"         # s instead of s / sqrt(n)

# why: at k = 0 the Wilson interval starts at 0 but is not empty: z^2 / (n + z^2) * 2.
[q7]
type   = "interval"
expect = "[0, 2/7]"
[[q7.reject]]
answer = "[0, 0]"                  # the Wald interval
[[q7.reject]]
answer = "[0, 4/10]"               # the denominator 1 + z^2/n dropped

# why: h = 0.8 and h = 7.2: interpolate between neighbours, not the nearest rank.
[q8]
type   = "interval"
expect = "[9/5, 49/5]"
[[q8.reject]]
answer = "[1, 9]"                  # floor of h, no interpolation
[[q8.reject]]
answer = "[2, 9]"

# why: the parameter is fixed; the interval is the random object.
[q9]
type   = "choice"
expect = "c"
[[q9.reject]]
answer = "a"
[[q9.reject]]
answer = "d"
