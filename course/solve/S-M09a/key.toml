# S-M09a answer key (hidden; honor system, DESIGN D34). `ol verify course S-M09a`
# check 7 proves every `expect` passes and every `reject` canary fails;
# course/oracle/solve/S-M09a.py recomputes every value independently (numpy
# float32 bit views, exact rational rounding, and stepwise float32 evaluation).

# ---- representation and rounding ---------------------------------------------

# why: M09.1's decompose_f32 returns exactly these fields.
[q1.a]
type   = "vector"
expect = "[0, 127, 0]"
[[q1.a.reject]]
answer = "[0, 0, 0]"               # unbiased exponent
[[q1.a.reject]]
answer = "[0, 127, 1]"             # stored the implicit leading 1

[q1.b]
type   = "vector"
expect = "[1, 129, 5242880]"
[[q1.b.reject]]
answer = "[1, 2, 5242880]"         # forgot the bias
[[q1.b.reject]]
answer = "[1, 129, 5]"             # fraction bits read as a decimal .625 -> 5

# why: ulp at 1 is the gap your tolerances (M09.3) are measured in.
[q2.a]
type   = "number"
expect = "2^-23"
exact  = true
[[q2.a.reject]]
answer = "2^-24"                   # the unit roundoff, half the gap

[q2.b]
type   = "number"
expect = "2^-7"
exact  = true
[[q2.b.reject]]
answer = "2^-8"                    # counted the implicit bit as stored
[[q2.b.reject]]
answer = "2^-10"                   # fp16's gap

[q2.c]
type   = "number"
expect = "2^-10"
exact  = true
[[q2.c.reject]]
answer = "2^-7"                    # bf16's gap

# why: fp16 overflows at 65504, the reason L11.1 prefers bf16 or loss scaling.
[q3.a]
type   = "number"
expect = "65504"
exact  = true
[[q3.a.reject]]
answer = "65536"                   # 2^16, not representable
[[q3.a.reject]]
answer = "65535"                   # the largest uint16

# (asked as the exponent k: the checker's exact comparison cannot tell 2^-127 from 2^-126)
[q3.b]
type   = "number"
expect = "-126"
exact  = true
[[q3.b.reject]]
answer = "-127"                    # used the bias as the minimum exponent
[[q3.b.reject]]
answer = "-149"                    # the smallest subnormal

# why: round_to_bf16 must break ties to even, bit for bit with torch.
[q4.a]
type   = "number"
expect = "1"
exact  = true
[[q4.a.reject]]
answer = "1 + 2^-7"                # rounded the tie up

[q4.b]
type   = "number"
expect = "1 + 2^-6"
exact  = true
[[q4.b.reject]]
answer = "1 + 2^-7"                # truncated, or rounded the tie down

[q5]
type   = "bool"
expect = "false"
[[q5.reject]]
answer = "true"

# ---- cancellation and stable rewrites ----------------------------------------

# why: x + 1 rounds back to x in float32 at 10^8; the difference cancels to 0.
[q6.a]
type   = "number"
expect = "0"
exact  = true
[[q6.a.reject]]
answer = "1/20000"                 # the true value, not what float32 computes

[q6.b]
type   = "number"
expect = "1/(sqrt(100000001) + 10000)"
rtol   = 1e-6
atol   = 0.0
[[q6.b.reject]]
answer = "0"
[[q6.b.reject]]
answer = "1/10000"                 # 1/sqrt(x), not 1/(2 sqrt(x))

[q7]
type   = "choice"
expect = "b"
[[q7.reject]]
answer = "a"

# why: logsumexp shifts by the max; M09.2's test_no_overflow uses x = (1000, 1000).
[q8.a]
type   = "number"
expect = "1000 + log(2)"
exact  = true
[[q8.a.reject]]
answer = "1000"                    # dropped the log 2
[[q8.a.reject]]
answer = "log(2)"                  # forgot to add the shift back

[q8.b]
type   = "choice"
expect = "nan"
[[q8.b.reject]]
answer = "inf"                     # exp overflows, but inf / inf is then nan
[[q8.b.reject]]
answer = "0.5"

[q9.a]
type   = "number"
expect = "2/3"
exact  = true
[[q9.a.reject]]
answer = "1"                       # sample variance (divide by n - 1)

[q9.b]
type   = "choice"
expect = "two"
[[q9.b.reject]]
answer = "one"                     # x_i^2 is about 10^16 > 2^53: the squares round

# why: L6.7 sums 10^7 per-token NLLs; M09.2's kahan_sum keeps the small terms.
[q10.a]
type   = "number"
expect = "1"
exact  = true
[[q10.a.reject]]
answer = "10001/10000"             # the exact sum, not what float32 returns

[q10.b]
type   = "number"
expect = "10001/10000"
exact  = true
[[q10.b.reject]]
answer = "1"

[q11]
type   = "proof"
rubric = [
  "Factors e^(x_i + c) = e^c e^(x_i) in numerator and denominator and cancels e^c > 0",
  "Shows x_i - max_j x_j <= 0 for every i, so each term e^(x_i + c) is in (0, 1]",
  "Shows the denominator is at least 1 because the max term is e^0 = 1",
  "States what overflow this avoids (e^x overflows float32 above about 88.7, float64 above about 709.8)",
]
