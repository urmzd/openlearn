# S-M03b answer key (hidden; honor system, DESIGN D34). `ol verify course S-M03b`
# check 7 proves every `expect` passes and every `reject` canary fails;
# course/oracle/solve/S-M03b.py recomputes every value independently (SymPy
# products and eigenvalues, numpy SVD in float64, direct FLOP and byte sums).

# ---- inner products and projections -----------------------------------------

[q1.a]
type   = "number"
expect = "4"
exact  = true
[[q1.a.reject]]
answer = "5"                       # added the products of the norms' squares

# why: M03.6's cosine_sim divides the inner product by both lengths.
[q1.b]
type   = "number"
expect = "4*sqrt(5)/15"
exact  = true
[[q1.b.reject]]
answer = "4/15"                    # divided by ||u|| ||v||^2
[[q1.b.reject]]
answer = "4/5"                     # divided by ||v||^2 only

# why: project(x, v) in M03.6 divides by v . v, not by ||v||.
[q2]
type   = "vector"
expect = "[2, 2, 2]"
[[q2.reject]]
answer = "[2*sqrt(3), 2*sqrt(3), 2*sqrt(3)]"   # divided by ||a|| instead of a . a
[[q2.reject]]
answer = "[-1, 0, 1]"              # the residual, not the projection

[q3]
type   = "proof"
rubric = [
  "Handles b = 0 separately (both sides are 0)",
  "For b != 0 expands 0 <= ||a - t b||^2 = ||a||^2 - 2 t (a . b) + t^2 ||b||^2 for every real t",
  "Concludes (a . b)^2 <= ||a||^2 ||b||^2, by the discriminant or by choosing t = (a . b) / ||b||^2",
  "Shows equality forces a - t b = 0 for some t (a multiple), and that multiples give equality; deduces -1 <= cos <= 1",
]

# ---- SVD and low rank ---------------------------------------------------------

# why: sigma^2 are the eigenvalues of A^T A = [[1, 1], [1, 2]], (3 +- sqrt(5))/2.
[q4.a]
type   = "number"
expect = "(1 + sqrt(5))/2"
exact  = true
[[q4.a.reject]]
answer = "1"                       # read off the diagonal: singular values are not the diagonal
[[q4.a.reject]]
answer = "(3 + sqrt(5))/2"         # the eigenvalue of A^T A, not its square root

[q4.b]
type   = "number"
expect = "(sqrt(5) - 1)/2"
exact  = true
[[q4.b.reject]]
answer = "(3 - sqrt(5))/2"
[[q4.b.reject]]
answer = "1"

# why: M03.5's svd returns S in descending order; signs live in U and V.
[q5]
type   = "vector"
expect = "[3, 2]"
[[q5.reject]]
answer = "[2, 3]"                  # column order, not sorted
[[q5.reject]]
answer = "[3, 2, 0]"               # a 3 x 2 matrix has min(m, n) = 2 singular values

# why: Eckart-Young; low_rank's error is the first dropped singular value.
[q6.a]
type   = "number"
expect = "3"
exact  = true
[[q6.a.reject]]
answer = "1"                       # the last singular value, not the first dropped
[[q6.a.reject]]
answer = "sqrt(10)"                # the Frobenius error

[q6.b]
type   = "number"
expect = "sqrt(10)"
exact  = true
[[q6.b.reject]]
answer = "4"                       # summed the dropped values instead of their squares
[[q6.b.reject]]
answer = "3"

[q6.c]
type   = "number"
expect = "2"
exact  = true
[[q6.c.reject]]
answer = "1"
[[q6.c.reject]]
answer = "3"

# why: LoRA (L6.6) trains 2 d r parameters instead of d^2.
[q7]
type   = "expr"
expect = "8192*r"
vars   = { r = "positive" }
domain = { r = [1.0, 2048.0] }
[[q7.reject]]
answer = "4096*r"                  # one factor only
[[q7.reject]]
answer = "r**2"

[q8]
type   = "proof"
rubric = [
  "Computes A^T A = V Sigma^T U^T U Sigma V^T = V (Sigma^T Sigma) V^T using U^T U = I",
  "Reads off A^T A v_i = sigma_i^2 v_i from V^T V = I, so sigma_i = sqrt(lambda_i(A^T A))",
  "Writes ||A x||^2 = sum_i sigma_i^2 (v_i . x)^2 for unit x and bounds it by sigma_1^2 sum_i (v_i . x)^2 <= sigma_1^2",
  "Shows the bound is attained at x = v_1, so the maximum equals sigma_1",
]

# ---- matmul accounting and the roofline ---------------------------------------

[q9.a]
type   = "expr"
expect = "2*M*N*K"
vars   = { M = "positive", N = "positive", K = "positive" }
domain = { M = [1.0, 64.0], N = [1.0, 64.0], K = [1.0, 64.0] }
[[q9.a.reject]]
answer = "M*N*K"                   # counted multiply-adds, not FLOPs
[[q9.a.reject]]
answer = "2*M*N"

# why: decode is a matrix-vector product: about 1/2 FLOP per byte, memory-bound (L9.1).
[q9.b]
type   = "expr"
expect = "2*N**2/(4*N**2 + 8*N)"
vars   = { N = "positive" }
domain = { N = [1.0, 8192.0] }
[[q9.b.reject]]
answer = "2*N**2/(4*N**2)"         # forgot to move x and y
[[q9.b.reject]]
answer = "N/6"                     # the square matmul's intensity

# why: the tiled matmul in L9.1 is worth tiling because N/6 grows with N.
[q10.a]
type   = "expr"
expect = "N/6"
vars   = { N = "positive" }
domain = { N = [1.0, 8192.0] }
[[q10.a.reject]]
answer = "2*N/3"                   # numbers counted instead of bytes (forgot 4 bytes each)
[[q10.a.reject]]
answer = "N/12"                    # multiply-adds (N^3) counted instead of FLOPs

[q10.b]
type   = "number"
expect = "600"
exact  = true
[[q10.b.reject]]
answer = "100"                     # the ridge point itself, not N
[[q10.b.reject]]
answer = "150"                     # with the intensity 2N/3 (numbers, not bytes)
