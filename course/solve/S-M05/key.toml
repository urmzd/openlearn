[q40]
type   = "proof"
rubric = [
  "Proves g o f is injective: g(f(x)) = g(f(y)) gives f(x) = f(y) gives x = y",
  "Proves g o f is surjective: for z, picks y with g(y) = z, then x with f(x) = y",
  "Concludes bijective from injective and surjective",
]

