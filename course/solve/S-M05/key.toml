[q36]
type   = "proof"
rubric = [
  "Proves reflexive: f(x) = f(x)",
  "Proves symmetric: f(x) = f(y) implies f(y) = f(x)",
  "Proves transitive: f(x) = f(y) and f(y) = f(z) imply f(x) = f(z)",
]

[q37]
type   = "proof"
rubric = [
  "Proves reflexive: a = 1 * a",
  "Proves antisymmetric: b = ka and a = lb give kl = 1, so k = l = 1 for positive integers",
  "Proves transitive: b = ka and c = lb give c = (lk) a",
  "Says why antisymmetry needs positive integers (on all integers, 2 | -2 and -2 | 2)",
]

