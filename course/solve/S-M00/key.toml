# S-M00 answer key (hidden; honor system, DESIGN D34). `ol verify course S-M00`
# check 7 proves every `expect` passes and every `reject` canary fails;
# course/oracle/solve/S-M00.py recomputes every value independently.
# 60 items, no proofs (DESIGN 4.2): functions and inverses (q1-q10), exp/log
# identities (q11-q22), trig, complex numbers, Euler (q23-q34), sequences and
# geometric series (q35-q44), polynomials (q45-q52), inequalities (q53-q60).

# ---- functions and inverses ------------------------------------------------

# why: undo the operations in reverse order; the inverse of "times 3, minus 7".
[q1]
type   = "expr"
expect = "(x + 7)/3"
vars   = { x = "real" }
[[q1.reject]]
answer = "(x - 7)/3"               # undid the steps in the wrong order

[q2]
type   = "expr"
expect = "(log(x) - 1)/2"
vars   = { x = "positive" }
domain = { x = [0.1, 20.0] }
[[q2.reject]]
answer = "log(x)/2 - 1"            # subtracted 1 after halving

[q3]
type   = "expr"
expect = "(3*x + 1)/(x - 2)"
vars   = { x = "real" }
domain = { x = [3.0, 9.0] }
[[q3.reject]]
answer = "(x - 3)/(2*x + 1)"       # the reciprocal, not the inverse

[q4]
type   = "expr"
expect = "(x + 1)^2"
vars   = { x = "real" }
[[q4.reject]]
answer = "x^2 + 1"                 # g after f, not f after g

# why: the logit is the inverse of the sigmoid; a classifier head (L6.5) outputs logits.
[q5]
type   = "expr"
expect = "log(p/(1 - p))"
vars   = { p = "positive" }
domain = { p = [0.01, 0.99] }
[[q5.reject]]
answer = "log((1 - p)/p)"          # sign flipped

[q6]
type   = "interval"
expect = "(0, 1)"
[[q6.reject]]
answer = "[0, 1]"                  # the sigmoid never reaches 0 or 1

[q7]
type   = "interval"
expect = "(-2, 2)"
[[q7.reject]]
answer = "[-2, 2]"                 # log(0) is undefined

[q8]
type   = "bool"
expect = "true"
[[q8.reject]]
answer = "false"

[q9]
type   = "number"
expect = "19"
exact  = true
[[q9.reject]]
answer = "11"                      # 2^3 + log2(8): composed the wrong way round

# why: softplus is positive everywhere; its inverse exists only for y > 0.
[q10]
type   = "expr"
expect = "log(exp(y) - 1)"
vars   = { y = "positive" }
domain = { y = [0.1, 5.0] }
[[q10.reject]]
answer = "log(exp(y) + 1)"         # applied softplus again

# ---- exp/log identities --------------------------------------------------

[q11]
type   = "number"
expect = "5"
exact  = true
[[q11.reject]]
answer = "6"                       # log2(8 + 4) is not log2 8 + log2 4

[q12]
type   = "number"
expect = "5/3"
exact  = true
[[q12.reject]]
answer = "3/5"                     # ln 8 / ln 32: change of base inverted

[q13]
type   = "expr"
expect = "x^3"
vars   = { x = "positive" }
domain = { x = [0.1, 5.0] }
[[q13.reject]]
answer = "3*x"

[q14]
type   = "number"
expect = "log(1000)/log(2)"
rtol   = 1e-6
[[q14.reject]]
answer = "log(2)/log(1000)"

[q15]
type   = "number"
expect = "1/log(2)"
rtol   = 1e-6
[[q15.reject]]
answer = "log(2)"                  # that is one bit in nats

# why: bits per byte divides by bytes, not tokens (M00.1, M11.2).
[q16]
type   = "number"
expect = "1/(2*log(2))"
rtol   = 1e-6
[[q16.reject]]
answer = "2/log(2)"                # bits per token
[[q16.reject]]
answer = "1/2"                     # nats per byte

[q17]
type   = "number"
expect = "3"
exact  = true
[[q17.reject]]
answer = "log(8)"                  # nats, not bits

# why: logs turn products into sums; 72 = 2^3 * 3^2.
[q18]
type   = "expr"
expect = "3*a + 2*b"
vars   = { a = "real", b = "real" }
[[q18.reject]]
answer = "2*a + 3*b"               # exponents swapped

[q19]
type   = "number"
expect = "9"
exact  = true
[[q19.reject]]
answer = "-1"                      # the root outside the domain x > 8

[q20]
type   = "number"
expect = "3/2"
exact  = true
[[q20.reject]]
answer = "2"                       # 8 / 4

[q21]
type   = "expr"
expect = "log(2)/k"
vars   = { k = "positive" }
domain = { k = [0.1, 5.0] }
[[q21.reject]]
answer = "1/(2*k)"

[q22]
type   = "number"
expect = "31"
exact  = true
[[q22.reject]]
answer = "30"                      # floor(100 log10 2) without the + 1

# ---- trig, complex numbers, Euler ---------------------------------------------

[q23]
type   = "number"
expect = "1/2"
exact  = true
[[q23.reject]]
answer = "sqrt(3)/2"               # cos, not sin

[q24]
type   = "number"
expect = "-1/2"
exact  = true
[[q24.reject]]
answer = "1/2"                     # second quadrant: cosine is negative

[q25]
type   = "expr"
expect = "cos(a + b)"
vars   = { a = "real", b = "real" }
forbid = ["sin"]
[[q25.reject]]
answer = "cos(a - b)"

# why: the columns of R(theta) are where the basis vectors land.
[q26]
type   = "vector"
expect = "[1/2, sqrt(3)/2]"
[[q26.reject]]
answer = "[sqrt(3)/2, 1/2]"        # rotated by pi/6

[q27]
type   = "number"
expect = "5*pi/6"
exact  = true
[[q27.reject]]
answer = "pi/6"                    # subtracted the angles

[q28]
type   = "number"
expect = "16"
exact  = true
[[q28.reject]]
answer = "-16"

[q29]
type   = "number"
expect = "5"
exact  = true
[[q29.reject]]
answer = "7"                       # 3 + 4: the modulus is not the sum of parts

# why: the M00.2 worked example as one complex multiplication.
[q30]
type   = "number"
expect = "-7/5 + 24*I/5"
exact  = true
[[q30.reject]]
answer = "5"                       # 3 * 3/5 + 4 * 4/5: a dot product, not a rotation
[[q30.reject]]
answer = "-7/5 - 24*I/5"

[q31]
type   = "number"
expect = "I"
exact  = true
[[q31.reject]]
answer = "1"

[q32]
type   = "expr"
expect = "(exp(I*t) + exp(-I*t))/2"
vars   = { t = "real" }
forbid = ["cos", "sin"]
[[q32.reject]]
answer = "(exp(I*t) - exp(-I*t))/2"

# why: the RoPE score depends on the angle difference only (M00.2 section 2.5).
[q33]
type   = "expr"
expect = "cos(a - b)"
vars   = { a = "real", b = "real" }
[[q33.reject]]
answer = "cos(a + b)"              # forgot the conjugate

# why: a RoPE frequency of 0.01 radians per token repeats every 628 tokens.
[q34]
type   = "number"
expect = "200*pi"
exact  = true
[[q34.reject]]
answer = "100*pi"

# ---- sequences and geometric series -------------------------------------------

[q35]
type   = "number"
expect = "2"
exact  = true
[[q35.reject]]
answer = "1"

[q36]
type   = "expr"
expect = "(1 - r^n)/(1 - r)"
vars   = { r = "real", n = "natural" }
domain = { r = [-0.9, 0.9], n = [1.0, 12.0] }
[[q36.reject]]
answer = "(1 - r^(n + 1))/(1 - r)" # n + 1 terms

[q37]
type   = "number"
expect = "3069"
exact  = true
[[q37.reject]]
answer = "6141"                    # 11 terms
[[q37.reject]]
answer = "1533"                    # 9 terms

# why: the RoPE ladder of a 128-dimensional head with base 10000 (L7.3).
[q38]
type   = "number"
expect = "10000^(-1/64)"
exact  = true
[[q38.reject]]
answer = "10000^(-1/128)"          # forgot the factor 2 in 2i/d

[q39]
type   = "number"
expect = "5050"
exact  = true
[[q39.reject]]
answer = "5000"

# why: an EMA started at 0 is biased toward 0 by exactly 1 - beta^t (M02.2).
[q40]
type   = "number"
expect = "271/1000"
exact  = true
[[q40.reject]]
answer = "729/1000"                # beta^3, not 1 - beta^3

[q41]
type   = "number"
expect = "81/1000"
exact  = true
[[q41.reject]]
answer = "1/10"                    # the newest gradient's weight

[q42]
type   = "number"
expect = "2"
exact  = true
[[q42.reject]]
answer = "1/3"                     # set n = 0

[q43]
type   = "number"
expect = "3/11"
exact  = true
[[q43.reject]]
answer = "27/100"

# why: ALiBi slopes for 4 heads are a geometric sequence (L7.4).
[q44]
type   = "number"
expect = "85/256"
exact  = true
[[q44.reject]]
answer = "1/3"                     # the infinite sum

# ---- polynomials -------------------------------------------------------------

[q45]
type   = "number"
expect = "32"
exact  = true
[[q45.reject]]
answer = "10"                      # coefficients read in descending order

[q46]
type   = "expr"
expect = "x^2 - 5*x + 6"
vars   = { x = "real" }
[[q46.reject]]
answer = "x^2 - 7*x + 18"          # divided by x + 1

[q47]
type   = "set"
expect = "{1, 2, 3}"
[[q47.reject]]
answer = "{-1, -2, -3}"

[q48]
type   = "set"
expect = "{1/2, -2}"
[[q48.reject]]
answer = "{-1/2, 2}"

# why: the stable formula keeps the small root's digits (M00.4 pitfall 2).
[q49]
type   = "number"
expect = "500000 - sqrt(249999999999)"
rtol   = 1e-13
atol   = 0.0
[[q49.reject]]
answer = "1/1000000"               # c / b only: drops the 1e-18 correction

[q50]
type   = "number"
expect = "2/3"
exact  = true
[[q50.reject]]
answer = "2"                       # c, not c / a

[q51]
type   = "number"
expect = "0"
exact  = true
[[q51.reject]]
answer = "2"

[q52]
type   = "vector"
expect = "[1, 1, 1/2, 1/6]"
[[q52.reject]]
answer = "[1, 1, 1/2, 1/3]"        # 1/k instead of 1/k!

# ---- inequalities ---------------------------------------------------------------

[q53]
type   = "interval"
expect = "(1, 5)"
[[q53.reject]]
answer = "[1, 5]"

[q54]
type   = "interval"
expect = "(-oo, 2) U (3, oo)"
[[q54.reject]]
answer = "(2, 3)"

[q55]
type   = "number"
expect = "10"
exact  = true
[[q55.reject]]
answer = "9"

[q56]
type   = "interval"
expect = "(-oo, -2) U [1, oo)"
[[q56.reject]]
answer = "(-oo, -2] U [1, oo)"     # x = -2 divides by zero

# why: a token with surprisal above 3 bits has probability below 1/8.
[q57]
type   = "interval"
expect = "(0, 1/8)"
[[q57.reject]]
answer = "(1/8, 1)"

[q58]
type   = "interval"
expect = "(-oo, log(2)]"
[[q58.reject]]
answer = "(-oo, log(2))"

[q59]
type   = "number"
expect = "2"
exact  = true
[[q59.reject]]
answer = "1"

[q60]
type   = "interval"
expect = "(0, 1) U (1, oo)"
[[q60.reject]]
answer = "(0, oo)"                 # equality at x = 1
