# S-M06b answer key (hidden; honor system, DESIGN D34). `ol verify course S-M06b`
# check 7 proves every `expect` passes and every `reject` canary fails;
# course/oracle/solve/S-M06b.py recomputes every value independently.

# ---- trees ------------------------------------------------------------------

# why: n - 1 edges is how a parent array or a trie arena sizes itself.
[q1]
type   = "number"
expect = "11"
exact  = true
[[q1.reject]]
answer = "12"                      # one edge per node
[[q1.reject]]
answer = "66"                      # every pair: a complete graph

# why: shared prefixes are stored once (M06.2's node count).
[q2]
type   = "number"
expect = "10"
exact  = true
[[q2.reject]]
answer = "18"                      # 1 + total characters: no sharing
[[q2.reject]]
answer = "9"                       # forgot the root

# why: a merge tree of BPE or a Huffman tree is a full binary tree.
[q3]
type   = "number"
expect = "9"
exact  = true
[[q3.reject]]
answer = "10"
[[q3.reject]]
answer = "19"                      # all nodes

# why: Cayley's formula; counting spanning trees of the complete graph.
[q4]
type   = "number"
expect = "125"
exact  = true
[[q4.reject]]
answer = "120"                     # 5!
[[q4.reject]]
answer = "625"                     # n^(n-1)

# why: tree height is the cost of a lookup; a complete binary tree is a heap's shape.
[q5]
type   = "number"
expect = "6"
exact  = true
[[q5.reject]]
answer = "7"                       # counted levels, not edges
[[q5.reject]]
answer = "50"

[q6]
type   = "proof"
rubric = [
  "Defines a tree as a connected graph with no cycle, and states the claim for every n >= 1",
  "Proves that a tree with n >= 2 nodes has a leaf (for example, the end of a longest path)",
  "Shows that removing a leaf and its one edge leaves a tree (still connected, still acyclic)",
  "Uses the induction hypothesis for n - 1 nodes, not the conclusion, and checks the base case n = 1",
]

# ---- inclusion-exclusion and birthday bounds -------------------------------

# why: |A u B u C| is how many distinct items three filters flag together.
[q7]
type   = "number"
expect = "22"
exact  = true
[[q7.reject]]
answer = "21"                      # forgot to add the triple intersection back
[[q7.reject]]
answer = "30"                      # no correction at all

[q8]
type   = "number"
expect = "74"
exact  = true
[[q8.reject]]
answer = "103"                     # plain sum
[[q8.reject]]
answer = "71"                      # forgot + |div by 30|

# why: inclusion-exclusion over "i is fixed"; no-repeat sampling.
[q9]
type   = "number"
expect = "9"
exact  = true
[[q9.reject]]
answer = "24"
[[q9.reject]]
answer = "8"

# why: the exact probability behind the birthday bound.
[q10]
type   = "number"
expect = "18/25"
exact  = true
[[q10.reject]]
answer = "7/10"                    # 1 - 3/10: the union bound, not the probability
[[q10.reject]]
answer = "7/25"                    # P(at least one collision): the complement

# why: linearity of expectation over pairs; the union bound on a collision.
[q11]
type   = "expr"
expect = "k*(k-1)/(2*m)"
vars   = { k = "positive", m = "positive" }
domain = { k = [2.0, 50.0], m = [10.0, 1000.0] }
[[q11.reject]]
answer = "k^2/m"
[[q11.reject]]
answer = "k*(k-1)/m"               # ordered pairs

# why: a 32-bit hash collides after about 77 000 keys, not 4 billion.
[q12]
type   = "number"
expect = "2^16*sqrt(2*log(2))"
rtol   = 1e-3
[[q12.reject]]
answer = "2^16"                    # sqrt(m) without the constant
[[q12.reject]]
answer = "2^31"                    # half the table

# ---- Jaccard, MinHash, LSH --------------------------------------------------

# why: Jaccard is |A n B| / |A u B| of the sets, data.04's near-duplicate score.
[q13]
type   = "number"
expect = "1/2"
exact  = true
[[q13.reject]]
answer = "3/5"                     # divided by |B|
[[q13.reject]]
answer = "3/4"                     # divided by |A|

[q14]
type   = "proof"
rubric = [
  "States the claim: for a uniformly random permutation pi of the universe U, P(min pi(A) = min pi(B)) = |A n B| / |A u B| for non-empty A, B",
  "Observes that the element of A u B with the smallest pi value is uniformly distributed over A u B",
  "Shows the two minima are equal exactly when that element lies in A n B (and differ otherwise)",
  "Concludes the probability is |A n B| / |A u B| and names it the Jaccard similarity",
]

# why: the error bar on a 128-permutation MinHash estimate.
[q15]
type   = "number"
expect = "1/512"
exact  = true
[[q15.reject]]
answer = "1/256"
[[q15.reject]]
answer = "1/128"                   # forgot J(1 - J)

# why: banding turns a similarity into a candidate probability (data.04).
[q16]
type   = "expr"
expect = "1-(1-s^8)^16"
vars   = { s = "real" }
domain = { s = [0.0, 1.0] }
[[q16.reject]]
answer = "1-(1-s^16)^8"            # b and r swapped
[[q16.reject]]
answer = "(1-(1-s)^8)^16"          # and/or swapped

[q17]
type   = "number"
expect = "2^(-1/2)"
rtol   = 1e-3
[[q17.reject]]
answer = "1/16"
[[q17.reject]]
answer = "1/2"

[q18]
type   = "number"
expect = "1-(255/256)^16"
rtol   = 1e-6
[[q18.reject]]
answer = "16/256"                  # the union bound, not the probability
[[q18.reject]]
answer = "1/256"

# ---- Bloom filters -----------------------------------------------------------

# why: the false-positive rate ds.08 is sized from.
[q19]
type   = "expr"
expect = "(1-exp(-k*n/m))^k"
vars   = { k = "positive", n = "positive", m = "positive" }
domain = { k = [1.0, 10.0], n = [10.0, 1000.0], m = [100.0, 20000.0] }
[[q19.reject]]
answer = "(1-exp(-n/m))^k"         # one hash per key
[[q19.reject]]
answer = "1-exp(-k*n/m)"           # one probe

[q20]
type   = "number"
expect = "10*log(2)"
rtol   = 1e-6
[[q20.reject]]
answer = "10/log(2)"
[[q20.reject]]
answer = "7"                       # rounded

[q21]
type   = "number"
expect = "2^(-10*log(2))"
rtol   = 1e-6
[[q21.reject]]
answer = "1/1024"                  # 2^(-10)
[[q21.reject]]
answer = "(1/2)^7"

[q22]
type   = "number"
expect = "log(100)/log(2)^2"
rtol   = 1e-6
[[q22.reject]]
answer = "log(100)/log(2)"         # that is k, not bits per key
[[q22.reject]]
answer = "100"

# ---- recurrences and generating functions ----------------------------------

# why: merge sort, pairwise summation, and recursive tiling all cost this.
[q23]
type   = "expr"
expect = "n*log(n)/log(2)"
vars   = { n = "positive" }
domain = { n = [2.0, 1024.0] }
[[q23.reject]]
answer = "n*log(n)"                # natural log
[[q23.reject]]
answer = "n^2"

[q24]
type   = "expr"
expect = "n*(n+1)/2"
vars   = { n = "positive" }
domain = { n = [1.0, 100.0] }
[[q24.reject]]
answer = "n^2/2"
[[q24.reject]]
answer = "n*(n-1)/2"

[q25]
type   = "expr"
expect = "2^n-1"
vars   = { n = "natural" }
domain = { n = [0.0, 12.0] }
[[q25.reject]]
answer = "2^n"
[[q25.reject]]
answer = "2^(n-1)"

# why: a generating function turns a sequence into one function you can manipulate.
[q26]
type   = "expr"
expect = "1/(1-x)^2"
vars   = { x = "real" }
domain = { x = [-0.5, 0.5] }
[[q26.reject]]
answer = "1/(1-x)"
[[q26.reject]]
answer = "x/(1-x)^2"               # the series for n, not n + 1

[q27]
type   = "number"
expect = "144"
exact  = true
[[q27.reject]]
answer = "89"
[[q27.reject]]
answer = "1024"                    # every string

# why: the cost exponent of recursive (tiled) matmul, L9.1.
[q28.a]
type   = "number"
expect = "3"
exact  = true
[[q28.a.reject]]
answer = "2"

[q28.b]
type   = "number"
expect = "log(7)/log(2)"
rtol   = 1e-6
[[q28.b.reject]]
answer = "3"
[[q28.b.reject]]
answer = "log(7)"

[q29]
type   = "proof"
rubric = [
  "States the claim T(2^j) = 2^j * j for every j >= 0 (that is, T(n) = n log2 n for n a power of 2)",
  "Checks the base case j = 0: T(1) = 0 = 1 * 0",
  "Assumes the claim for j and derives it for j + 1 from T(2^(j+1)) = 2 T(2^j) + 2^(j+1), using the hypothesis",
  "Does the algebra 2 * 2^j * j + 2^(j+1) = 2^(j+1) * (j + 1) explicitly and concludes",
]
