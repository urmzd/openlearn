# S-M01 answer key (hidden; honor system, DESIGN D34). `ol verify course S-M01`
# check 7 proves every `expect` passes and every `reject` canary fails;
# course/oracle/solve/S-M01.py recomputes every value independently.
# 57 items, 3 proofs (DESIGN 4.2): limits (q1-q10), derivative rules and the
# chain rule (q11-q25), implicit differentiation and related rates (q26-q31),
# optimization (q32-q39), integration and the FTC (q40-q51), L'Hopital (q52-q57).

# ---- limits -------------------------------------------------------------------

# why: a removable 0/0: factor and cancel before substituting.
[q1]
type   = "number"
expect = "4"
exact  = true
[[q1.reject]]
answer = "0"                       # substituted into the numerator only

[q2]
type   = "number"
expect = "3"
exact  = true
[[q2.reject]]
answer = "1"                       # sin(u)/u -> 1 without the factor 3

[q3]
type   = "number"
expect = "3/5"
exact  = true
[[q3.reject]]
answer = "0"

# why: the derivative of x^3 at 1 written as a limit (M01.1 central differences approximate it).
[q4]
type   = "number"
expect = "3"
exact  = true
[[q4.reject]]
answer = "1"

[q5]
type   = "number"
expect = "1/2"
exact  = true
[[q5.reject]]
answer = "0"

# why: compound growth; the same limit gives e^x and the EMA's (1 - 1/n)^n ~ e^-1.
[q6]
type   = "number"
expect = "exp(2)"
exact  = true
[[q6.reject]]
answer = "1"                       # 1^oo read as 1
[[q6.reject]]
answer = "E"                       # dropped the 2

[q7]
type   = "number"
expect = "0"
exact  = true
[[q7.reject]]
answer = "-1"

[q8]
type   = "number"
expect = "1/2"
exact  = true
[[q8.reject]]
answer = "0"                       # oo - oo read as 0

[q9]
type   = "number"
expect = "-1"
exact  = true
[[q9.reject]]
answer = "1"                       # the right-hand limit

[q10]
type   = "proof"
rubric = [
  "States the goal: for every epsilon > 0 there is a delta > 0 with 0 < |x - 3| < delta implying |2x + 1 - 7| < epsilon",
  "Rewrites |(2x + 1) - 7| as 2|x - 3|",
  "Chooses delta = epsilon / 2 (or any smaller positive value) explicitly",
  "Shows the chosen delta works for every x with 0 < |x - 3| < delta, and concludes the limit is 7",
]

# ---- derivative rules and the chain rule ------------------------------------------

[q11]
type   = "expr"
expect = "3*x^2*sin(x) + x^3*cos(x)"
vars   = { x = "real" }
[[q11.reject]]
answer = "3*x^2*cos(x)"            # derivative of a product taken factor by factor

[q12]
type   = "expr"
expect = "exp(x)*(1 + x^2 - 2*x)/(1 + x^2)^2"
vars   = { x = "real" }
[[q12.reject]]
answer = "exp(x)*(1 + x^2 + 2*x)/(1 + x^2)^2"   # quotient rule sign flipped
[[q12.reject]]
answer = "exp(x)/(2*x)"

# why: L0.2's sigmoid backward is sigma*(1 - sigma); this is the same function.
[q13]
type   = "expr"
expect = "exp(-z)/(1 + exp(-z))^2"
vars   = { z = "real" }
[[q13.reject]]
answer = "-exp(-z)/(1 + exp(-z))^2"            # lost the inner derivative's sign
[[q13.reject]]
answer = "1/(1 + exp(-z))"

# why: softplus' derivative is the sigmoid.
[q14]
type   = "expr"
expect = "exp(x)/(1 + exp(x))"
vars   = { x = "real" }
[[q14.reject]]
answer = "1/(1 + exp(x))"

[q15]
type   = "expr"
expect = "4/(exp(x) + exp(-x))^2"
vars   = { x = "real" }
[[q15.reject]]
answer = "1/(exp(x) + exp(-x))^2"
[[q15.reject]]
answer = "1 - (exp(x) - exp(-x))/(exp(x) + exp(-x))"   # 1 - tanh, not 1 - tanh^2

[q16]
type   = "expr"
expect = "2*x*cos(x^2)"
vars   = { x = "real" }
[[q16.reject]]
answer = "cos(x^2)"                # chain rule forgotten
[[q16.reject]]
answer = "2*x*cos(x)"

[q17]
type   = "expr"
expect = "2*x^3/sqrt(1 + x^4)"
vars   = { x = "real" }
[[q17.reject]]
answer = "1/(2*sqrt(1 + x^4))"

[q18]
type   = "expr"
expect = "-sin(x)/cos(x)"
vars   = { x = "real" }
domain = { x = [-1.4, 1.4] }
[[q18.reject]]
answer = "1/cos(x)"

[q19]
type   = "expr"
expect = "x^x*(log(x) + 1)"
vars   = { x = "positive" }
domain = { x = [0.2, 3.0] }
[[q19.reject]]
answer = "x*x^(x - 1)"             # the power rule, valid only for a constant exponent

# why: the normal density's slope; Gaussian integrals in S-M02 differentiate it.
[q20]
type   = "expr"
expect = "-x*exp(-x^2/2)"
vars   = { x = "real" }
[[q20.reject]]
answer = "exp(-x^2/2)"
[[q20.reject]]
answer = "-x^2*exp(-x^2/2)/2"

# why: the SwiGLU gate of L7.2 uses silu; its backward is this formula.
[q21]
type   = "expr"
expect = "1/(1 + exp(-x)) + x*exp(-x)/(1 + exp(-x))^2"
vars   = { x = "real" }
[[q21.reject]]
answer = "x*exp(-x)/(1 + exp(-x))^2"           # only the second term of the product rule

[q22]
type   = "expr"
expect = "(x - 2)*exp(-x)"
vars   = { x = "real" }
[[q22.reject]]
answer = "(1 - x)*exp(-x)"         # the first derivative

[q23]
type   = "number"
expect = "160"
exact  = true
[[q23.reject]]
answer = "80"                      # dropped the inner derivative 2x

[q24]
type   = "expr"
expect = "1/(x*log(2))"
vars   = { x = "positive" }
domain = { x = [0.5, 5.0] }
[[q24.reject]]
answer = "1/x"
[[q24.reject]]
answer = "log(2)/x"

[q25]
type   = "proof"
rubric = [
  "Writes the difference quotient ((x + h)^2 - x^2) / h from the definition",
  "Expands (x + h)^2 = x^2 + 2xh + h^2 and simplifies the quotient to 2x + h for h != 0",
  "Explains why cancelling h is allowed (h != 0 inside the limit) before letting h -> 0",
  "Concludes f'(x) = 2x for every real x",
]

# ---- implicit differentiation and related rates ----------------------------------

[q26]
type   = "number"
expect = "-3/4"
exact  = true
[[q26.reject]]
answer = "-4/3"                    # dx/dy

[q27]
type   = "expr"
expect = "-y/(x + 3*y^2)"
vars   = { x = "real", y = "real" }
domain = { x = [0.5, 2.0], y = [0.5, 2.0] }
[[q27.reject]]
answer = "-y/(3*y^2)"              # differentiated x*y as x*dy/dx only
[[q27.reject]]
answer = "y/(x + 3*y^2)"

# why: dA/dt = 2 pi r dr/dt, the chain rule through time.
[q28]
type   = "number"
expect = "20*pi"
exact  = true
[[q28.reject]]
answer = "10*pi"                   # forgot dr/dt = 2

[q29]
type   = "number"
expect = "-3/4"
exact  = true
[[q29.reject]]
answer = "3/4"                     # the sign: the top falls
[[q29.reject]]
answer = "-4/3"

[q30]
type   = "number"
expect = "1/pi"
exact  = true
[[q30.reject]]
answer = "1/(4*pi)"

[q31]
type   = "expr"
expect = "1/x"
vars   = { x = "positive" }
domain = { x = [0.2, 5.0] }
[[q31.reject]]
answer = "x"

# ---- optimization ------------------------------------------------------------------

# why: gradient descent (M10.1) finds this point; here you solve f'(x) = 0 directly.
[q32]
type   = "number"
expect = "3"
exact  = true
[[q32.reject]]
answer = "-3"

[q33]
type   = "number"
expect = "2"
exact  = true
[[q33.reject]]
answer = "11"                      # f(0)

[q34]
type   = "number"
expect = "25"
exact  = true
[[q34.reject]]
answer = "100"

[q35]
type   = "set"
expect = "{-1, 1}"
[[q35.reject]]
answer = "{0, sqrt(3), -sqrt(3)}"  # zeros of f, not of f'
[[q35.reject]]
answer = "{1}"

[q36]
type   = "number"
expect = "exp(-1)"
exact  = true
[[q36.reject]]
answer = "1"                       # the argmax, not the max

# why: the mean minimizes squared error; MSE training of a constant predictor learns the mean.
[q37]
type   = "number"
expect = "3"
exact  = true
[[q37.reject]]
answer = "2"                       # the median minimizes absolute error instead

[q38]
type   = "number"
expect = "2"
exact  = true
[[q38.reject]]
answer = "6"                       # the other root of V'(s) = 0: zero volume
[[q38.reject]]
answer = "3"

[q39]
type   = "number"
expect = "sqrt(7)/2"
exact  = true
[[q39.reject]]
answer = "2"                       # distance to the vertex (0, 0)
[[q39.reject]]
answer = "7/4"                     # the squared distance

# ---- integration and the fundamental theorem ---------------------------------------

[q40]
type   = "number"
expect = "1/3"
exact  = true
[[q40.reject]]
answer = "1/2"

[q41]
type   = "number"
expect = "2"
exact  = true
[[q41.reject]]
answer = "0"                       # sign slip in -cos

[q42]
type   = "number"
expect = "1"
exact  = true
[[q42.reject]]
answer = "E - 1"

[q43]
type   = "number"
expect = "6"
exact  = true
[[q43.reject]]
answer = "10"                      # integrated -2x as -2x^2

[q44]
type   = "expr"
expect = "sin(x^2)"
vars   = { x = "real" }
[[q44.reject]]
answer = "2*x*sin(x^2)"
[[q44.reject]]
answer = "sin(x^2) + 1"            # F(0) = 1, not 0

[q45]
type   = "number"
expect = "(exp(2) - 1)/2"
exact  = true
[[q45.reject]]
answer = "exp(2) - 1"              # forgot the 1/2 from the inner derivative

# why: FTC part 1: the derivative of an accumulated integral is the integrand.
[q46]
type   = "expr"
expect = "sqrt(1 + x^3)"
vars   = { x = "nonnegative" }
domain = { x = [0.0, 3.0] }
[[q46.reject]]
answer = "sqrt(1 + x^3) - 1"

[q47]
type   = "expr"
expect = "2*x*cos(x^2)"
vars   = { x = "real" }
[[q47.reject]]
answer = "cos(x^2)"                # chain rule through the upper limit forgotten

# why: an average is an integral divided by the length; ROC-AUC (M07.7) is such an integral.
[q48]
type   = "number"
expect = "2/pi"
exact  = true
[[q48.reject]]
answer = "2"                       # forgot to divide by the length pi
[[q48.reject]]
answer = "0"

[q49]
type   = "number"
expect = "1/6"
exact  = true
[[q49.reject]]
answer = "-1/6"                    # subtracted the curves the wrong way

[q50]
type   = "number"
expect = "log(2)"
exact  = true
[[q50.reject]]
answer = "1/2"

# why: a Riemann sum is what M01.4's trapezoid rule improves on.
[q51]
type   = "number"
expect = "3/8"
exact  = true
[[q51.reject]]
answer = "5/8"                     # the right sum
[[q51.reject]]
answer = "1/2"                     # the exact integral

