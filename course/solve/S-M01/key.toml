[q57]
type   = "proof"
rubric = [
  "Writes (x + sin x) / x = 1 + (sin x) / x and bounds |sin x / x| <= 1 / x for x > 0",
  "Concludes by the squeeze theorem (or the bound) that the limit is 1",
  "Notes the form is oo/oo but the ratio of derivatives (1 + cos x) / 1 has no limit",
  "States that L'Hopital's rule needs the limit of f'/g' to exist, so it says nothing here",
]
