[q21]
type   = "proof"
rubric = [
  "Writes L = -s_1 + log sum_j exp(s_j) (the cross-entropy with label 1)",
  "Differentiates: dL/ds_j = exp(s_j) / sum_k exp(s_k) - [j = 1] = softmax(s)_j - [j = 1]",
  "Shows L > 0 for finite s, because softmax(s)_1 < 1 whenever some other logit is finite",
  "Shows L = log(1 + sum_{j != 1} exp(s_j - s_1)), which tends to 0 exactly when every s_1 - s_j tends to infinity",
]

[q22]
type   = "proof"
rubric = [
  "Writes u = z (t s + b) and l = log(1 + exp(-u)), so dl/du = -exp(-u)/(1 + exp(-u)) = -sigma(-u)",
  "Applies the chain rule with du/ds = z t to get dl/ds = -t z sigma(-z (t s + b))",
  "Notes the loss is a sum of independent per-pair terms, so a pair's gradient involves only its own logit s, t, and b",
  "Contrasts with softmax (q21), whose normalizer couples every logit in the row",
]

# ---- word error rate -----------------------------------------------------------------------

# why: L14.5's WER can exceed 1; insertions are counted against the reference length.
[q23]
type   = "number"
expect = "2"
exact  = true
[[q23.reject]]
answer = "2/3"                     # divided by the hypothesis length

[q24]
type   = "proof"
rubric = [
  "Gives two word sequences and computes the minimum edit operations in both directions",
  "Divides by the respective reference lengths and shows the two WERs differ",
  "Names symmetry, d(a, b) = d(b, a), as the failing axiom",
  "Explains the cause: the normalizer is the reference length, so swapping roles changes the denominator while the edit distance stays the same",
]
