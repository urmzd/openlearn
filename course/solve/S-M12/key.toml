# S-M12 answer key (hidden; honor system, DESIGN D34). `ss verify course S-M12`
# check 7 proves every `expect` passes and every `reject` canary fails;
# course/oracle/solve/S-M12.py recomputes every value independently (direct
# convolution and Toeplitz matrices built by loops, the size formula
# evaluated, explicit DFT sums in SymPy, aliasing by folding, the Keys
# kernel evaluated, the frame count by enumerating frame starts, the mel
# formulas, InfoNCE and SigLIP by SymPy differentiation, and WER by an
# edit-distance DP).

