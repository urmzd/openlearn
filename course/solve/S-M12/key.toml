[q7]
type   = "proof"
rubric = [
  "Writes im2col as a copy: column entry (n, c, r, s, p, q) equals the padded input at (n, c, p*sh + r*dh - ph, q*sw + s*dw - pw), or 0 when that position is padding",
  "Expands <im2col(x), Y> as a sum over column entries of Y times the copied pixel",
  "Regroups the sum by input pixel: each pixel collects the Y entries of every column entry copied from it",
  "Identifies that regrouped coefficient as col2im(Y) at that pixel (overlaps summed, padding entries dropped), giving <x, col2im(Y)>",
]

