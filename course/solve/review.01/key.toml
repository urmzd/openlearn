# review.01 answer key (hidden; honor system, DESIGN D34). `ol verify course
# review.01` check 7 proves every `expect` passes and every `reject` canary
# fails; course/oracle/solve/review.01.py recomputes every value independently.

# ---- capacity and budgets ---------------------------------------------------

# why: KV bytes per token = 2 (key and value) x layers x KV heads x head dim x
# bytes per value; GQA stores the 3 KV heads, not the 9 query heads.
[q1]
type   = "number"
expect = "23040"
exact  = true
[[q1.reject]]
answer = "11520"                   # keys only (forgot the values)
[[q1.reject]]
answer = "69120"                   # 9 query heads instead of 3 KV heads
[[q1.reject]]
answer = "46080"                   # float32, not float16
[[q1.reject]]
answer = "768"                     # one layer only

# why: the pool is blocks x tokens per block x bytes per token.
[q2.a]
type   = "number"
expect = "754974720"
exact  = true
[[q2.a.reject]]
answer = "47185920"                # forgot block_size: 2048 tokens, not 2048 blocks
[[q2.a.reject]]
answer = "720"                     # MiB, not bytes

# why: a 512-token sequence needs 512 / 16 = 32 blocks; 2048 / 32 = 64.
[q2.b]
type   = "number"
expect = "64"
exact  = true
[[q2.b.reject]]
answer = "4"                       # 2048 / 512: blocks read as tokens
[[q2.b.reject]]
answer = "32"                      # the blocks one sequence needs

# why: E2E = TTFT + (n - 1) x TPOT = 0.5 + 31 x 0.06 = 2.36 s (the first
# token arrives at TTFT; 31 gaps follow); L = lambda x W = 4 x 2.36.
[q3]
type   = "number"
expect = "236/25"
rtol   = 1e-6
atol   = 1e-9
[[q3.reject]]
answer = "9.68"                    # 32 gaps instead of 31
[[q3.reject]]
answer = "2.36"                    # W alone, not lambda x W
[[q3.reject]]
answer = "2"                       # TTFT x lambda only

# why: 0.5% of 30 days of minutes.
[q4]
type   = "number"
expect = "216"
exact  = true
[[q4.reject]]
answer = "3.6"                     # hours, not minutes
[[q4.reject]]
answer = "7.2"                     # one day of budget (0.5% of 1440 minutes), not 30 days

# why: burn rate b means the budget goes b times faster than the period
# allows; an hour at 14.4 spends 14.4 / 720 of 30 days' budget.
[q5]
type   = "number"
expect = "1/50"
exact  = true
[[q5.reject]]
answer = "12/25"                   # 14.4 / 30: days where hours belong
[[q5.reject]]
answer = "18/125"                  # 14.4 / 100

# why: the whole budget lasts 720 h / 14.4.
[q6]
type   = "number"
expect = "50"
exact  = true
[[q6.reject]]
answer = "25/12"                   # days at 14.4 per day: 30 / 14.4
[[q6.reject]]
answer = "720"                     # the period, at burn rate 1

# ---- the design and its review -----------------------------------------------

[q7]
type   = "proof"
rubric = "design-review"           # course/rubrics/design-review.md

[q8]
type   = "proof"
rubric = [
  "Every design-review rubric line is answered, and each no is a written comment naming the section it concerns",
  "At least one comment recomputes a number of the design (a capacity, latency, or budget figure) and says whether it holds",
  "Every comment proposes a concrete change, or asks a question and names who answers it",
  "At least one comment challenges a failure mode: a way the system fails that the design does not list, or a detection that would not fire",
  "The record ends with a decision (approve, approve with changes, or rework) and what closes each open comment",
]
