# S-M08 answer key (hidden; honor system, DESIGN D34). `ol verify course S-M08`
# check 7 proves every `expect` passes and every `reject` canary fails;
# course/oracle/solve/S-M08.py recomputes every value independently (numpy
# strides and SymPy differentiation of the actual functions).

# ---- layouts and shapes -----------------------------------------------------

# why: a gradient has its variable's shape; L0.1's unbroadcast and L0.2's ops rely on it.
[q1.a]
type   = "vector"
expect = "[2, 3, 5]"
[[q1.a.reject]]
answer = "[2, 3, 4]"               # the input width

[q1.b]
type   = "vector"
expect = "[5, 4]"
[[q1.b.reject]]
answer = "[4, 5]"                  # transposed

[q1.c]
type   = "vector"
expect = "[5]"
[[q1.c.reject]]
answer = "[2, 3, 5]"               # forgot to sum over the broadcast axes

# why: row-major offsets and strides are how M03.1's leading dimensions and L0.1's views work.
[q2.a]
type   = "number"
expect = "21"
exact  = true
[[q2.a.reject]]
answer = "11"                      # column-major offset 1 + 2*2 + 1*6

[q2.b]
type   = "vector"
expect = "[12, 4, 1]"
[[q2.b.reject]]
answer = "[48, 16, 4]"             # bytes, not elements
[[q2.b.reject]]
answer = "[1, 2, 6]"               # column-major

[q2.c]
type   = "vector"
expect = "[12, 1, 4]"
[[q2.c.reject]]
answer = "[12, 3, 1]"              # the strides of a fresh contiguous copy

[q3]
type   = "number"
expect = "6"
exact  = true
[[q3.reject]]
answer = "30"                      # every entry of Y
[[q3.reject]]
answer = "2"                       # summed over the batch only

# why: nobody builds this matrix; VJPs exist so that you never do.
[q4]
type   = "vector"
expect = "[30, 24]"
[[q4.reject]]
answer = "[24, 30]"                # (inputs, outputs)

# ---- differentials of matrix expressions -------------------------------------

[q5]
type   = "vector"
expect = "[2*x1 + 2*x2, 2*x1 + 6*x2]"
vars   = { x1 = "real", x2 = "real" }
[[q5.reject]]
answer = "[2*x1 + 4*x2, 6*x2]"     # 2 A x, as if A were symmetric
[[q5.reject]]
answer = "[x1 + 2*x2, 3*x2]"       # A x

[q6]
type   = "matrix"
expect = "[[1, 3], [2, 4]]"
[[q6.reject]]
answer = "[[1, 2], [3, 4]]"        # A, not its transpose

[q7]
type   = "vector"
expect = "[6, 6]"
[[q7.reject]]
answer = "[3, 3]"                  # dropped the 2 from the square
[[q7.reject]]
answer = "[0, 6]"                  # 2 (A x - b), forgot A^T

[q8]
type   = "matrix"
expect = "[[1/4, -1/2], [-1/4, 1/2]]"
[[q8.reject]]
answer = "[[-1/4, 1/2], [1/4, -1/2]]"   # lost the minus sign
[[q8.reject]]
answer = "[[0, -1], [0, 0]]"            # -dX, as if X^-1 were I

[q9]
type   = "matrix"
expect = "[[1/2, 0], [-1/6, 1/3]]"
[[q9.reject]]
answer = "[[1/2, -1/6], [0, 1/3]]" # X^-1, not X^-T

[q10]
type   = "matrix"
expect = "[[2, 4], [4, 8]]"
[[q10.reject]]
answer = "[[1, 2], [2, 4]]"        # dropped the 2

# why: L0.2 registers sigmoid and SiLU with these derivatives.
[q11]
type   = "expr"
expect = "exp(-z)/(1 + exp(-z))^2"
vars   = { z = "real" }
[[q11.reject]]
answer = "1/(1 + exp(-z))"         # sigma itself
[[q11.reject]]
answer = "-exp(-z)/(1 + exp(-z))^2"   # sign of the inner derivative lost

[q12]
type   = "expr"
expect = "1/(1 + exp(-z))"
vars   = { z = "real" }
[[q12.reject]]
answer = "1/(1 + exp(z))"          # sigma(-z)

# why: the gradient of logsumexp is softmax; M09.2 and L0.3 rest on it.
[q13]
type   = "vector"
expect = "[exp(x1)/(exp(x1) + exp(x2)), exp(x2)/(exp(x1) + exp(x2))]"
vars   = { x1 = "real", x2 = "real" }
[[q13.reject]]
answer = "[exp(x1), exp(x2)]"      # forgot the outer log's derivative

[q14]
type   = "vector"
expect = "[3/5, 4/5]"
[[q14.reject]]
answer = "[6, 8]"                  # gradient of the squared norm

[q15]
type   = "matrix"
expect = "[[0, 0, 0], [0, 1, 0], [0, 0, 1]]"
[[q15.reject]]
answer = "[[0, 0, 0], [0, 2, 0], [0, 0, 1/2]]"   # the outputs on the diagonal
[[q15.reject]]
answer = "[[1, 1, 1], [1, 1, 1], [1, 1, 1]]"     # not a diagonal Jacobian

[q16]
type   = "proof"
rubric = [
  "Starts from X X^-1 = I and takes the differential of both sides",
  "Uses the product rule d(AB) = dA B + A dB and dI = 0",
  "Solves for d(X^-1) by multiplying on the left by X^-1, keeping the order of the noncommuting factors",
]

# ---- the trace trick --------------------------------------------------------

[q17.a]
type   = "bool"
expect = "true"
[[q17.a.reject]]
answer = "false"

# why: the trace is invariant under cyclic shifts only, not arbitrary swaps.
[q17.b]
type   = "bool"
expect = "false"
[[q17.b.reject]]
answer = "true"

# why: matmul_vjp in M08.3 returns exactly these two.
[q18.a]
type   = "matrix"
expect = "[[1, 3], [2, 4]]"
[[q18.a.reject]]
answer = "[[1, 2], [3, 4]]"        # G X instead of X^T G
[[q18.a.reject]]
answer = "[[1, 0], [1, 2]]"        # the dX answer

[q18.b]
type   = "matrix"
expect = "[[1, 0], [1, 2]]"
[[q18.b.reject]]
answer = "[[1, 1], [0, 2]]"        # G W, forgot the transpose

[q19]
type   = "number"
expect = "5"
exact  = true
[[q19.reject]]
answer = "0"                       # tr(A) * tr(B)
[[q19.reject]]
answer = "10"                      # sum of A's entries

[q20]
type   = "proof"
rubric = [
  "Writes dY = dX W + X dW (product rule)",
  "Substitutes into dL = tr(G^T dY) and splits it into two traces",
  "Uses the cyclic property to bring each to the form tr(M^T dW) and tr(N^T dX)",
  "Reads off dL/dW = X^T G and dL/dX = G W^T from dL = tr((dL/dW)^T dW) + ...",
]

# ---- VJPs by hand -----------------------------------------------------------

[q21]
type   = "vector"
expect = "[1/4, -1/8, -1/8]"
[[q21.reject]]
answer = "[1/2, 0, 0]"             # y * g, dropped the <g, y> term
[[q21.reject]]
answer = "[1/2, -1/4, -1/4]"       # g - y

[q22]
type   = "matrix"
expect = "[[3/16, -3/16], [-3/16, 3/16]]"
[[q22.reject]]
answer = "[[1/4, 0], [0, 3/4]]"    # diag(y)
[[q22.reject]]
answer = "[[3/16, 3/16], [3/16, 3/16]]"   # lost the off-diagonal minus

[q23]
type   = "vector"
expect = "[-1/2, 3/4, -1/4]"
[[q23.reject]]
answer = "[0, 3/4, 0]"             # g - y * g
[[q23.reject]]
answer = "[1/2, -3/4, 1/4]"        # sign flipped

# why: fused cross-entropy (L0.3) returns softmax minus one-hot.
[q24.a]
type   = "vector"
expect = "[1/5, -3/5, 2/5]"
[[q24.a.reject]]
answer = "[1/5, 2/5, 2/5]"         # forgot the one-hot
[[q24.a.reject]]
answer = "[-1/5, 3/5, -2/5]"       # one-hot minus softmax

[q24.b]
type   = "number"
expect = "log(5/2)"
exact  = true
[[q24.b.reject]]
answer = "log(2/5)"                # missing the minus
[[q24.b.reject]]
answer = "2/5"                     # the probability, not the loss

[q25]
type   = "number"
expect = "1/3"
exact  = true
[[q25.reject]]
answer = "1/4"                     # divided by all positions, ignored ones included

[q26.a]
type   = "vector"
expect = "[16*sqrt(2)/125, -12*sqrt(2)/125]"
[[q26.a.reject]]
answer = "[sqrt(2)/5, 0]"          # treated r as a constant
[[q26.a.reject]]
answer = "[-9*sqrt(2)/125, -12*sqrt(2)/125]"   # only the r-dependent term

# why: RMSNorm is scale invariant, so its input gradient is orthogonal to x (L7.1's property test).
[q26.b]
type   = "bool"
expect = "true"
[[q26.b.reject]]
answer = "false"

[q27]
type   = "vector"
expect = "[sqrt(6)/12, -sqrt(6)/6, sqrt(6)/12]"
[[q27.reject]]
answer = "[sqrt(6)/2, 0, 0]"       # g / sigma, both mean and variance treated as constants
[[q27.reject]]
answer = "[sqrt(6)/3, -sqrt(6)/6, -sqrt(6)/6]"   # mean's dependence kept, variance's dropped

[q28]
type   = "proof"
rubric = [
  "Derives the Jacobian dy_i/dx_j = y_i (delta_ij - y_j) from the quotient rule",
  "Writes (dL/dx)_j = sum_i g_i dy_i/dx_j and simplifies to y_j (g_j - sum_i g_i y_i)",
  "States the result in vector form and notes it never builds the V x V Jacobian",
]

# ---- forward versus reverse mode ---------------------------------------------

[q29.a]
type   = "number"
expect = "10^6"
exact  = true
[[q29.a.reject]]
answer = "1"

# why: one VJP per scalar output; this is why training uses reverse mode.
[q29.b]
type   = "number"
expect = "1"
exact  = true
[[q29.b.reject]]
answer = "10^6"

[q30]
type   = "choice"
expect = "a"
[[q30.reject]]
answer = "b"

# why: M08.4 trades this memory for recompute with checkpointing.
[q31]
type   = "number"
expect = "2097152"
exact  = true
[[q31.reject]]
answer = "524288"                  # counted floats, not bytes

[q32.a]
type   = "expr"
expect = "4*m*k*n"
vars   = { m = "positive", k = "positive", n = "positive" }
domain = { m = [1.0, 20.0], k = [1.0, 20.0], n = [1.0, 20.0] }
[[q32.a.reject]]
answer = "2*m*k*n"                 # counted one of the two products
[[q32.a.reject]]
answer = "m*k*n"

# why: forward 2, backward 4: the 6N of the training-compute rule.
[q32.b]
type   = "number"
expect = "3"
exact  = true
[[q32.b.reject]]
answer = "2"

# ---- the SDPA Jacobian -------------------------------------------------------

# why: L4.x and L5.x attention backward; the flash kernel of L9.4 recomputes P from these rules.
[q33.a]
type   = "matrix"
expect = "[[(1 + 3*E)/(1 + E)], [2]]"
[[q33.a.reject]]
answer = "[[(3 + E)/(1 + E)], [2]]"     # softmax weights on the wrong keys
[[q33.a.reject]]
answer = "[[3], [2]]"                   # argmax instead of softmax

[q33.b]
type   = "matrix"
expect = "[[1/(1 + E)], [E/(1 + E)]]"
[[q33.b.reject]]
answer = "[[1/(1 + E)], [1/2]]"         # P dO instead of P^T dO

[q33.c]
type   = "matrix"
expect = "[[2*E/(1 + E)^2], [0]]"
[[q33.c.reject]]
answer = "[[3], [0]]"                   # skipped the softmax VJP: dP K
[[q33.c.reject]]
answer = "[[-2*E/(1 + E)^2], [0]]"      # sign of the softmax term lost

[q34]
type   = "proof"
rubric = [
  "Derives dV = P^T dO and dP = dO V^T from the matmul rule (q20)",
  "Applies the softmax VJP (q28) row by row to get dS",
  "Derives dQ = dS K / sqrt(d) and dK = dS^T Q / sqrt(d) from S = Q K^T / sqrt(d)",
  "Checks every shape: dQ like Q, dK like K, dV like V",
]
