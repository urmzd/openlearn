# S-M11a answer key (hidden; honor system, DESIGN D34). `ol verify course S-M11a`
# check 7 proves every `expect` passes and every `reject` canary fails;
# course/oracle/solve/S-M11a.py recomputes every value independently (direct
# sums over the distributions in SymPy, scipy-free).

# ---- entropy and chain rules -------------------------------------------------

# why: M11.1's entropy() is checked against these, in nats and bits.
[q1.a]
type   = "number"
expect = "1"
exact  = true
[[q1.a.reject]]
answer = "log(2)"                  # nats, not bits

[q1.b]
type   = "number"
expect = "8"
exact  = true
[[q1.b.reject]]
answer = "256"                     # the number of outcomes, not its log

[q1.c]
type   = "number"
expect = "3/2"
exact  = true
[[q1.c.reject]]
answer = "log(3, 2)"               # treated as uniform over 3

# why: log V is the loss of an untrained model; L0.5 starts near it.
[q2]
type   = "expr"
expect = "log(V)"
vars   = { V = "positive" }
domain = { V = [2.0, 1000.0] }
[[q2.reject]]
answer = "log(V)/log(2)"           # bits
[[q2.reject]]
answer = "1/V"

[q3.a]
type   = "number"
expect = "1/2"
exact  = true
[[q3.a.reject]]
answer = "1"

[q3.b]
type   = "number"
expect = "2 - 3*log(3, 2)/4"
exact  = true
[[q3.b.reject]]
answer = "1/2"                     # p log p for one term only
[[q3.b.reject]]
answer = "2 - 3*log(3)/4"          # mixed natural log into a bits answer

[q4.a]
type   = "number"
expect = "3/2"
exact  = true
[[q4.a.reject]]
answer = "2"                       # the zero-probability cell counted as a quarter

[q4.b]
type   = "number"
expect = "2 - 3*log(3, 2)/4"
exact  = true
[[q4.b.reject]]
answer = "1"                       # assumed X is uniform

# why: conditioning never increases entropy; H(Y | X) <= H(Y).
[q4.c]
type   = "number"
expect = "3*log(3, 2)/4 - 1/2"
exact  = true
[[q4.c.reject]]
answer = "3/2"                     # the joint entropy
[[q4.c.reject]]
answer = "2 - 3*log(3, 2)/4"       # H(X), not the conditional entropy

[q5]
type   = "proof"
rubric = [
  "Writes P(x, y) = P(x) P(y | x) and takes -log of both sides",
  "Takes the expectation over (X, Y) and splits it into two sums",
  "Identifies the first sum as H(X) by marginalizing y, and the second as sum_x P(x) H(Y | X = x)",
  "Handles terms with P(x, y) = 0 using 0 log 0 = 0",
]

# ---- cross-entropy and KL divergence -----------------------------------------

[q6.a]
type   = "number"
expect = "2 - log(3, 2)/2"
exact  = true
[[q6.a.reject]]
answer = "1"                       # H(p), not H(p, q)

# why: KL = cross-entropy minus entropy; L12.3's KL penalty is this quantity per token.
[q6.b]
type   = "number"
expect = "1 - log(3, 2)/2"
exact  = true
[[q6.b.reject]]
answer = "3*log(3, 2)/4 - 1"       # KL(q || p)
[[q6.b.reject]]
answer = "2 - log(3, 2)/2"         # the cross-entropy

[q6.c]
type   = "number"
expect = "3*log(3, 2)/4 - 1"
exact  = true
[[q6.c.reject]]
answer = "1 - log(3, 2)/2"         # KL(p || q)

[q6.d]
type   = "bool"
expect = "false"
[[q6.d.reject]]
answer = "true"

[q7]
type   = "number"
expect = "8*log(2)"
exact  = true
[[q7.reject]]
answer = "8"                       # bits, not nats
[[q7.reject]]
answer = "1/256"

# why: L12.3 logs k3 because it is unbiased and never negative, unlike the plain log-ratio.
[q8.a]
type   = "number"
expect = "1 - log(2)"
exact  = true
[[q8.a.reject]]
answer = "1 + log(2)"              # sign of r
[[q8.a.reject]]
answer = "log(2)"                  # the k1 estimator r itself

[q8.b]
type   = "bool"
expect = "true"
[[q8.b.reject]]
answer = "false"

[q9]
type   = "proof"
rubric = [
  "Restricts the sum to the support of p and writes -KL = sum p_i log(q_i / p_i)",
  "Applies log t <= t - 1 (or Jensen's inequality for the concave log) with t = q_i / p_i",
  "Bounds the result by sum_{i: p_i > 0} q_i - 1 <= 0",
  "Shows equality forces q_i / p_i = 1 on the support and that q then has no mass elsewhere, so p = q",
]
