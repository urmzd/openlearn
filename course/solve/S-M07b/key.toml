# S-M07b answer key (hidden; honor system, DESIGN D34). `ol verify course S-M07b`
# check 7 proves every `expect` passes and every `reject` canary fails;
# course/oracle/solve/S-M07b.py recomputes every value independently.

# ---- joint distributions and covariance -------------------------------------

# why: a marginal sums the joint over the other variable; a conditional renormalizes a column.
[q1.a]
type   = "number"
expect = "3/8"
exact  = true
[[q1.a.reject]]
answer = "1/4"                     # read one cell, not the column sum

[q1.b]
type   = "number"
expect = "2/3"
exact  = true
[[q1.b.reject]]
answer = "1/4"                     # the joint P(X = 1, Y = 0)
[[q1.b.reject]]
answer = "1/2"                     # the marginal P(X = 1)

# why: independence needs every cell to factor; one cell that does not is enough to refute it.
[q1.c]
type   = "bool"
expect = "false"
[[q1.c.reject]]
answer = "true"

[q2.a]
type   = "number"
expect = "3/8"
exact  = true
[[q2.a.reject]]
answer = "7/16"                    # E[X] E[Y], which equals E[XY] only without covariance

# why: Cov(X, Y) = E[XY] - E[X] E[Y]; the sign says which way the variables move together.
[q2.b]
type   = "number"
expect = "-1/16"
exact  = true
[[q2.b.reject]]
answer = "1/16"                    # E[X] E[Y] - E[XY], the sign flipped
[[q2.b.reject]]
answer = "3/8"                     # E[XY] not centered

# why: the cross term is why correlated losses average down slower than independent ones.
[q3]
type   = "expr"
expect = "a^2*vx + b^2*vy + 2*a*b*c"
vars   = { a = "real", b = "real", vx = "positive", vy = "positive", c = "real" }
domain = { a = [-3.0, 3.0], b = [-3.0, 3.0], vx = [0.1, 4.0], vy = [0.1, 4.0], c = [-1.0, 1.0] }
[[q3.reject]]
answer = "a^2*vx + b^2*vy"         # the covariance term dropped
[[q3.reject]]
answer = "a*vx + b*vy + 2*a*b*c"   # scales not squared
[[q3.reject]]
answer = "a^2*vx + b^2*vy + a*b*c" # cross term counted once

[q4.a]
type   = "number"
expect = "0"
exact  = true
[[q4.a.reject]]
answer = "2/3"                     # E[Y], not the covariance

# why: zero covariance rules out only a linear relation; Y = X^2 is a function of X.
[q4.b]
type   = "bool"
expect = "false"
[[q4.b.reject]]
answer = "true"

# ---- maximum likelihood ----------------------------------------------------------

# why: the categorical MLE is count over total (M07.2 mle); Laplace adds one to every vocab entry.
[q5.a]
type   = "number"
expect = "3/10"
exact  = true
[[q5.a.reject]]
answer = "1/4"                     # one over the number of distinct words
[[q5.a.reject]]
answer = "4/15"                    # the Laplace estimate, asked in (b) for another word

[q5.b]
type   = "number"
expect = "1/15"
exact  = true
[[q5.b.reject]]
answer = "0"                       # the plain MLE of an unseen word
[[q5.b.reject]]
answer = "1/14"                    # V = 4: only the seen words in the vocabulary
[[q5.b.reject]]
answer = "1/11"                    # one added to N only

[q6.a]
type   = "expr"
expect = "k*log(p) + (n - k)*log(1 - p)"
vars   = { k = "positive", n = "positive", p = "positive" }
domain = { k = [1.0, 5.0], n = [6.0, 12.0], p = [0.05, 0.95] }
[[q6.a.reject]]
answer = "k*log(p)"                # the failures dropped
[[q6.a.reject]]
answer = "p^k*(1 - p)^(n - k)"     # the likelihood, not its log

# why: setting the derivative of q6.a to zero gives the success fraction.
[q6.b]
type   = "expr"
expect = "k/n"
vars   = { k = "positive", n = "positive" }
domain = { k = [1.0, 5.0], n = [6.0, 12.0] }
[[q6.b.reject]]
answer = "(k + 1)/(n + 2)"         # Laplace's rule of succession, not the MLE
[[q6.b.reject]]
answer = "n/k"

# why: the rate is the reciprocal of the mean gap; load.01's arrival schedule is fitted this way.
[q7]
type   = "expr"
expect = "n/s"
vars   = { n = "positive", s = "positive" }
domain = { n = [1.0, 50.0], s = [0.5, 100.0] }
[[q7.reject]]
answer = "s/n"                     # the mean gap, not the rate
[[q7.reject]]
answer = "(n - 1)/s"               # the unbiased estimator, not the MLE

# why: one EM step of L1.4 by hand: posterior-weighted counts, then count over total.
[q8.a]
type   = "number"
expect = "1/9"
exact  = true
[[q8.a.reject]]
answer = "1/4"                     # the prior probability of a, not its expected count
[[q8.a.reject]]
answer = "1/2"                     # both segmentations weighted equally

[q8.b]
type   = "number"
expect = "4/5"
exact  = true
[[q8.b.reject]]
answer = "8/9"                     # the expected count, not divided by the total 10/9
[[q8.b.reject]]
answer = "1/2"                     # the old probability: no M-step

[q9]
type   = "proof"
rubric = [
  "States the claim: for counts c_1..c_V >= 0 with N = c_1 + ... + c_V > 0, the p maximizing sum_k c_k log p_k over the probability simplex is p_k = c_k / N",
  "Writes the objective as N * sum_k (c_k/N) log p_k and relates it to -N (H(c/N) + KL(c/N || p)), or sets up a Lagrange multiplier for sum_k p_k = 1",
  "Uses KL >= 0 with equality only at p = c/N (Gibbs' inequality), or solves the stationarity conditions and argues the stationary point is the maximum",
  "Handles counts of zero: p_k = 0 there, with 0 log 0 = 0, and a p_k = 0 where c_k > 0 gives log-likelihood -infinity",
]
