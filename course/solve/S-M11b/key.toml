# S-M11b answer key (hidden; honor system, DESIGN D34). `ol verify course S-M11b`
# check 7 proves every `expect` passes and every `reject` canary fails;
# course/oracle/solve/S-M11b.py recomputes every value independently (a
# heap-based Huffman construction, direct sums over the joint distributions
# in SymPy, the T -> oo limit by sympy.limit, and R(D) from its formula).

# ---- coding theorems and Huffman ---------------------------------------------

# why: M11.3's huffman_lengths returns these lengths; dyadic sources are coded at the entropy.
[q1.a]
type   = "vector"
expect = "[1, 2, 3, 3]"
[[q1.a.reject]]
answer = "[2, 2, 2, 2]"            # a fixed-length code
[[q1.a.reject]]
answer = "[3, 3, 2, 1]"            # lengths listed in the wrong order

[q1.b]
type   = "number"
expect = "7/4"
exact  = true
[[q1.b.reject]]
answer = "2"                       # the fixed-length code

[q1.c]
type   = "bool"
expect = "true"
[[q1.c.reject]]
answer = "false"

[q2.a]
type   = "number"
expect = "19/10"
exact  = true
[[q2.a.reject]]
answer = "2"
[[q2.a.reject]]
answer = "-(2/5*log(2/5, 2) + 3/10*log(3/10, 2) + 1/5*log(1/5, 2) + 1/10*log(1/10, 2))"   # the entropy, not the code length

# why: a complete prefix code (every internal node has two children) meets Kraft with equality.
[q2.b]
type   = "number"
expect = "1"
exact  = true
[[q2.b.reject]]
answer = "1/2"

# why: the Shannon code is within one bit of H; Huffman is never worse than it.
[q3.a]
type   = "number"
expect = "12/5"
exact  = true
[[q3.a.reject]]
answer = "19/10"                   # the Huffman length
[[q3.a.reject]]
answer = "9/5"                     # floor instead of ceiling

[q3.b]
type   = "bool"
expect = "false"
[[q3.b.reject]]
answer = "true"                    # 1/2 + 1/4 + 1/4 + 1/8 = 9/8 > 1

[q4]
type   = "proof"
rubric = [
  "Sets L = max_i l_i and represents each codeword as a node at depth l_i of the complete binary tree of depth L",
  "Counts the 2^(L - l_i) leaves at depth L below codeword i",
  "Uses the prefix property: no codeword is an ancestor of another, so these leaf sets are disjoint",
  "Sums the disjoint counts against the 2^L leaves and divides by 2^L to get sum_i 2^(-l_i) <= 1",
]

# ---- mutual information -------------------------------------------------------

# why: M11.4's mutual_information is this sum, in nats.
[q5.a]
type   = "number"
expect = "3*log(3, 2)/4 - 1"
exact  = true
[[q5.a.reject]]
answer = "3*log(3)/4 - log(2)"     # nats, not bits
[[q5.a.reject]]
answer = "1"                       # H(X), not I(X; Y)

[q5.b]
type   = "number"
expect = "log(3, 2) - 1"
exact  = true
[[q5.b.reject]]
answer = "log(3/8, 2)"             # log of the joint alone

# why: a negative PMI means less often together than chance; PPMI clips it to 0.
[q5.c]
type   = "number"
expect = "-1"
exact  = true
[[q5.c.reject]]
answer = "1"                       # sign flipped
[[q5.c.reject]]
answer = "0"                       # PPMI, not PMI

[q6.a]
type   = "number"
expect = "1"
exact  = true
[[q6.a.reject]]
answer = "2"                       # H(X), not I(X; Y)
[[q6.a.reject]]
answer = "0"

[q6.b]
type   = "bool"
expect = "true"
[[q6.b.reject]]
answer = "false"                   # KL is not symmetric, but I is

[q7]
type   = "proof"
rubric = [
  "Splits log P(x, y) / (P(x) P(y)) into log P(x, y) - log P(x) - log P(y) and sums against P(x, y)",
  "Marginalizes each single-variable sum to get H(X) + H(Y) - H(X, Y)",
  "Writes I(X; Y) = KL(P_XY || P_X P_Y) and applies Gibbs' inequality for I >= 0",
  "States equality in Gibbs means P(x, y) = P(x) P(y) for all x, y, which is the definition of independence",
]

# ---- maximum entropy ----------------------------------------------------------

[q8.a]
type   = "number"
expect = "1/2"
exact  = true
[[q8.a.reject]]
answer = "1/3"                     # ignored the logits

# why: L8.1's temperature divides the logits: T < 1 sharpens the distribution.
[q8.b]
type   = "number"
expect = "9/14"
exact  = true
[[q8.b.reject]]
answer = "1/2"                     # temperature ignored
[[q8.b.reject]]
answer = "sqrt(3)/(1 + sqrt(2) + sqrt(3))"   # multiplied by T instead of dividing

[q8.c]
type   = "choice"
expect = "b"
[[q8.c.reject]]
answer = "a"                       # that is T -> 0, greedy decoding

[q9]
type   = "proof"
rubric = [
  "Writes the Lagrangian -sum p_i log p_i - lambda (sum p_i - 1) - beta (sum p_i E_i - E_bar) with one multiplier per constraint",
  "Sets the derivative in p_i to zero: -log p_i - 1 - lambda - beta E_i = 0",
  "Solves p_i = exp(-1 - lambda) exp(-beta E_i) and fixes the constant by normalization, giving 1/Z(beta)",
  "Argues it is a maximum (entropy is strictly concave on the simplex, the constraints are linear) and names the softmax of -E at temperature 1/beta",
]

# ---- rate-distortion ----------------------------------------------------------

[q10.a]
type   = "number"
expect = "7*log(7, 2)/8 - 2"
exact  = true
[[q10.a.reject]]
answer = "3 - 7*log(7, 2)/8"       # H_b(1/8), not 1 - H_b(1/8)
[[q10.a.reject]]
answer = "7/8"

[q10.b]
type   = "number"
expect = "0"
exact  = true
[[q10.b.reject]]
answer = "1"

# why: L8.5's quantizers: about 6 dB of SNR, a factor 4 in MSE, per bit.
[q11.a]
type   = "number"
expect = "2"
exact  = true
[[q11.a.reject]]
answer = "4"                       # forgot the 1/2
[[q11.a.reject]]
answer = "16"

[q11.b]
type   = "number"
expect = "4"
exact  = true
[[q11.b.reject]]
answer = "2"                       # 1/2 log_2: one bit halves sqrt(D), not D
