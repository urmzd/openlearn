# S-M09b answer key (hidden; honor system, DESIGN D34). `ol verify course S-M09b`
# check 7 proves every `expect` passes and every `reject` canary fails;
# course/oracle/solve/S-M09b.py recomputes every value independently (SymPy
# singular values and limits, exact rational Newton steps, float iteration,
# Lagrange bounds evaluated in high precision, ml_dtypes-free rounding by
# exhaustive search over the code tables).

# ---- condition numbers ---------------------------------------------------------

# why: subtracting nearly equal numbers is ill-conditioned (cancellation).
[q1]
type   = "number"
expect = "1001"
exact  = true
[[q1.reject]]
answer = "1"                       # the absolute condition |f'(x)|
[[q1.reject]]
answer = "1/1001"

[q2]
type   = "number"
expect = "50"
exact  = true
[[q2.reject]]
answer = "exp(50)"                 # |f'(x)|, the absolute condition
[[q2.reject]]
answer = "1"

[q3]
type   = "number"
expect = "100"
exact  = true
[[q3.reject]]
answer = "10"

# why: singular values, not eigenvalues (A is not symmetric).
[q4]
type   = "number"
expect = "3"
exact  = true
[[q4.reject]]
answer = "5/3"                     # ratio of the eigenvalues 5 and 3
[[q4.reject]]
answer = "9"                       # ratio of the eigenvalues of A^T A

[q5]
type   = "number"
expect = "1/1000"
exact  = true
[[q5.reject]]
answer = "10^-9"                   # divided by cond instead of multiplying

[q6]
type   = "proof"
rubric = [
  "Subtracts Ax = b from A(x + dx) = b + db to get A dx = db, so dx = A^-1 db",
  "Bounds ||dx|| <= ||A^-1|| ||db|| and ||b|| = ||Ax|| <= ||A|| ||x||, so 1/||x|| <= ||A|| / ||b||",
  "Multiplies the two bounds: ||dx|| / ||x|| <= ||A|| ||A^-1|| ||db|| / ||b||",
  "Identifies ||A||_2 = sigma_max and ||A^-1||_2 = 1/sigma_min, so the factor is kappa_2(A)",
]

# ---- sum and dot error bounds -----------------------------------------------------

[q7]
type   = "number"
expect = "3/(2^24 - 3)"
exact  = true
[[q7.reject]]
answer = "3*2^-24"                 # first order only: k u, not k u / (1 - k u)
[[q7.reject]]
answer = "3/(2^23 - 3)"            # used eps = 2^-23 for u

[q8]
type   = "number"
expect = "2^-12"
exact  = true
[[q8.reject]]
answer = "2^-11"                   # eps instead of u

# why: pairwise summation is why numpy's sums are accurate (M09.2).
[q9]
type   = "number"
expect = "13*2^-24"
exact  = true
[[q9.reject]]
answer = "12*2^-24"                # forgot the rounding of the products
[[q9.reject]]
answer = "2^-12"

[q10]
type   = "number"
expect = "256"
exact  = true
[[q10.reject]]
answer = "128"                     # eps = 2^-7 instead of u = 2^-8

[q11]
type   = "number"
expect = "2^-18"
exact  = true
[[q11.reject]]
answer = "2^-12"                   # k u, the worst case

[q12]
type   = "proof"
rubric = [
  "Writes each addition with the model fl(a + b) = (a + b)(1 + d), |d| <= u",
  "Expands fl(fl(x1 + x2) + x3) = (x1 + x2)(1 + d1)(1 + d2) + x3 (1 + d2)",
  "Bounds |(1 + d1)(1 + d2) - 1| <= 2u + u^2 <= gamma_2 and |d2| <= u <= gamma_2",
  "Concludes |error| <= gamma_2 (|x1| + |x2| + |x3|) by the triangle inequality",
]

# ---- fixed point and Newton convergence ----------------------------------------------

[q13]
type   = "number"
expect = "0.6736120291832148"
rtol   = 1e-6
atol   = 0.0
[[q13.reject]]
answer = "0.7390851332"            # the fixed point, not the rate
[[q13.reject]]
answer = "0.6736"                  # 4 digits: outside rtol 1e-6

[q14]
type   = "number"
expect = "59/125"
exact  = true
[[q14.reject]]
answer = "0.472"                   # a decimal: give the exact value
[[q14.reject]]
answer = "1/2"                     # the limit, not one step

[q15]
type   = "number"
expect = "47/8192"
exact  = true
[[q15.reject]]
answer = "3/512"                   # dropped the -e^3/2 term

[q16.a]
type   = "number"
expect = "2"
exact  = true
[[q16.a.reject]]
answer = "1"

[q16.b]
type   = "number"
expect = "1/2"
exact  = true
[[q16.b.reject]]
answer = "1"
[[q16.b.reject]]
answer = "2"

[q17]
type   = "proof"
rubric = [
  "Substitutes y_k = (1 - e_k) / sqrt(a) into y_(k+1) = y_k (3 - a y_k^2) / 2",
  "Expands sqrt(a) y_(k+1) = (1 - e_k)(3 - (1 - e_k)^2) / 2 = 1 - (3 e_k^2 - e_k^3) / 2",
  "Reads off e_(k+1) = (3 e_k^2 - e_k^3) / 2",
  "Concludes quadratic convergence: e_(k+1) / e_k^2 tends to 3/2, so correct digits roughly double per step",
]

