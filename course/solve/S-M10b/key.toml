[q15]
type   = "vector"
expect = "[exp(1)/(1 + exp(1)), 1/(1 + exp(1))]"
[[q15.reject]]
answer = "[1/2, 1/2]"                  # ignored the reward tilt

[q16]
type   = "number"
expect = "1"
exact  = true
[[q16.reject]]
answer = "0"                          # omitted the reference-policy ratio

[q17]
type   = "number"
expect = "log(2)"
exact  = true
[[q17.reject]]
