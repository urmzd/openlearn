[q18]
type   = "proof"
rubric = [
  "States pi*(y|x) is proportional to pi_ref(y|x) exp(r(x,y)/beta)",
  "Takes log odds between chosen and rejected completions",
  "Explains that the shared normalization constant cancels and leaves the reward difference divided by beta",
]
