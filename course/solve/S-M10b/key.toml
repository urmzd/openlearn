# S-M10b answer key (hidden; honor system, DESIGN D34). The listed answers
# match course/solve/S-M10b/problems.md and the problem-set chapter.

# ---- Lagrange multipliers and KKT --------------------------------------------

[q1]
type   = "vector"
expect = "[1, 1]"
[[q1.reject]]
answer = "[0, 2]"                     # feasible, but not the minimum-norm point

[q2]
type   = "number"
expect = "-2"
exact  = true
[[q2.reject]]
answer = "2"                          # sign from the alternative Lagrangian convention

[q3]
type   = "number"
expect = "1"
exact  = true
[[q3.reject]]
answer = "-1"                         # violates x >= 1

[q4]
type   = "number"
expect = "2"
exact  = true
[[q4.reject]]
answer = "-2"                         # wrong sign for g(x) = 1 - x <= 0

[q5]
type   = "number"
expect = "0"
exact  = true
[[q5.reject]]
answer = "4"                          # the multiplier, not the stationarity residual

[q6]
type   = "bool"
expect = "true"
[[q6.reject]]
answer = "false"

[q7]
type   = "number"
expect = "1"
exact  = true
[[q7.reject]]
answer = "3"                          # unconstrained minimizer is infeasible

[q8]
type   = "number"
expect = "4"
exact  = true
[[q8.reject]]
answer = "-4"                         # wrong sign for g(x) = x - 1 <= 0

[q9]
type   = "number"
expect = "0"
exact  = true
[[q9.reject]]
answer = "1"                          # strict slack forces a zero multiplier

[q10]
type   = "bool"
expect = "false"
[[q10.reject]]
answer = "true"

# ---- Duality -----------------------------------------------------------------

[q11]
