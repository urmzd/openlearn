# S-M07a answer key (hidden; honor system, DESIGN D34). `ol verify course S-M07a`
# check 7 proves every `expect` passes and every `reject` canary fails;
# course/oracle/solve/S-M07a.py recomputes every value independently.

# ---- axioms, conditional probability, Bayes ---------------------------------

# why: inclusion-exclusion and conditioning are the two moves every later count uses.
[q1.a]
type   = "number"
expect = "7/10"
exact  = true
[[q1.a.reject]]
answer = "9/10"                    # added without subtracting the overlap

[q1.b]
type   = "number"
expect = "1/2"
exact  = true
[[q1.b.reject]]
answer = "2/5"                     # P(B | A)

[q1.c]
type   = "bool"
expect = "true"
[[q1.c.reject]]
answer = "false"

[q2.a]
type   = "number"
expect = "1/6"
exact  = true
[[q2.a.reject]]
answer = "1/11"                    # 11 sums treated as equally likely

[q2.b]
type   = "number"
expect = "11/36"
exact  = true
[[q2.b.reject]]
answer = "1/3"                     # 1/6 + 1/6, double-counted (6, 6)

# why: conditioning shrinks the sample space to the 11 outcomes with a six.
[q2.c]
type   = "number"
expect = "2/11"
exact  = true
[[q2.c.reject]]
answer = "1/6"                     # ignored the condition
[[q2.c.reject]]
answer = "2/36"                    # joint, not conditional

# why: base rates; the safety report of ethics.04 quotes precision, not sensitivity.
[q3.a]
type   = "number"
expect = "117/2000"
exact  = true
[[q3.a.reject]]
answer = "9/1000"                  # only the true positives

[q3.b]
type   = "number"
expect = "2/13"
exact  = true
[[q3.b.reject]]
answer = "9/10"                    # confused P(flag | bad) with P(bad | flag)

# why: the birthday computation over the byte alphabet (S-M06b grows it into a bound).
[q4]
type   = "number"
expect = "32385/32768"
exact  = true
[[q4.reject]]
answer = "1 - 3/256"               # union bound used as an equality

[q5.a]
type   = "number"
expect = "5/8"
exact  = true
[[q5.a.reject]]
answer = "3/4"

[q5.b]
type   = "number"
expect = "3/5"
exact  = true
[[q5.b.reject]]
answer = "3/8"                     # joint P(biased and heads)

[q6]
type   = "proof"
rubric = [
  "Writes A u B as the disjoint union A u (B \\ A), and B as the disjoint union (A n B) u (B \\ A)",
  "Applies additivity (the third axiom) to both decompositions",
  "Eliminates P(B \\ A) to reach P(A u B) = P(A) + P(B) - P(A n B)",
  "Uses only the axioms and set identities, each step named",
]

# ---- discrete random variables ----------------------------------------------

[q7.a]
type   = "number"
expect = "7/2"
exact  = true
[[q7.a.reject]]
answer = "3"

[q7.b]
type   = "number"
expect = "91/6"
exact  = true
[[q7.b.reject]]
answer = "49/4"                    # (E[X])^2

# why: Var(X) = E[X^2] - E[X]^2; M07.0 checks sample variance against this kind of value.
[q7.c]
type   = "number"
expect = "35/12"
exact  = true
[[q7.c.reject]]
answer = "35/2"                    # sum of squared deviations, not divided by 6
[[q7.c.reject]]
answer = "7/2"                     # divided by n - 1 = 5 (the sample variance)

[q8.a]
type   = "expr"
expect = "p*(1 - p)"
vars   = { p = "real" }
domain = { p = [0.0, 1.0] }
[[q8.a.reject]]
answer = "p"                       # the mean
[[q8.a.reject]]
answer = "p^2"

# why: variances of independent sums add (L6.7 confidence intervals rest on it).
[q8.b]
type   = "expr"
expect = "n*p*(1 - p)"
vars   = { n = "positive", p = "real" }
domain = { n = [1.0, 50.0], p = [0.0, 1.0] }
[[q8.b.reject]]
answer = "n*p"                     # the mean
[[q8.b.reject]]
answer = "n^2*p*(1 - p)"           # variance of n times one trial

[q9]
type   = "expr"
expect = "1/p"
vars   = { p = "positive" }
domain = { p = [0.05, 1.0] }
[[q9.reject]]
answer = "(1 - p)/p"               # counts failures only

[q10.a]
type   = "number"
expect = "2"
exact  = true
[[q10.a.reject]]
answer = "3/2"                     # mean of the ids, ignoring q

# why: L8.1's sampler must agree bit for bit with Rust; the boundary case is the test.
[q10.b]
type   = "number"
expect = "2"
exact  = true
[[q10.b.reject]]
answer = "1"

[q10.c]
type   = "number"
expect = "2"
exact  = true
[[q10.c.reject]]
answer = "1"                       # used u <= c instead of u < c

[q11]
type   = "expr"
expect = "exp(-lam)"
vars   = { lam = "positive" }
domain = { lam = [0.1, 5.0] }
[[q11.reject]]
answer = "1 - exp(-lam)"           # P(X >= 1)

# ---- continuous random variables --------------------------------------------

[q12.a]
type   = "number"
expect = "1/2"
exact  = true
[[q12.a.reject]]
answer = "1"

[q12.b]
type   = "number"
expect = "1/12"
exact  = true
[[q12.b.reject]]
answer = "1/3"                     # E[U^2], forgot to subtract the squared mean

# why: inverse-CDF sampling turns PCG32 uniforms into any distribution (M07.1).
[q13.a]
type   = "expr"
expect = "-log(1 - u)/lam"
vars   = { u = "real", lam = "positive" }
domain = { u = [0.01, 0.99], lam = [0.1, 5.0] }
[[q13.a.reject]]
answer = "-lam*log(1 - u)"         # multiplied by the rate
[[q13.a.reject]]
answer = "exp(-lam*u)"             # the survival function

[q13.b]
type   = "expr"
expect = "1/lam"
vars   = { lam = "positive" }
domain = { lam = [0.1, 5.0] }
[[q13.b.reject]]
answer = "lam"

# why: normal_init(std) is std * Z; M07.3 propagates exactly this scaling.
[q14]
type   = "expr"
expect = "a^2"
vars   = { a = "real", b = "real" }
[[q14.reject]]
answer = "a^2 + b"                 # a shift does not change variance
[[q14.reject]]
answer = "a"

# why: these are M07.0's first normals for a hand-chosen pair; the spec order is cos first.
[q15.a]
type   = "number"
expect = "sqrt(3)"
exact  = true
[[q15.a.reject]]
answer = "1"                       # sin and cos swapped
[[q15.a.reject]]
answer = "sqrt(3)/2"               # forgot the radius r = 2

[q15.b]
type   = "number"
expect = "1"
exact  = true
[[q15.b.reject]]
answer = "sqrt(3)"

[q16]
type   = "number"
expect = "sqrt(2*pi)"
exact  = true
[[q16.reject]]
answer = "sqrt(pi)"                # the integral of exp(-x^2)
[[q16.reject]]
answer = "1"                       # the normalized density's integral
