# ---- momentum -------------------------------------------------------------------

# why: SGD with momentum (M10.2) and the 1/(1 - beta) effective step size.
[q10.a]
type   = "expr"
expect = "g/(1 - beta)"
vars   = { g = "real", beta = "real" }
domain = { g = [-3.0, 3.0], beta = [0.0, 0.95] }
[[q10.a.reject]]
answer = "g"
[[q10.a.reject]]
answer = "beta*g/(1 - beta)"       # summed from the second term only

[q10.b]
type   = "number"
expect = "10"
exact  = true
[[q10.b.reject]]
answer = "9"

[q11.a]
type   = "expr"
expect = "r^2 - (1 + beta - eta*h)*r + beta"
vars   = { r = "real", beta = "real", eta = "real", h = "real" }
[[q11.a.reject]]
answer = "r^2 - (1 - eta*h)*r"     # plain GD (beta = 0) with a spurious root at 0
[[q11.a.reject]]
answer = "r^2 - (1 + beta - eta*h)*r - beta"   # sign of the x_{t-1} term

[q11.b]
type   = "number"
expect = "9/10"
exact  = true
[[q11.b.reject]]
answer = "81/100"                  # beta itself, not sqrt(beta)

[q12]
type   = "number"
expect = "81/121"
exact  = true
[[q12.reject]]
answer = "9/11"                    # forgot the square
[[q12.reject]]
answer = "99/101"                  # kappa for sqrt(kappa), and no square

[q13]
type   = "number"
expect = "7/4"
exact  = true
[[q13.reject]]
answer = "3/2"                     # v_2
[[q13.reject]]
answer = "15/8"                    # v_4

# ---- Adam -----------------------------------------------------------------------

# why: the bias of m_t toward 0 that M10.3's bias correction removes.
[q14]
type   = "expr"
expect = "g*(1 - beta1^t)"
vars   = { g = "real", beta1 = "real", t = "natural" }
domain = { beta1 = [0.1, 0.99], t = [1.0, 20.0] }
[[q14.reject]]
answer = "g"                       # the bias-corrected value
[[q14.reject]]
answer = "g*beta1^t"

# why: Adam's first step is -eta * sign(g), whatever the gradient's size.
[q15]
type   = "number"
expect = "1/100"
exact  = true
[[q15.reject]]
answer = "-1/100"                  # sign of the update flipped
[[q15.reject]]
answer = "3/100"                   # used the raw gradient size

# why: decoupled decay multiplies theta by (1 - eta*lambda); M10.3 checks torch's AdamW trajectory.
[q16]
type   = "number"
expect = "89/100"
exact  = true
[[q16.reject]]
answer = "9/10"                    # forgot the decay
[[q16.reject]]
answer = "99/100"                  # forgot the Adam step

[q17]
type   = "proof"
rubric = [
  "Unrolls m_t = (1 - beta1) sum_{i=1}^{t} beta1^(t - i) g_i, by induction or by expanding",
  "Takes expectations using linearity, with E[g_i] = E[g]",
  "Sums the geometric series: (1 - beta1) sum_{k=0}^{t-1} beta1^k = 1 - beta1^t",
  "Concludes E[m_hat_t] = E[g]",
]
