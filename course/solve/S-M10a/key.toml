# ---- convexity and the condition number --------------------------------------

[q1.a]
type   = "bool"
expect = "true"
[[q1.a.reject]]
answer = "false"                   # f''(0) = 0 does not break convexity

[q1.b]
type   = "bool"
expect = "false"
[[q1.b.reject]]
answer = "true"                    # log is concave

# why: cross-entropy is LSE minus a linear term, so it is convex in the logits.
[q1.c]
type   = "bool"
expect = "true"
[[q1.c.reject]]
answer = "false"

# why: M10.1's property test checks the gap shrinks like (1 - 1/kappa)^t on such quadratics.
