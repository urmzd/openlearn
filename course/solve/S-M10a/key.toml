[q4]
type   = "proof"
rubric = [
  "States the definition: f(t x + (1 - t) y) <= t f(x) + (1 - t) f(y) for all x, y and t in [0, 1]",
  "Applies it to f and to g at the same x, y, t and adds the two inequalities",
  "Concludes the definition holds for f + g",
]

# ---- gradient descent rates and step size -------------------------------------

# why: eta < 2/L is the stability limit C1's diagnostics compare against (lr vs 2/lambda_max).
[q5.a]
type   = "interval"
expect = "(0, 1/5)"
[[q5.a.reject]]
answer = "(0, 1/10)"               # eta < 1/L, sufficient but not the whole set
[[q5.a.reject]]
answer = "(0, 1/5]"                # eta = 2/L oscillates forever

[q5.b]
type   = "number"
expect = "2/11"
exact  = true
[[q5.b.reject]]
answer = "1/10"                    # 1/L

[q5.c]
type   = "number"
expect = "9/11"
exact  = true
[[q5.c.reject]]
answer = "9/10"                    # the rate at eta = 1/L

[q5.d]
