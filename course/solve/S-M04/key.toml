[q34]
type   = "proof"
rubric = [
  "Writes D_u f = grad f . u for a unit vector u, from the chain rule applied to t -> f(x + t u)",
  "Bounds grad f . u <= |grad f| |u| = |grad f| by the Cauchy-Schwarz inequality",
  "Shows u = grad f / |grad f| attains the bound (and is a unit vector because grad f != 0)",
  "Concludes the maximizing direction and the maximum value |grad f|",
]

