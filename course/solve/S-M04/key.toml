[q58]
type   = "proof"
rubric = [
  "Writes the Lagrangian -sum p_i ln p_i - alpha (sum p_i - 1) - beta (sum p_i E_i - U) with both multipliers named",
  "Sets the partial derivative in p_i to zero: -ln p_i - 1 - alpha - beta E_i = 0, so p_i = exp(-1 - alpha) exp(-beta E_i)",
  "Uses sum p_i = 1 to fix the constant: exp(-1 - alpha) = 1 / sum_j exp(-beta E_j)",
  "Concludes p_i = exp(-beta E_i) / sum_j exp(-beta E_j), a softmax of -beta E, with beta set by the energy constraint",
]
