# S-M07d answer key (hidden; honor system, DESIGN D34). `ol verify course S-M07d`
# check 7 proves every `expect` passes and every `reject` canary fails;
# course/oracle/solve/S-M07d.py recomputes every value independently.

# ---- hypothesis tests ---------------------------------------------------------

# why: 8 sign patterns of d = (2, 1, 3); only +++ and --- reach |sum| = 6.
[q1]
type   = "number"
expect = "1/4"
exact  = true
[[q1.reject]]
answer = "1/8"                     # one-sided: only +++
[[q1.reject]]
answer = "1/3"                     # the add-one Monte Carlo estimate, not the exact p

# why: 6 splits of {1, 2, 3, 5} into pairs; |mean diff| >= 2.5 for {3,5} and {1,2}.
[q2]
type   = "number"
expect = "1/3"
exact  = true
[[q2.reject]]
answer = "1/6"                     # one-sided
[[q2.reject]]
answer = "1/4"

# why: n = 12, k = 2: 2 (1 + 12 + 66) / 4096 = 79/2048.
[q3]
type   = "number"
expect = "79/2048"
exact  = true
[[q3.reject]]
answer = "79/4096"                 # the tail not doubled
[[q3.reject]]
answer = "2*(1 + 12)/4096"         # tail stops at k - 1

# why: sorted 0.002 <= 0.01, 0.012 <= 0.0125, 0.03 > 0.05/3: stop.
[q4]
type   = "set"
expect = "{2, 4}"
[[q4.reject]]
answer = "{2}"                     # Bonferroni at 0.01
[[q4.reject]]
answer = "{1, 2, 3, 4}"            # no correction
[[q4.reject]]
answer = "{2, 3, 4}"               # step-down that does not stop

# ---- regression ---------------------------------------------------------------

# why: Sxy = 11, Sxx = 5, slope 11/5; intercept 4 - (11/5)(3/2) = 7/10.
[q5.a]
type   = "number"
expect = "11/5"
exact  = true
[[q5.a.reject]]
answer = "26/11"                   # Syy / Sxy upside down regression
[[q5.a.reject]]
answer = "7/3"                     # slope through the two end points

[q5.b]
type   = "number"
expect = "7/10"
exact  = true
[[q5.b.reject]]
answer = "1"                       # the first y value
[[q5.b.reject]]
answer = "4"                       # the mean of y

# why: logit grows by 0.5 * 2 = 1, so the odds multiply by e.
[q6]
type   = "number"
expect = "E"
exact  = true
[[q6.reject]]
answer = "exp(1/2)"                # one unit, not two
[[q6.reject]]
answer = "1"                       # the change in log-odds, not the odds factor

# why: dl/dz = sigmoid(z) - y, and dz/dw = x.
[q7]
type   = "expr"
expect = "(1/(1 + exp(-w*x)) - y)*x"
vars   = { w = "real", x = "real", y = "real" }
domain = { w = [-2.0, 2.0], x = [-2.0, 2.0], y = [0.0, 1.0] }
[[q7.reject]]
answer = "(y - 1/(1 + exp(-w*x)))*x"   # the likelihood's gradient: wrong sign
[[q7.reject]]
answer = "1/(1 + exp(-w*x)) - y"       # chain rule missing x

# why: 3 + 2 + 1.5 = 6.5 of 9 pairs; the tie counts one half.
[q8]
type   = "number"
expect = "13/18"
exact  = true
[[q8.reject]]
answer = "2/3"                     # tie counted as a loss
[[q8.reject]]
answer = "7/9"                     # tie counted as a win

[q9]
type   = "proof"
rubric = [
  "Writes the loss as a sum over examples and derives the gradient X^T (p - y) + l2 w and the Hessian X^T S X + l2 I, with S = diag(p_i (1 - p_i))",
  "Shows v^T H v = sum_i p_i (1 - p_i) (x_i . v)^2 + l2 |v|^2 >= 0 for every v, using 0 < p_i < 1",
  "Concludes the loss is convex (strictly when l2 > 0), so a point with zero gradient is the global minimum and Newton's linear system has a unique solution",
  "Every symbol is defined before use",
]

# ---- queueing and Little's law ------------------------------------------------

# why: L = lambda W = 40 * 0.25.
[q10]
type   = "number"
expect = "10"
exact  = true
[[q10.reject]]
answer = "160"                     # lambda / W
[[q10.reject]]
answer = "1/160"

[q11.a]
type   = "number"
expect = "4/5"
exact  = true
[[q11.a.reject]]
answer = "5/4"                     # mu / lambda

# why: L = rho / (1 - rho) = (4/5) / (1/5).
[q11.b]
type   = "number"
expect = "4"
exact  = true
[[q11.b.reject]]
answer = "4/5"                     # the utilization, not the number in system
[[q11.b.reject]]
answer = "16/5"                    # rho^2 / (1 - rho), the queue without the one in service

# why: W = L / lambda = 4 / 8, or 1 / (mu - lambda).
[q11.c]
type   = "number"
expect = "1/2"
exact  = true
[[q11.c.reject]]
answer = "1/10"                    # the service time alone
[[q11.c.reject]]
answer = "2/5"                     # the waiting time in queue only

[q12]
type   = "expr"
expect = "1/(mu - lam)"
vars   = { mu = "positive", lam = "positive" }
domain = { mu = [2.0, 4.0], lam = [0.1, 1.5] }
[[q12.reject]]
answer = "1/mu"                    # no queueing at all
[[q12.reject]]
answer = "lam/(mu - lam)"          # L, not W

# why: W = 1 / (mu (1 - rho)): (1 - 0.5) / (1 - 0.9) = 5.
[q13]
type   = "number"
expect = "5"
exact  = true
[[q13.reject]]
answer = "9/5"                     # the ratio of the utilizations
[[q13.reject]]
answer = "9"                       # the ratio of rho / (1 - rho) values

# ---- balls into bins ----------------------------------------------------------

# why: each bin is empty with probability (1 - 1/n)^n; add over n bins.
[q14]
type   = "expr"
expect = "n*(1 - 1/n)^n"
vars   = { n = "positive" }
domain = { n = [2.0, 50.0] }
[[q14.reject]]
answer = "(1 - 1/n)^n"             # one bin, not the expected count
[[q14.reject]]
answer = "n*exp(-1)"               # the limit, not the exact value

[q15]
type   = "number"
expect = "exp(-1)"
exact  = true
[[q15.reject]]
answer = "0"
[[q15.reject]]
answer = "1 - exp(-1)"             # the occupied fraction

# why: C(m, 2) pairs, each colliding with probability 1/n.
[q16]
type   = "expr"
expect = "m*(m - 1)/(2*n)"
vars   = { m = "positive", n = "positive" }
domain = { m = [2.0, 40.0], n = [2.0, 400.0] }
[[q16.reject]]
answer = "m^2/n"                   # ordered pairs counted twice, plus self-pairs
[[q16.reject]]
answer = "m/n"                     # the load, not the collisions

[q17]
type   = "choice"
expect = "b"
[[q17.reject]]
answer = "a"                       # one random choice
[[q17.reject]]
answer = "d"
