id        = "ag.09"
title     = "Eval runner"
kind      = "build"
lang      = ["go"]
pass      = 10
chapter   = "content/tracks/ai-platform-engineering/09-llm-evaluation/09-eval-runner.md"
# Suites are formats/eval-case.schema.json and reports
# formats/eval-result.schema.json (rows and summary), linked from the card;
# the Go API of go/agent/eval is fixed by the chapter's section 4 and the
# course tests (K01; DEVIATIONS B122-01).
contract  = []
# ag.01: Provider, the deltas, Accumulator (ProviderSubject); ag.02: the
# course tests build an agent's tool registry; ag.03: the loop
# (AgentSubject); ag.05: durable runs (DurableSubject); load.01: the Go
# PCG32 behind the bootstrap.
deps      = ["ag.01", "ag.02", "ag.03", "ag.05", "load.01"]
# M07.4 (bootstrap CIs) is re-implemented in Go, never called.
reading   = ["M07.4", "content/tracks/ai-platform-engineering/09-llm-evaluation"]
used_by   = ["ag.10", "ag.11", "ag.12", "craft.23"]
units     = [
  "go/agent/eval/eval.go",
  "go/agent/eval/stats.go",
  "go/agent/eval/report.go",
  "go/agent/eval/subject.go",
]
upgrades  = []
milestone = "MS-agent"
ci        = "pr"

[tests]
dir       = "course/tests/go/ag_09/"
smoke     = ["TestHandExample", "TestScorerFailuresExcluded", "TestBootstrapMatchesOracle", "TestReportSchema"]
timeout_s = 120
determinism_runs = 2

[fixtures]
files = ["course/fixtures/ag.09/bootstrap.json", "course/fixtures/ag.09/suite.jsonl"]
