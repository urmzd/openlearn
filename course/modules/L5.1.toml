id        = "L5.1"
title     = "Scaled dot-product attention (forward and backward)"
kind      = "build"
lang      = ["python"]
pass      = 5
chapter   = "ml/08-tinyllm/p05-transformer-2017/01-scaled-dot-product-attention.md"
contract  = ["contracts/py/tinyllm/xfmr/sdpa.pyi"]
# sdpa.py: the stable softmax of M09.2 (a fully masked row is zeros) and one
# autograd node through L0.1's from_op. The course tests build masks as
# plain bool arrays, so L5.2 is not needed.
deps      = ["L0.1", "M09.2"]
# Concepts: Luong's dot score (L4.3), the softmax VJP derived in S-M08 and
# coded in M08.3, dropout's draw rule (L0.2's F.dropout).
reading   = ["L4.3", "S-M08", "M08.3", "L0.2"]
# L5.3's MultiHeadAttention calls scaled_dot_product_attention once per
# layer. The other catalog call sites (L7.5, L7.6, L8.2, L9.3 oracle) join
# when their rows list L5.1 in deps (DEVIATIONS B71-02).
used_by   = ["L5.3", "L13.3"]
units     = ["python/tinyllm/xfmr/sdpa.py"]
upgrades  = []
milestone = "MS-L5"
ci        = "pr"

[tests]
dir       = "course/tests/L5.1"
