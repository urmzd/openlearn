id        = "L1.2"
title     = "Byte-level BPE (GPT-2 compatible): pre-tokenizer, trainer, HF loader"
kind      = "build"
lang      = ["python"]
pass      = 3
chapter   = "content/courses/build-an-llm/p01-tokenizers/02-byte-level-bpe.md"
contract  = ["contracts/py/tinyllm/tok/bpe.pyi", "contracts/py/tinyllm/tok/pretok.pyi"]
# check_ids (L1.1), the byte map (M05.2), and the trie that splits out added
# tokens (M06.2) are called by bpe.py.
deps      = ["L1.1", "M05.2", "M06.2"]
reading   = ["M06.3"]                 # the course tests draw random text from the frozen PCG32
# L1.5 (the Rust port) is proven against this module's ids; L1.6's course
# tests load GPT-2 and SmolLM2 through from_hf_json to measure them. L7.9,
# L8.2, and C1 join used_by with their batches: the mirror rule only accepts
# call sites in the registry (DEVIATIONS L1-02).
used_by   = ["L1.5", "L1.6", "L8.2", "data.07", "L14.4"]
units     = ["python/tinyllm/tok/bpe.py", "python/tinyllm/tok/pretok.py"]
upgrades  = []
milestone = "MS-L1"
ci        = "pr"

[tests]
dir       = "course/tests/L1.2"
smoke     = ["test_hand_example_training", "test_hand_example_encode", "test_gpt2_ids_match_oracle"]
timeout_s = 60
determinism_runs = 2

[fixtures]
files = [
  "course/fixtures/L1.2/train.txt",
  "course/fixtures/L1.2/train_merges.json",
  "course/fixtures/tok-gpt2/tokenizer.json",
  "course/fixtures/tok-gpt2/cases.jsonl",
  "course/fixtures/tok-smollm2/tokenizer.json",
  "course/fixtures/tok-smollm2/cases.jsonl",
]

[bench]                               # the catalog's "1 MB train budget" (DEVIATIONS L1-05)
lang   = "python"
name   = "train_1mb"                  # course/tests/L1.2/bench/train_1mb.py
metric = "mb_per_s"
budget = ">= 0.1"                     # reference about 3 MB/s; recounting every pair per merge is about 0.005

[learner_tests]
rung      = 2
path      = "python/tests/l1-2-bpe"
threshold = 0.60
required_mutants = []
time_budget_s = 30
