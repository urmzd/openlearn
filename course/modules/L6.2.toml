id        = "L6.2"
title     = "BERT encoder and MLM masking"
kind      = "build"
lang      = ["python"]
pass      = 5
chapter   = "content/courses/build-an-llm/p06-objectives/02-bert-masked-lm.md"
contract  = ["contracts/py/tinyllm/obj/bert.pyi"]
# bert.py: L5.3's attention, L5.4's LearnedPE, L1.3's WordPieceTokenizer
# (mlm_batch), M07.1's sample_categorical (the 80/10/10 action), M06.3's
# PCG32; L0.4's layers, L0.2's ops (exact GELU), L0.1's Tensor, L0.3's
# cross_entropy, L0.6's safetensors (model directory), M07.3's normal_init.
deps      = ["L5.3", "L5.4", "L1.3", "M07.1", "M06.3", "L0.1", "L0.2", "L0.3", "L0.4", "L0.6", "M07.3"]
reading   = ["L5.5"]   # the post-LN encoder BERT keeps
# L6.3's ELECTRA (generator and discriminator), L6.5's classification heads,
# and the L6.7 zoo (tl_arch "bert").
used_by   = ["L6.3", "L6.5", "L6.7"]
units     = ["python/tinyllm/obj/bert.py"]
upgrades  = []
milestone = "MS-L6"
ci        = "pr"

[tests]
dir       = "course/tests/L6.2"
smoke     = ["test_hand_example_mlm_mask", "test_mask_follows_the_op_order", "test_golden_hf_bert"]
timeout_s = 60
determinism_runs = 2

[fixtures]
files = ["course/fixtures/L6.2/bert_tiny_hf.npz"]

[learner_tests]
rung      = 5
path      = "python/tests/l6-2-bert"
