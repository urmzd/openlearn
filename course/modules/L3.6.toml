id        = "L3.6"
title     = "RNN language model with stateful TBPTT"
kind      = "build"
lang      = ["python"]
pass      = 4
chapter   = "content/courses/build-an-llm/p03-recurrent/06-rnn-language-model-stateful-tbptt.md"
contract  = ["contracts/py/tinyllm/rnn/rnnlm.pyi"]
# rnnlm.py: L3.1's rnn_forward and rnn_backward (the fused Elman op), L3.2's
# LSTM, L3.3's GRU, L0.5's train_step (which clips with M10.4), L0.3's
# cross_entropy, L0.4's Embedding and Linear, L0.2's ops on L0.1's Tensor,
# L0.6's safetensors I/O, M07.3's xavier_uniform and M03.3's orthogonal_init
# for the Elman weights, M06.3's PCG32. The course tests encode the corpus
# with L1.1's CharTokenizer and train with M10.3's AdamW.
deps      = ["L0.1", "L0.2", "L0.3", "L0.4", "L0.5", "L0.6", "M03.3", "M06.3", "M07.3", "M10.3", "L1.1", "L3.1", "L3.2", "L3.3"]
reading   = ["M10.4", "M11.2"]   # clipping runs inside train_step; bits per character
# Call site (DESIGN 4.3): the L6.7 zoo's rnnlm bpb rows. Not registered yet,
# so verify check 9 fails until L6.7 (B7) lists L3.6 in deps (B62-03).
used_by   = ["L6.7"]
units     = ["python/tinyllm/rnn/rnnlm.py"]
upgrades  = []
milestone = "MS-L3"
ci        = "pr"

[tests]
dir       = "course/tests/L3.6"
smoke     = ["test_hand_example_windows", "test_state_carries_across_calls"]
timeout_s = 120
determinism_runs = 2

[fixtures]
files = ["course/fixtures/L3.6/corpus.txt"]

[learner_tests]
rung      = 4
path      = "python/tests/l3-6-rnnlm"
threshold = 0.80
required_mutants = ["s01", "s05", "s06", "s07", "s08"]
time_budget_s = 60
