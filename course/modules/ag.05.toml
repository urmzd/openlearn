id        = "ag.05"
title     = "Durable agent runs (AgentRun)"
kind      = "build"
lang      = ["go"]
pass      = 10
chapter   = "content/tracks/ai-platform-engineering/13-agent-sdk/05-durable-agent-runs.md"
# The Go API of go/agent/durableagent is fixed by the chapter's section 4 and
# the course tests (K01; B121-01).
contract  = []
# ag.01: the StepRunner seam and step names; ag.02: tool.Result (a reconciled
# write's recorded result); ag.03: the loop it runs; ag.04: the gate, whose
# IsWrite tells the journal which unrecorded steps are writes.
deps      = ["ag.01", "ag.02", "ag.03", "ag.04"]
# The catalog prereqs dur.06 (replay) and dur.08 (signals) were not
# registered when this module was built: the run is its own event-sourced
# journal with signals as records, and running AgentRun as a workflow on the
# durable engine is a follow-up (DEVIATIONS B121-04). The durable chapter
# home is the reading.
reading   = ["content/tracks/ai-platform-engineering/05-durable-orchestration-and-workers", "content/tracks/ai-platform-engineering/13-agent-sdk"]
# ag.09's DurableSubject runs suite subjects as durable runs; dep.07 (the
# agent worker) joins with its batch.
used_by   = ["ag.09", "dep.07"]
units     = ["go/agent/durableagent/journal.go", "go/agent/durableagent/run.go"]
upgrades  = []
milestone = "MS-agent"
ci        = "pr"

[tests]
dir       = "course/tests/go/ag_05/"
smoke     = ["TestHandExample", "TestIndeterminateWrite", "TestFileStoreTornTail"]
timeout_s = 120
determinism_runs = 2
