id        = "L2.2"
title     = "Bengio's neural probabilistic language model"
kind      = "build"
lang      = ["python"]
pass      = 3
chapter   = "content/courses/build-an-llm/p02-statistical-lm/02-bengio-nplm.md"
contract  = ["contracts/py/tinyllm/lm/nplm.pyi"]
# Every dep is a call in nplm.py (DEVIATIONS B54-03): L0.1 Tensor and
# no_grad, L0.2 F.reshape and F.tanh, L0.3 cross_entropy, L0.4 Module,
# Embedding, Linear, L0.5 DataLoader and train_step, L0.6 save_safetensors and
# load_safetensors (and the course tests read MS-L2/*.bin with open_tokens),
# M10.2 SGD, M11.2 NLLAccumulator for perplexity, M06.3 PCG32 for the default
# init stream and for sampling.
deps      = ["L0.1", "L0.2", "L0.3", "L0.4", "L0.5", "L0.6", "M10.2", "M11.2", "M06.3"]
reading   = ["L2.1", "L0.0"]
# Call site (DESIGN 4.3, D36): the L6.7 zoo loads the NPLM directory and
# reports its bits per byte. L6.7 (B7) is not registered yet, so verify
# check 9 fails until its row lists L2.2 in deps (DEVIATIONS B54-02).
used_by   = ["L6.7"]
units     = ["python/tinyllm/lm/nplm.py"]
upgrades  = []
milestone = "MS-L2"
ci        = "pr"

[tests]
dir       = "course/tests/L2.2"
smoke     = ["test_windows_hand_example", "test_hand_example_forward", "test_state_dict_names_and_shapes"]
timeout_s = 60
determinism_runs = 2

[fixtures]
files = ["course/fixtures/L2.2/nplm_torch.npz", "course/fixtures/MS-L2/train.bin", "course/fixtures/MS-L2/val.bin"]

[learner_tests]
rung      = 3
path      = "python/tests/l2-2-nplm"
threshold = 0.70
required_mutants = ["s01"]
time_budget_s = 30
