id        = "L1.1"
title     = "Tokenizer protocol, char tokenizer"
kind      = "build"
lang      = ["python"]
pass      = 3
chapter   = "content/courses/build-an-llm/p01-tokenizers/01-tokenizer-protocol-and-char.md"
contract  = ["contracts/py/tinyllm/tok/base.pyi", "contracts/py/tinyllm/tok/char.pyi"]
deps      = ["M05.2"]                 # ByteTokenizer's token strings are the GPT-2 byte map
reading   = ["L0.0"]                  # the tracer's byte ids (D32), which ByteTokenizer formalizes
# L3.6 (char-level LMs) joins used_by with its batch: the mirror rule only
# accepts call sites already in the registry (DEVIATIONS L1-02).
used_by   = ["L1.2", "L1.3", "L1.4", "L1.6", "L3.6"]
units     = ["python/tinyllm/tok/base.py", "python/tinyllm/tok/char.py"]
upgrades  = []
milestone = "MS-L1"
ci        = "pr"

[tests]
dir       = "course/tests/L1.1"
smoke     = ["test_hand_example_vocab", "test_hand_example_encode_decode", "test_hand_example_bytes"]
timeout_s = 60
determinism_runs = 2

[learner_tests]
rung      = 2
path      = "python/tests/l1-1-tokenizers"
threshold = 0.60
required_mutants = []
time_budget_s = 30
