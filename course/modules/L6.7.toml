id        = "L6.7"
title     = "LM evaluation harness and the model zoo"
kind      = "build"
lang      = ["python"]
pass      = 5
chapter   = "content/courses/build-an-llm/p06-objectives/07-lm-evaluation-harness-and-the-model-zoo.md"
contract  = ["contracts/py/tinyllm/eval/lm.pyi", "contracts/py/tinyllm/eval/zoo.pyi"]
# lm.py: M11.2's NLLAccumulator, M07.4's mean_ci and bootstrap_ci, M07.5's
# paired_permutation_test, L0.1's Tensor and no_grad, M06.3's PCG32.
# zoo.py loads every family through its own module (D36): L0.5's BigramLM
# (with L0.6's safetensors and token files), L2.1's NGramLM, L2.2's
# load_nplm, L3.6's load_rnnlm, L6.1's load_gpt, L4.1's load_seq2seq with
# L4.4's beam_search, L5.5's load_transformer and translate, L6.2's load_bert
# and mlm_mask, L6.3's load_electra and rtd_accuracy, L6.5's load_classifier
# and predict, L2.3's word_similarity; L4.5's exact_match scores EM rows and
# M07.4's wilson_interval and normal_ppf give their intervals. The course
# tests build each family's checkpoint with its own constructor and saver
# (L6.1's load_hf_gpt2 loads the golden GPT-2).
deps      = ["L0.1", "L0.5", "L0.6", "M06.3", "M07.4", "M07.5", "M11.2", "L2.1", "L2.2", "L2.3", "L3.6", "L4.1", "L4.4", "L4.5", "L5.5", "L6.1", "L6.2", "L6.3", "L6.5"]
reading   = ["M00.1"]
# L8.5's quant_ppl reads a scheme's perplexity cost with eval_ppl. Other
# catalog call sites: L7.9 parity, C1, dur.11 EvalSuite (execs
# `{tinyllm} eval --suite zoo`), L12.1.
used_by   = ["L8.5"]
units     = ["python/tinyllm/eval/lm.py", "python/tinyllm/eval/zoo.py"]
upgrades  = []
milestone = "MS-L6"
ci        = "pr"

[tests]
dir       = "course/tests/L6.7"
smoke     = ["test_hand_example_strided_windows", "test_hand_example_uniform_bigram_is_eight_bits"]
timeout_s = 60
determinism_runs = 2

[fixtures]
files = ["course/fixtures/L6.7/strided_ppl_hf.npz"]

[learner_tests]
rung      = 5
path      = "python/tests/l6-7-eval"
threshold = 0.80
required_mutants = ["s01", "s02", "s03", "s04", "s05", "s06", "s08", "s10"]
time_budget_s = 30
