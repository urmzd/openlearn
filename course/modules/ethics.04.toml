id        = "ethics.04"
title     = "Bias and safety evals"
kind      = "build"
lang      = ["python"]
pass      = 9
chapter   = "content/tracks/responsible-ai/04-bias-and-safety-evals/01-bias-and-safety-evals.md"
contract  = ["contracts/py/tinyllm/eval/safety.pyi", "contracts/py/tinyllm/eval/bias.pyi"]
# safety.py: M07.4's wilson_interval, M07.7's roc_curve and roc_auc.
# bias.py: M07.4's bootstrap_ci and wilson_interval.
deps      = ["M07.4", "M07.7", "M06.3"]
# M01.4's trapezoid is inside M07.7's roc_auc (and the reason average
# precision is a step sum instead); L6.7's log_probs is the score function the
# CLI passes; M07.5's paired tests are the other way to read a paired gap.
reading   = ["M01.4", "L6.7", "M07.5"]
# C1's release spec runs the safety suite and includes its rows in the
# release report. dur.12 reads that safety JSON through EvalSuite.
used_by   = ["C1"]
units     = ["python/tinyllm/eval/safety.py", "python/tinyllm/eval/bias.py"]
upgrades  = []
milestone = "MS-C1"
ci        = "pr"

[tests]
dir       = "course/tests/ethics.04"
smoke     = ["test_hand_example_toxicity", "test_hand_example_refusal_rate", "test_hand_example_bias_gap"]
timeout_s = 60
determinism_runs = 2

[fixtures]
files = [
  "course/fixtures/ethics.04/lexicon.json",
  "course/fixtures/ethics.04/labelled.jsonl",
  "course/fixtures/ethics.04/prompts.jsonl",
  "course/fixtures/ethics.04/bias.json",
]

[learner_tests]
rung      = 5
path      = "python/tests/ethics-04-evals"
threshold = 0.80
required_mutants = ["s01", "s02", "s03", "s04", "s05", "s06", "s07", "s08", "s09", "s10", "s11", "s12", "s13", "s14", "s15", "s16"]
time_budget_s = 30
