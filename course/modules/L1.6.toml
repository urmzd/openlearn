id        = "L1.6"
title     = "Tokenizer metrics"
kind      = "build"
lang      = ["python"]
pass      = 3
chapter   = "content/courses/build-an-llm/p01-tokenizers/06-tokenizer-metrics.md"
contract  = ["contracts/py/tinyllm/tok/metrics.pyi"]
# metrics.py is written against the L1.1 protocol. The course tests measure
# the real tokenizers of L1.2 (GPT-2, SmolLM2), L1.3 (BERT), and L1.4 (a
# Unigram), and turn bytes_per_token into bits per byte with M11.2's
# NLLAccumulator.
deps      = ["L1.1", "L1.2", "L1.3", "L1.4", "M11.2"]
reading   = ["M00.1"]
# C1 (vocab ADR and tokenizer ablation) and data.07 (manifest stats) are the
# catalog call sites; they join used_by with B5 and B11: the mirror rule only
# accepts call sites in the registry (DEVIATIONS L1-02).
used_by   = ["data.07"]
units     = ["python/tinyllm/tok/metrics.py"]
upgrades  = []
milestone = "MS-L1"
ci        = "pr"

[tests]
dir       = "course/tests/L1.6"
smoke     = ["test_hand_example_metrics", "test_golden_metrics"]
timeout_s = 60
determinism_runs = 2

[fixtures]
files = [
  "course/fixtures/L1.6/metrics.json",
  "course/fixtures/tok-gpt2/tokenizer.json",
  "course/fixtures/tok-gpt2/cases.jsonl",
  "course/fixtures/tok-smollm2/tokenizer.json",
  "course/fixtures/tok-bert/tokenizer.json",
  "course/fixtures/L1.4/hf-unigram/tokenizer.json",
]

[learner_tests]
rung      = 2
path      = "python/tests/l1-6-metrics"
threshold = 0.60
required_mutants = []
time_budget_s = 30
