id        = "ds.01"
title     = "Growable array tl_vec (type-erased, optional C)"
kind      = "side"
lang      = ["c"]
pass      = 6
chapter   = "algorithms/16-systems-data-structures/01-growable-array.md"
# tinyllm/ds.h covers ds.01 to ds.03 and has no `chapter:` back-pointer for
# this module yet, so the registry lists no contract file; the chapter card
# links the header (as M06.3 with numerics.h; DEVIATIONS B81-02).
contract  = ["contracts/c/include/tinyllm/ds.h"]
# vec.c allocates through the shared C support helpers and reports through
# error slot; the course tests install the counting allocator through
# tl_set_allocator.
deps      = ["rt.02"]
reading   = ["lang.03"]   # the C primer: pointers, sizeof, memcpy
# Call site: rt.04 (per-sequence block tables). ds.02 and ds.04 read this
# chapter.
used_by   = ["rt.04"]
units     = ["c/src/ds/vec.c"]
upgrades  = []
milestone = "MS-L9"
ci        = "pr"

[tests]
dir       = "course/tests/ds.01"
smoke     = ["hand_example", "alloc_failure_leaves_vec_unchanged"]
timeout_s = 60
determinism_runs = 2

[learner_tests]                     # rung R4: properties with ol_prop.h
rung      = 4
path      = "c/tests/ds01_vec_test.c"
threshold = 0.80
required_mutants = ["s01", "s02", "s03", "s04", "s05", "s06", "s07", "s08", "s09", "s10", "s11", "s12", "s13"]
time_budget_s = 60
