id        = "L3.2"
title     = "LSTM (torch gate order)"
kind      = "build"
lang      = ["python"]
pass      = 4
chapter   = "content/courses/build-an-llm/p03-recurrent/02-lstm.md"
contract  = ["contracts/py/tinyllm/rnn/lstm.pyi"]
# L0.1 Tensor parameters; L0.2 the ops the cell is written in; L0.4 Module,
# load_state_dict, and Dropout; M07.3 xavier_uniform and M03.3
# orthogonal_init draw the weights; M06.3 the default PCG32 init stream.
deps      = ["L0.1", "L0.2", "L0.4", "M07.3", "M03.3", "M06.3"]
# M01.3: sigmoid and tanh and their derivatives (the ops call them through
# L0.2); L3.1: BPTT, which autograd now does for you.
reading   = ["M01.3", "L3.1", "craft.03"]
# L3.4 runs two LSTMs as one bidirectional layer; L3.6 (cell='lstm'); L4.1
# (the LSTMCell decoder option). L3.5 (ELMo, a side module) also builds on it.
used_by   = ["L3.4", "L3.6", "L4.1"]
units     = ["python/tinyllm/rnn/lstm.py"]
upgrades  = []
milestone = "MS-L3"
ci        = "pr"

[tests]
dir       = "course/tests/L3.2"
smoke     = ["test_hand_example_lstm_cell", "test_state_dict_names_match_torch"]
timeout_s = 60
determinism_runs = 2

[fixtures]
files = ["course/fixtures/L3.2/lstm_torch.npz"]

[learner_tests]
rung      = 3
path      = "python/tests/l3-2-lstm"
