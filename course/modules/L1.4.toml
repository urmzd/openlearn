id        = "L1.4"
title     = "Unigram LM tokenizer (EM, Viterbi, subword sampling)"
kind      = "build"
lang      = ["python"]
pass      = 3
chapter   = "content/courses/build-an-llm/p01-tokenizers/04-unigram-lm.md"
contract  = ["contracts/py/tinyllm/tok/unigram.pyi"]
# check_ids (L1.1), Trie.prefixes for the lattice (M06.2), and mle to score
# the seed pieces (M07.2) are called by unigram.py.
deps      = ["L1.1", "M06.2", "M07.2"]
# M11.1 (cross-entropy: EM raises the log-likelihood) is the concept; the
# PCG32 that sample_encode draws from is M06.3's contract, and the course
# tests pass the frozen one (D35). S-M07b q8 and q9 are one EM step and the
# count MLE by hand. None of them is called by unigram.py.
reading   = ["M11.1", "M06.3", "S-M07b"]
# L1.6's course tests load the Unigram fixture through from_hf_json to measure
# it. C1 (the BPE vs Unigram ablation) joins used_by with B11 (DEVIATIONS L1-02).
used_by   = ["L1.6"]
units     = ["python/tinyllm/tok/unigram.py"]
upgrades  = []
milestone = "MS-L1"
ci        = "pr"

[tests]
dir       = "course/tests/L1.4"
smoke     = ["test_hand_example_viterbi", "test_hand_example_em_step", "test_hf_unigram_ids_match_oracle"]
timeout_s = 60
determinism_runs = 2

[fixtures]
files = [
  "course/fixtures/L1.2/train.txt",
  "course/fixtures/L1.4/hf-unigram/tokenizer.json",
  "course/fixtures/L1.4/hf-unigram/cases.jsonl",
  "course/fixtures/L1.4/spm-unigram/tokenizer.json",
  "course/fixtures/L1.4/spm-unigram/cases.jsonl",
]

[learner_tests]
rung      = 2
path      = "python/tests/l1-4-unigram"
threshold = 0.60
required_mutants = []
time_budget_s = 30
