id        = "L6.3"
title     = "ELECTRA replaced-token detection"
kind      = "build"
lang      = ["python"]
pass      = 5
chapter   = "content/courses/build-an-llm/p06-objectives/03-electra-replaced-token-detection.md"
contract  = ["contracts/py/tinyllm/obj/electra.pyi"]
# electra.py: L6.2's mlm_mask, BertEncoder (the discriminator's body),
# BertForMLM (the generator), and INIT_STD; M07.1's sample_categorical (the
# replacement draw); L0.3's bce_with_logits; L0.4's Linear and Module; L0.2's
# ops and L0.1's Tensor and no_grad; M07.3's normal_init (the head's init);
# M06.3's PCG32 (the default init stream); L0.6's safetensors I/O (the model
# directory the zoo loads).
deps      = ["L0.1", "L0.2", "L0.3", "L0.4", "L0.6", "M06.3", "M07.1", "M07.3", "L6.2"]
reading   = []
# The L6.7 zoo loads ELECTRA directories (load_electra) and reports
# replaced-token detection accuracy (rtd_accuracy). The discriminator's body
# as a classification backbone is L6.5's (tl_arch "electra" classifiers).
used_by   = ["L6.7"]
units     = ["python/tinyllm/obj/electra.py"]
upgrades  = []
milestone = "MS-L6"
ci        = "pr"

[tests]
dir       = "course/tests/L6.3"
smoke     = ["test_hand_example_replaced_token_labels", "test_discriminator_matches_hf"]
timeout_s = 60
determinism_runs = 2

[fixtures]
files = ["course/fixtures/L6.3/electra_hf.npz"]

[learner_tests]
rung      = 5
path      = "python/tests/l6-3-electra"
threshold = 0.80
required_mutants = ["s01", "s02", "s03", "s04", "s05", "s06", "s07"]
time_budget_s = 30
