id        = "L2.3"
title     = "word2vec skip-gram with negative sampling, and the PPMI-SVD baseline"
kind      = "build"
lang      = ["python"]
pass      = 3
chapter   = "content/courses/build-an-llm/p02-statistical-lm/03-word2vec-and-ppmi-svd.md"
contract  = ["contracts/py/tinyllm/lm/word2vec.pyi"]
# Every dep is a call in word2vec.py (DEVIATIONS B54-03): M07.1 AliasTable
# (the negative sampler), M03.5 svd, M03.6 normalize, cosine_sim, and
# topk_cosine, M11.4 ppmi, M06.3 PCG32 for the default stream.
deps      = ["M07.1", "M03.5", "M03.6", "M11.4", "M06.3"]
reading   = ["L2.2", "S-M11b", "S-M03b"]
# Call sites (DESIGN 4.3, D36): the L6.7 zoo's word-similarity task and
# embedding utilities, and L3.6's optional embedding init. Neither is
# registered yet, so verify check 9 fails until one lists L2.3 in deps
# (DEVIATIONS B54-02).
used_by   = ["L6.7"]
units     = ["python/tinyllm/lm/word2vec.py"]
upgrades  = []
milestone = "MS-L2"
ci        = "pr"

