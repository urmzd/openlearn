id        = "ag.04"
title     = "Tool gate, SQL safety gate, prompt-injection suite"
kind      = "build"
lang      = ["go"]
pass      = 10
chapter   = "content/tracks/ai-platform-engineering/13-agent-sdk/04-tool-gate-and-injection.md"
# The query_usage tool reads formats/usage.v1.sql (linked from the card); the
# Go API of go/agent/gate is fixed by the chapter's section 4 and the course
# tests (K01; B121-01).
contract  = []
# ag.01: the Gate seam, Verdict, CallContext; ag.02: the query_usage tool is
# a tool.Tool; ag.03: the injection suite drives the real loop with this
# gate (the catalog lists ag.03 as this module's call site; B121-03).
deps      = ["ag.01", "ag.02", "ag.03"]
# gw.07 owns the ledger the tool reads; the tool needs only the contract
# schema and a *sql.DB, so gw.07 is reading (B121-03).
reading   = ["gw.07", "content/case-studies/02-grounded-sql-agent", "content/tracks/ai-platform-engineering/13-agent-sdk"]
used_by   = ["ag.05"]               # AgentRun asks IsWrite before replaying an unrecorded write
units     = ["go/agent/gate/gate.go", "go/agent/gate/sql.go", "go/agent/gate/usage.go"]
upgrades  = []
milestone = "MS-agent"
ci        = "pr"

[tests]
dir       = "course/tests/go/ag_04/"
smoke     = ["TestHandExample", "TestSQLCorpus", "TestPolicyVerdicts", "TestInjectionSuite"]
timeout_s = 120
determinism_runs = 2

[fixtures]
files = ["course/fixtures/ag.04/sql_corpus.json", "course/fixtures/ag.04/injection.json"]
