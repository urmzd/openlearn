id        = "L6.6"
title     = "LoRA with PiSSA init and merge"
kind      = "build"
lang      = ["python"]
pass      = 5
chapter   = "content/courses/build-an-llm/p06-objectives/06-lora-pissa-and-merge.md"
contract  = ["contracts/py/tinyllm/obj/lora.pyi"]
# lora.py: L0.4's Linear, Dropout, and Module (LoRALinear wraps a Linear and
# reuses its Tensors), L0.2's ops on L0.1's Tensor, M03.5's low_rank (the
# PiSSA split). The course tests build their models from L0.4 layers.
deps      = ["L0.1", "L0.2", "L0.4", "M03.5"]
reading   = ["M03.4"]
# L6.5's lora_classifier injects adapters into a classifier's backbone (the
# MS-L6 `finetune classify --lora r=8` step). L12.1 (SFT, optional, B12)
# and sq.multi-lora join with their batches.
used_by   = ["L6.5", "L12.1"]
units     = ["python/tinyllm/obj/lora.py"]
upgrades  = []
milestone = "MS-L6"
ci        = "pr"

[tests]
dir       = "course/tests/L6.6"
smoke     = ["test_hand_example_forward_and_merge", "test_default_init_equals_base_bitwise"]
timeout_s = 60
determinism_runs = 2

[learner_tests]
rung      = 5
path      = "python/tests/l6-6-lora"
threshold = 0.80
required_mutants = ["s01", "s02", "s03", "s04", "s05", "s06", "s07", "s09"]
time_budget_s = 30
