id        = "L0.5"
title     = "Training loop and the autograd bigram"
kind      = "build"
lang      = ["python"]
pass      = 2
chapter   = "content/courses/build-an-llm/p00-foundations/05-training-loop-and-the-autograd-bigram.md"
