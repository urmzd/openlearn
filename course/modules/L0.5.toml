# The course tests train with L0.3's losses and
# M10.2's SGD and M10.3's AdamW.
deps      = ["L0.1", "L0.2", "L0.3", "L0.4", "M06.3", "M10.2", "M10.3", "M10.4", "M03.1", "M02.2"]
reading   = ["L0.0"]   # the tracer bigram whose unit this module takes over
# Inherited with bigram.py (DESIGN 3.4 upgrade exemption): L10.0 serves the
# table. L0.6 runs L0.0's suite (bigram.py included) as its regression. L2.2,
# L3.6, L6.1, and C1 join with their batches.
used_by   = ["L0.6", "L2.2", "L3.6", "L5.5", "L6.1", "L6.7"]
