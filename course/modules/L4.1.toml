id        = "L4.1"
title     = "Encoder-decoder with teacher forcing"
kind      = "build"
lang      = ["python"]
pass      = 4
chapter   = "content/courses/build-an-llm/p04-attention-origins/01-encoder-decoder-teacher-forcing.md"
contract  = ["contracts/py/tinyllm/seq2seq/model.pyi"]
# model.py: L3.4's bidirectional over L3.3 GRUs (encoder), L3.3's GRUCell
# or L3.2's LSTMCell (decoder), L4.2's length_mask and AdditiveAttention and
# L4.3's LuongAttention (attention and load_seq2seq), L0.4's Embedding and
# Linear, L0.2's ops on L0.1's Tensor (and no_grad), L0.6's safetensors
# I/O, M06.3's PCG32. The course tests train with L0.3's cross_entropy and
# M10.3's AdamW.
deps      = ["L0.1", "L0.2", "L0.3", "L0.4", "L0.6", "M06.3", "M10.3", "L3.2", "L3.3", "L3.4", "L4.2", "L4.3"]
reading   = ["L3.1"]
# L4.4's tests decode a Seq2Seq by beam search. The zoo's seq2seq rows (L6.7)
# join with B7.
used_by   = ["L4.4", "L6.7"]
units     = ["python/tinyllm/seq2seq/model.py"]
upgrades  = []
milestone = "MS-L4"
ci        = "pr"

[tests]
dir       = "course/tests/L4.1"
smoke     = ["test_hand_example_zero_weights", "test_forward_is_the_step_loop"]
timeout_s = 120
determinism_runs = 2

[fixtures]
files = ["course/fixtures/L4.1/seq2seq_torch.npz"]

[learner_tests]
rung      = 5
path      = "python/tests/l4-1-seq2seq"
