id        = "dur.10"
title     = "Raft HA for the durable log (optional)"
# Optional (DESIGN 4.4: "side call site: optional module"). Its only caller
# is `{durable} --replicas 3`, an entry point (D16), and the optional
# milestone MS-durable-ha, neither of which counts as a call site (P1), so
# it is registered as kind "side", as L3.5 (DEVIATIONS B103-01).
kind      = "side"
lang      = ["go"]
pass      = 8
chapter   = "content/tracks/ai-platform-engineering/05-durable-orchestration-and-workers/10-raft-ha.md"
# contracts/proto/tl/raft/v1/raft.proto is the wire form the server's
# composition root adapts Message to; it is linked from the chapter card. No
# contracts/go interface exists yet (K01), so the package API is fixed by the
# chapter (section 4) and the course tests (DEVIATIONS B103-02).
contract  = ["contracts/proto/tl/raft/v1/raft.proto"]
# The raft unit imports nothing from another unit: entries are opaque bytes
# (one framed WAL record each), so dur.01's log is reading, not a dep.
deps      = []
# dur.01 (the log it replicates) joins `reading` once B10 registers it
# (DEVIATIONS B103-03); until then the chapter home and the KRaft election
# demo of infrastructure/02 stand in.
reading   = ["lang.06", "content/tracks/ai-platform-engineering/05-durable-orchestration-and-workers", "content/tracks/infrastructure/02-messaging-and-queueing"]
used_by   = []
units     = ["go/durable/raft/raft.go"]
upgrades  = []
milestone = "MS-durable-ha"
ci        = "pr"

[tests]
dir       = "course/tests/go/dur_10/"
smoke     = ["TestHandExampleElectionAndFirstCommit", "TestFigure8OldTermEntryNotCommittedByCounting",
             "TestLeaderKillAckedAppendsSurvive", "TestPCG32MatchesSpec", "TestLinearizabilityCheckerRejectsStaleOrder"]
timeout_s = 120
determinism_runs = 2
