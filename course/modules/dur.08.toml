id        = "dur.08"
title     = "Signals, cancellation, sagas (compensation)"
kind      = "build"
lang      = ["go"]
pass      = 8
chapter   = "content/tracks/ai-platform-engineering/05-durable-orchestration-and-workers/08-signals-cancellation-and-sagas.md"
# proto/tl/durable/v1/durable.proto (SignalWorkflow, CancelWorkflow, and the
# cancel commands, all [dur.08]) is linked from the card; the Go API of the
# Runtime seam is fixed by the chapter's section 4 and the course tests.
contract  = []
# signals.go extends package server: dur.02 (Server, run, batch, commit),
# dur.04 (registerCommand), dur.05 (RecordHeartbeat, FailActivityTask). The
# SDK half extends package workflow through dur.06's eventHooks, and the
# end-to-end tests run timers through dur.07's service (DEVIATIONS B10B-05).
deps      = ["dur.02", "dur.04", "dur.05", "dur.06", "dur.07"]
reading   = ["lang.06", "content/tracks/ai-platform-engineering/05-durable-orchestration-and-workers"]
# data.09 compensates with Saga; dur.11 ends on ErrCanceled; dur.12 waits
# for the approve signal through the Runtime. ag.05 joins with its batch.
used_by   = ["data.09", "dur.11", "dur.12"]
units     = ["go/durable/server/signals.go", "go/durable/workflow/signal.go", "go/workflows/runtime.go", "go/workflows/saga.go"]
upgrades  = []
milestone = "MS-durable"
ci        = "pr"

[tests]
dir       = "course/tests/go/dur_08/"
smoke     = ["TestHandExampleSignalWhileBusy", "TestSignalBeforeFirstTaskIsInItsHistory", "TestHandExampleSagaUnwinds", "TestCompensationRunsAfterCancel",
             "TestEndToEndSignalBeforeWait", "TestEndToEndCancelMidActivityCompensatesOnce"]
timeout_s = 120
determinism_runs = 2
