id        = "L7.9"
title     = "Llama-family model, HF config, weight loading, downloader"
kind      = "build"
lang      = ["python"]
pass      = 5
chapter   = "content/courses/build-an-llm/p07-modern-block/09-llama-family-model.md"
contract  = ["contracts/py/tinyllm/modern/llama.pyi", "contracts/py/tinyllm/io/hf.pyi"]
# llama.py assembles Part 7: L7.1 RMSNorm and pre_norm_residual, L7.2
# GatedMLP, L7.3 RopeSpec, L7.4 rope_inv_freq_scaled (rope_scaling), L7.5
# GQAttention, L7.6 MLAttention, L7.7 attention_mask (window, sink tokens),
# L7.8 MoE; L0.6's safetensors reader and writer; M05.1's ModelConfig;
# L0.4's Embedding, Linear, ModuleList, Module; L0.2's ops on L0.1's Tensor;
# M06.3's PCG32 for the default rng. hf.py is stdlib only.
deps      = ["L7.1", "L7.2", "L7.3", "L7.4", "L7.5", "L7.6", "L7.7", "L7.8", "L0.6", "M05.1", "L0.4", "L0.2", "L0.1", "M06.3"]
# Concepts only: BF16 (M09.1; L0.6's reader decodes it), and the SmolLM2
# tokenizer (L1.2), which your CLI uses around this model in MS-L7.
reading   = ["M09.1", "L1.2"]
# Call sites (DESIGN 4.3): L8.1 to L8.6, L10.1 parity, C1. None
# is registered yet, so verify check 9 fails until L8.2 lists L7.9 in deps
# (DEVIATIONS B75-05).
used_by   = ["L8.2", "L10.1"]
units     = ["python/tinyllm/modern/llama.py", "python/tinyllm/io/hf.py"]
upgrades  = []
milestone = "MS-L7"
ci        = "pr"

[tests]
dir       = "course/tests/L7.9"
smoke     = ["test_hand_example_smollm2_config", "test_tiny_hf_logits_golden", "test_hand_example_layout_and_redirect"]
timeout_s = 90
determinism_runs = 2

