id        = "L0.6"
title     = "Safetensors for every dtype, atomic checkpoints, and the token stream"
kind      = "build"
lang      = ["python"]
pass      = 2
chapter   = "ml/08-tinyllm/p00-foundations/06-safetensors-checkpoints-and-token-streams.md"
contract  = ["contracts/py/tinyllm/io/safetensors.pyi", "contracts/py/tinyllm/io/checkpoint.pyi", "contracts/py/tinyllm/io/tokens.pyi"]
# M09.1: BF16 is written and read through its bit-level converters. The
# course tests checkpoint a Linear (L0.4) trained with L0.1's Tensor and
# L0.2's ops, under M10.3's AdamW and M10.2's SGD with momentum.
# L0.5: L0.0's suite, which runs as this module's regression for the unit it
# takes over, also exercises bigram.py, which L0.5 owns now.
deps      = ["M09.1", "L0.1", "L0.2", "L0.4", "M10.2", "M10.3", "M06.3", "L0.5"]
# M06.3: TokenStream draws its phases from the trainer's PCG32 and saves its
# state() in the cursor (the course tests drive it with the frozen one).
# L0.0: the v0 writer whose unit this module takes over.
reading   = ["L0.0"]
# Inherited with safetensors.py (DESIGN 3.4 upgrade exemption): L10.0 reads
# the file. L2.1 saves and loads its tables with it. L2.2, L7.9, L10.1, C1, and dur.09 join
# with their batches.
used_by = ["L2.1", "L2.2", "L3.6", "L4.1", "L5.5", "L6.1", "L6.2", "L6.3", "L6.5", "L6.7", "L7.9", "dur.09", "L14.3"]
units     = ["python/tinyllm/io/checkpoint.py", "python/tinyllm/io/tokens.py"]
upgrades  = ["python/tinyllm/io/safetensors.py"]
milestone = "MS-L0"
ci        = "pr"

[tests]
dir       = "course/tests/L0.6"
smoke     = ["test_worked_example_bf16_bytes", "test_hand_example_token_windows", "test_header_worked_example", "test_checkpoint_roundtrip"]
timeout_s = 60
determinism_runs = 2

[fixtures]
files = [
  "course/fixtures/L0.6/safetensors/cases.json",
  "course/fixtures/L0.6/safetensors/worked_bf16.safetensors",
  "course/fixtures/L0.6/safetensors/mixed.safetensors",
  "course/fixtures/L0.6/safetensors/bf16_rounding.safetensors",
  "course/fixtures/L0.6/safetensors/f8_rounding.safetensors",
  "course/fixtures/L0.6/safetensors/no_metadata.safetensors",
]
