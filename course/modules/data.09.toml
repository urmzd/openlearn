id        = "data.09"
title     = "Pipeline as a durable workflow CorpusBuild"
kind      = "build"
lang      = ["go"]
pass      = 8
chapter   = "content/tracks/data-engineering/05-corpus-pipeline/09-corpusbuild-as-a-durable-workflow.md"
# formats/corpus-config.schema.json (the stage spec) and
# spec/subprocess-activity.md, linked from the card.
contract  = []
# dur.08: the Runtime seam and Saga. The pipeline it orders (data.01 to
# data.08) runs as `{corpus} run --stage` subprocess activities (dur.09)
# through the worker's composition root, so those are reading.
deps      = ["dur.08"]
reading   = ["data.08", "dur.09", "content/tracks/data-engineering/05-corpus-pipeline"]
used_by   = ["dur.11"]          # TrainRun builds its corpus first; C1 joins with its batch
units     = ["go/workflows/corpus_build.go"]
upgrades  = []
milestone = "MS-durable"
ci        = "pr"

[tests]
dir       = "course/tests/go/data_09/"
smoke     = ["TestHandExampleKeysAndOrder", "TestKillLoopSameResult", "TestCancelDeletesPartialShards"]
timeout_s = 120
determinism_runs = 2
