id        = "craft.08"
title     = "Code review: review a seeded PR against your system"
kind      = "practice"
lang      = ["go", "docs"]
pass      = 7
chapter   = "content/tracks/software-craftsmanship/08-code-review-and-ci/02-code-review.md"
contract  = []                     # the review file format is the chapter's (section 4)
deps      = []
# The PR changes gw.03's rate limiter (go/gateway/limit, which imports gw.01's
# server and gw.02's auth), built from the course reference in a scratch copy,
# so no code of yours is called: they are reading, not deps (DESIGN 4.6,
# 5.10). craft.01 is the CI gate a PR passes first; craft.07 is how to read a
# planted fault; software-craftsmanship/02 is the code-review reading (8.2).
reading   = ["craft.01", "craft.07", "gw.01", "gw.02", "gw.03", "lang.06", "content/tracks/software-craftsmanship/02-swe-at-google"]
used_by   = []                     # practice: the review is yours, never overlaid
units     = []                     # nothing to stub: the first check builds the PR branch and the template
artifacts = ["docs/reviews/craft-08-pr-review.toml"]  # hashed into the verdict, present = started (I28)
upgrades  = []
milestone = "MS-prod"
ci        = "pr"

[tests]
dir       = "course/tests/craft.08"  # `check` builds drill/craft-08, then grades your findings (test_craft08_review.py)
