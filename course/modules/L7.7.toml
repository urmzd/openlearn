# window.py: L5.2's causal_mask and sliding_window_mask (the sink-window
# mask is built on them); M09.2's logsumexp (windowed_attention's lse). The
# course tests run L7.5's GQAttention (with L7.3's RopeSpec on L0.1's
# Tensor) through the bounded cache, and L7.5's ConcatKVCache.
deps      = ["L5.2", "M09.2", "L7.5", "L7.3", "L0.1"]
reading   = []
# L7.9 places tl_sliding_window and tl_sink_tokens with attention_mask and
# serves SinkWindowCache. L8.2 (eviction policy) and L9.3 (the window and
# sink_logits of the C kernel, checked against windowed_attention) join
# with their batch.
used_by   = ["L7.9"]
units     = ["python/tinyllm/modern/window.py"]
upgrades  = []
