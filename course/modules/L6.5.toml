id        = "L6.5"
title     = "Fine-tuning heads and the linear-head export"
kind      = "build"
lang      = ["python"]
pass      = 5
chapter   = "content/courses/build-an-llm/p06-objectives/05-fine-tuning-heads-and-the-linear-head-export.md"
contract  = ["contracts/py/tinyllm/obj/heads.pyi"]
# heads.py: L6.1's GPT and GPTConfig and L6.2's BertEncoder and BertConfig
# (the backbones it reads and rebuilds from a classifier directory), L6.6's
# inject_lora and LoRALinear (lora_classifier, the merge check), M07.7's
# logistic_regression_fit, roc_auc, and ece (the policy head and its
# metrics), M10.3's AdamW (train_classifier), L0.3's cross_entropy and
# bce_with_logits, L0.4's Linear, Dropout, Module, L0.2's ops on L0.1's
# Tensor (and no_grad), L0.6's safetensors I/O, M06.3's PCG32 (default init).
deps      = ["L0.1", "L0.2", "L0.3", "L0.4", "L0.6", "M06.3", "M07.7", "M10.3", "L6.1", "L6.2", "L6.6"]
reading   = ["M07.4"]
# L6.7's zoo loads classifier directories (load_classifier) and scores them
# with predict. ethics.05 (the policy head, evaluated in Go by gw.08) and
# L12.3 (reward model, optional) join with B12.
used_by   = ["L6.7"]
units     = ["python/tinyllm/obj/heads.py"]
upgrades  = []
milestone = "MS-L6"
ci        = "pr"

[tests]
dir       = "course/tests/L6.5"
smoke     = ["test_hand_example_pooling_and_loss", "test_hand_example_linear_head_probs", "test_python_scores_equal_the_shared_fixture"]
timeout_s = 60
determinism_runs = 2

[fixtures]
files = ["course/fixtures/L6.5/linear_head.json", "course/fixtures/small-corpora/sst2-2k.tsv"]

[learner_tests]
rung      = 5
path      = "python/tests/l6-5-heads"
threshold = 0.80
required_mutants = ["s01", "s02", "s03", "s04", "s05", "s06", "s07"]
time_budget_s = 30
