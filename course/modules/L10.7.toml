id        = "L10.7"
title     = "Serving metrics, SLO histograms, OTel spans and propagation"
kind      = "build"
lang      = ["rust"]
pass      = 7
chapter   = "content/courses/build-an-llm/p10-serving/07-serving-metrics-and-tracing.md"
# The interfaces are otel/metrics.yaml and otel/semconv.md, linked from the
# card; neither carries a `chapter:` back-pointer for this chapter
# (DEVIATIONS B92-03).
contract  = ["contracts/otel/metrics.yaml", "contracts/otel/semconv.md"]
# EngineGauges::from_stats reads the engine loop's EngineStats (L10.5).
deps      = ["L10.5"]
# Confidence intervals and quantiles (M07.4); the Pass 1 hand-written trace
# export this replaces (obs.00).
reading   = ["M07.4", "obs.00"]
# Call sites: L10.9 takes server.rs over next and keeps recording through
# EngineMetrics and request_spans; obs.02's local tier runs the engine and
# scrapes the histograms this module's serve loop records (DEVIATIONS L10.7).
used_by   = ["L10.9", "obs.02"]
units     = [
  "rust/crates/tl-serve/src/metrics.rs",
  "rust/crates/tl-serve/src/telemetry.rs",
]
# The serve loop (L10.5's server.rs) records every request in
# EngineMetrics and exports its span tree (DEVIATIONS L10.7).
upgrades  = ["rust/crates/tl-serve/src/server.rs"]
milestone = "MS-L10"
ci        = "pr"

[tests]
dir       = "course/tests/rust/l10_7.rs"
smoke     = ["hand_example_histogram", "names_and_buckets_match_the_contract", "traceparent_hand_example", "serve_loop_records_metrics_and_spans"]
timeout_s = 60
determinism_runs = 2

[fixtures]
files = ["course/fixtures/L10.7/engine_metrics.json"]
