id        = "L10.9"
title     = "Tool calls and constrained JSON decoding in the engine"
kind      = "build"
lang      = ["rust"]
pass      = 7
chapter   = "ml/08-tinyllm/p10-serving/09-tool-calls-and-constrained-decoding.md"
# No Rust trait contract (K01); constrain.pyi (L8.7), whose subset this port
# follows, and openai-subset.v1.yaml (tools, tool_choice, response_format)
# are linked from the card.
contract  = []
# L8.7: the Python specification the course tests hold this port to (its
# recorded DFAs and masks). L10.1: sample. L10.5: the chat template and the
# error shape. L1.5: the Tokenizer trait (vocab_bytes). L10.7: the serve
# loop this module takes over records EngineMetrics and request_spans.
deps      = ["L8.7", "L10.1", "L10.5", "L1.5", "L10.7"]
reading   = ["M06.1"]
# The serve loop calls tools.rs and constrain.rs: this module takes over
# server.rs (after L10.7) and inherits its call site, obs.02, which runs the
# engine (DESIGN 3.4 upgrade exemption; DEVIATIONS L10.9). ag.01 and
# MS-agent read tool_calls over HTTP. craft.14 takes server.rs over next to
# serve API v1 and v2 side by side.
used_by   = ["obs.02", "craft.14"]
units     = [
  "rust/crates/tl-engine/src/constrain.rs",
  "rust/crates/tl-serve/src/tools.rs",
]
upgrades  = ["rust/crates/tl-serve/src/server.rs"]
milestone = "MS-L10"
ci        = "pr"

[tests]
dir       = "course/tests/rust/l10_9.rs"
smoke     = ["hand_example_dfa", "parse_tool_request_hand_example", "parser_hand_example", "serve_loop_routes_tool_calls"]
timeout_s = 60
determinism_runs = 2

[fixtures]
files = [
  "course/fixtures/L10.9/constrain_golden.json",
  "course/fixtures/L8.7/masks_golden.json",
]
