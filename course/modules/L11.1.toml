id        = "L11.1"
title     = "Mixed precision, loss scaling, gradient accumulation, and activation checkpointing"
kind      = "build"
lang      = ["python"]
pass      = 9
chapter   = "content/courses/build-an-llm/p11-training-at-scale/01-mixed-precision-accumulation-and-checkpointing.md"
contract  = ["contracts/py/tinyllm/train/precision.pyi", "contracts/py/tinyllm/train/recompute.pyi"]
# precision.py: L0.1's Tensor and from_op (cast, the patched matmul), L0.4's
# Module, M09.1's round_to_bf16 and round_to_fp16, M10.4's clip_grad_norm_.
# recompute.py: L0.1's Tensor, from_op, no_grad, is_grad_enabled, M08.4's
# checkpoint_schedule. The course tests train L0.4 layers with L0.3's mse,
# M10.2's SGD, and M10.3's AdamW.
deps      = ["L0.1", "L0.3", "L0.4", "M09.1", "M10.2", "M10.3", "M10.4", "M08.4"]
# The memory plan of M05.1 (bytes per parameter in mixed precision) and
# L0.5's train_step, which train_step_mixed extends, are read, not called.
reading   = ["M05.1", "L0.5"]
# C1's short and full train specs request bf16, accumulation, and activation
# recompute; its smoke tier stays fp32 (DESIGN D20).
used_by   = ["C1"]
units     = ["python/tinyllm/train/precision.py", "python/tinyllm/train/recompute.py"]
upgrades  = []
milestone = "MS-L11"
ci        = "pr"

[tests]
dir       = "course/tests/L11.1"
smoke     = ["test_hand_example_bf16_matmul", "test_hand_example_accumulation", "test_hand_example_checkpoint_schedule"]
timeout_s = 60
determinism_runs = 2

# Rung R5 (DESIGN 5.12): oracles and differential tests. Your tests run
# against the reference with one planted fault at a time; every semantic
# mutant is required.
[learner_tests]
rung      = 5
path      = "python/tests/l11-1-precision"
threshold = 0.80
required_mutants = ["s01", "s02", "s03", "s04", "s05", "s06", "s07", "s08", "s09", "s10", "s11", "s12", "s13", "s14", "s15", "s16", "s17", "s18", "s19", "s20", "s21", "s22", "s23", "s24"]
time_budget_s = 30
