id        = "ds.02"
title     = "Swiss table tl_map (u64 to u64, optional C)"
kind      = "side"
lang      = ["c"]
pass      = 6
chapter   = "algorithms/16-systems-data-structures/02-swiss-table.md"
# The interface is the ds.02 section of tinyllm/ds.h, linked from the card;
# that shared header carries no `chapter:` back-pointer, which `ol lint`
# requires of a listed contract (DEVIATIONS B82-02).
contract  = ["contracts/c/include/tinyllm/ds.h"]
deps      = ["rt.02"]
# ds.05 is the first hash-table chapter (hashing, probing, load factor);
# S-M06a gives the expected probe lengths. Neither has code ds.02 calls.
reading   = ["ds.05", "S-M06a"]
# rt.04 keeps its prefix index (block hash -> block id) in a tl_map. The
# engine's --prefix-cache=hash path (L10.4) and KV-transfer dedup (L10.6)
# reach it through rt.04; they join with their batch (B9).
used_by   = ["rt.04"]
units     = ["c/src/ds/swiss.c"]
upgrades  = []
milestone = "MS-L9"
ci        = "pr"

[tests]
dir       = "course/tests/ds.02"
smoke     = ["hand_example_fourteen_fit_the_fifteenth_grows"]
timeout_s = 60
determinism_runs = 2

[bench]                               # course/tests/ds.02/bench/lookup.c (DEVIATIONS B82-04)
lang   = "c"
name   = "lookup"
metric = "miss_speedup"
budget = ">= 1.3"                     # reference about 2.1 to 3.2 on an M-series laptop; hits are about 1.05

[learner_tests]                       # rung R2: the chapter names the tests, you write the bodies
rung      = 2
path      = "c/tests/ds02-swiss"
threshold = 0.60
required_mutants = []
time_budget_s = 30
