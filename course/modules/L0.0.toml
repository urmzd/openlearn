id        = "L0.0"
title     = "Byte bigram: counts, logits, safetensors v0"
kind      = "build"
lang      = ["python"]
pass      = 1
chapter   = "content/courses/build-an-llm/p00-foundations/00-byte-bigram.md"
contract  = ["contracts/py/tinyllm/lm/bigram.pyi", "contracts/py/tinyllm/io/safetensors.pyi"]
deps      = ["M03.1"]   # Python row-major matrix operations
reading   = ["lang.01"]   # numpy fluency; a primer has no code call site
# L10.0 serves the checkpoint (tl_arch = bigram, tl_tokenizer = bytes). L0.5
# (retrains it with autograd, upgrades bigram.py) and L0.6 (all dtypes,
# upgrades safetensors.py) join with their batch (B2): the mirror rule only
# accepts call sites that exist in the registry (DEVIATIONS L00-03).
used_by   = ["L10.0"]
units     = ["python/tinyllm/lm/bigram.py", "python/tinyllm/io/safetensors.py"]
upgrades  = []
milestone = "MS-P1"
ci        = "pr"

[tests]
dir       = "course/tests/L0.0"
smoke     = ["test_hand_example_probabilities", "test_logits_are_weight_rows", "test_worked_example_bytes"]
timeout_s = 60
determinism_runs = 2

[fixtures]
files = [
  "course/fixtures/L0.0/safetensors/cases.json",
  "course/fixtures/L0.0/safetensors/worked_example.safetensors",
  "course/fixtures/L0.0/safetensors/several_tensors.safetensors",
  "course/fixtures/L0.0/safetensors/no_metadata.safetensors",
  "course/fixtures/L0.0/safetensors/no_padding.safetensors",
  "course/fixtures/L0.0/safetensors/unicode_metadata.safetensors",
  "course/fixtures/L0.0/safetensors/bigram_weight.safetensors",
]
