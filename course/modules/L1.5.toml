id        = "L1.5"
title     = "Rust fast BPE (tl-tok), byte tokenizer, streaming decoder"
kind      = "build"
lang      = ["rust"]
pass      = 3
chapter   = "content/courses/build-an-llm/p01-tokenizers/05-rust-fast-bpe.md"
# Rust implementation and file-based parity vectors are described in the chapter.
contract  = ["contracts/formats/tokenizer.md"]
# The Rust CLI keeps its tables in RobinHoodMap (ds.05) and merges from
# LazyHeap (ds.06); Python parity is checked against frozen JSON vectors.
deps      = ["L1.2", "ds.05", "ds.06"]
reading   = ["lang.04", "M05.2"]    # the Rust primer; the GPT-2 byte map, re-implemented in Rust
used_by   = ["L10.5", "L10.9"]
units     = [
  "rust/crates/tl-tok/src/lib.rs",
  "rust/crates/tl-tok/src/bpe.rs",
  "rust/crates/tl-tok/src/pretok.rs",
  "rust/crates/tl-tok/src/hfjson.rs",
  "rust/crates/tl-tok/src/stream.rs",
]
upgrades  = []
milestone = "MS-L1"
ci        = "pr"

[tests]
dir       = "course/tests/rust/l1_5.rs"
smoke     = ["hand_example_merges_from_the_heap", "gpt2_golden_10k", "encode_batch_equals_serial_encode"]
timeout_s = 120
determinism_runs = 2

[fixtures]                          # the tests also read tok-gpt2/ and tok-smollm2/tokenizer.json (L1.2's fixtures)
files = [
  "course/fixtures/L1.5/golden.jsonl",
  "course/fixtures/tok-gpt2/tokenizer.json",
  "course/fixtures/tok-smollm2/tokenizer.json",
]

[learner_tests]                     # rung R4: properties with proptest (craft.04)
rung      = 4
path      = "rust/crates/tl-tok/tests/l1_5_props.rs"
threshold = 0.80
required_mutants = ["s01", "s02", "s03", "s04", "s05", "s06", "s07", "s08", "s09", "s10", "s11", "s12", "s13", "s16"]
time_budget_s = 90
