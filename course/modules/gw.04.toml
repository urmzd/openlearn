id        = "gw.04"
title     = "SSE streaming proxy (upgrades gw.00)"
kind      = "build"
lang      = ["go"]
pass      = 7
chapter   = "content/tracks/ai-platform-engineering/12-gateway/04-sse-streaming-proxy.md"
contract  = []                      # openapi/openai-subset.v1.yaml (Streaming, Disconnect) is linked from the card (B82-02)
deps      = ["gw.01"]               # server.Usage, the Exchange the chain observer records on
reading   = ["L10.5", "gw.00", "content/tracks/ai-platform-engineering/03-streaming-sse"]
# gw.05 forwards every attempt through Forward and its commitment boundary.
# Through the upgrade it inherits gw.00's call sites (dep.00, obs.00).
used_by   = ["gw.05"]
units     = []
upgrades  = ["go/gateway/proxy/proxy.go"]
milestone = "MS-gateway"
ci        = "pr"

[tests]
dir       = "course/tests/go/gw_04/"
smoke     = ["TestHandExample", "TestRecordedStreamsByteExact", "TestNewOutboundDropsKey", "TestHandlerUpstreamDown503"]
timeout_s = 120
determinism_runs = 2

[fixtures]
files = ["course/fixtures/gw.04/streams.json"]

[bench]                             # a B test: `ol bench gw.04 --assert`, never `ol check`
lang   = "go"
name   = "FirstByteOverhead"        # BenchmarkFirstByteOverhead in course/tests/go/gw_04/
metric = "overhead_ms"              # added time to first byte through the proxy, per request
budget = "<= 5"
