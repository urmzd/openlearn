id        = "ag.01"
title     = "Types, OpenAI-compatible provider, retry wrapper"
kind      = "build"
lang      = ["go"]
pass      = 10
chapter   = "content/tracks/ai-platform-engineering/13-agent-sdk/01-types-and-provider.md"
# The wire contract is openapi/openai-subset.v1.yaml (chat completions with
# tools, Streaming), linked from the card; the Go API of go/agent/types and
# go/agent/provider is fixed by the chapter's section 4 and the course tests
# (no contracts/go file declares it yet, K01; DEVIATIONS B121-01).
contract  = []
deps      = []
