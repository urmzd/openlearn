id        = "obs.01"
title     = "Tracing for the serving path"
kind      = "build"
lang      = ["go"]
pass      = 7
chapter   = "content/tracks/systems/04-observability/01-tracing-for-the-serving-path.md"
# The span names, kinds, attributes, and propagation rules are
# contracts/otel/semconv.md; the Go API of go/otelx is fixed by the chapter's
# section 4 and the course tests (B95-01: no contracts/go file).
contract  = ["contracts/otel/semconv.md"]
deps      = []                          # otelx calls no other module's code
# obs.00 is the hand-written tracer export this module replaces; the topic
# README is the reading. L10.7 (the engine's tracing-opentelemetry setup) is
# the Rust half of the same trace and is linked from the chapter.
reading   = ["obs.00", "L10.7", "content/tracks/systems/04-observability"]
# Call sites: obs.02 wires otelx into the gateway (LogHandler, Middleware,
# Setup); dur.04 (activity spans from ActivityTask.trace_context) and ag.03
# (agent spans) join with their batches (DESIGN 4.5).
used_by   = ["obs.02"]
units     = [
  "go/otelx/provider.go",
  "go/otelx/propagation.go",
  "go/otelx/http.go",
  "go/otelx/grpc.go",
  "go/otelx/log.go",
]
upgrades  = []
milestone = "MS-prod"
ci        = "pr"

[tests]
dir       = "course/tests/go/obs_01/"
smoke     = ["TestTraceparentHandExample", "TestMiddlewareContinuesCallerTrace", "TestMiddlewareStartsNewTraceWithoutHeader", "TestServingTreeAcrossHTTPAndGRPC"]
timeout_s = 120
determinism_runs = 2
