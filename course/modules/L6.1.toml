id        = "L6.1"
title     = "GPT decoder-only, causal LM loss, GPT-2 weight loading"
kind      = "build"
lang      = ["python"]
pass      = 5
chapter   = "content/courses/build-an-llm/p06-objectives/01-gpt-decoder-only.md"
contract  = ["contracts/py/tinyllm/obj/gpt.pyi"]
# gpt.py: L5.2's causal_mask, L5.3's attention, L5.4's LearnedPE; L0.4's
# layers, L0.2's ops (tanh GELU), L0.1's Tensor, L0.3's cross_entropy, L0.5's
# train_step, L0.6's safetensors (model directory) and TokenStream (the
# learning test), M10.3's AdamW, M10.4's cosine_with_warmup, M07.3's
# normal_init and scaled_residual_std, M06.3's PCG32.
deps      = ["L5.2", "L5.3", "L5.4", "L0.1", "L0.2", "L0.3", "L0.4", "L0.5", "L0.6", "M10.3", "M10.4", "M07.3", "M06.3"]
reading   = ["L5.5"]   # pre-LN, which GPT-2 uses
# L6.5's heads sit on GPT.hidden; the L6.7 zoo loads tl_arch "gpt". L8.2's
# first KV cache joins when it registers.
used_by   = ["L6.5", "L6.7"]
units     = ["python/tinyllm/obj/gpt.py"]
upgrades  = []
milestone = "MS-L6"
ci        = "pr"

[tests]
dir       = "course/tests/L6.1"
smoke     = ["test_hand_example_clm_loss", "test_golden_hf_gpt2", "test_logits_are_causal"]
timeout_s = 60
determinism_runs = 2

[fixtures]
files = ["course/fixtures/L6.1/gpt2_tiny_hf.npz", "course/fixtures/MS-L2/train.bin", "course/fixtures/MS-L2/val.bin"]

[learner_tests]
rung      = 5
path      = "python/tests/l6-1-gpt"
threshold = 0.80
required_mutants = ["s01", "s02", "s03", "s04", "s05", "s06", "s08"]
time_budget_s = 30
