id        = "dur.09"
title     = "Subprocess activity runner (Go) and the Python activity helper"
kind      = "build"
lang      = ["go", "python"]
pass      = 8
chapter   = "content/tracks/ai-platform-engineering/05-durable-orchestration-and-workers/09-subprocess-activities.md"
# contracts/spec/subprocess-activity.md is the shared interface (linked from
# the card); the two .pyi files are this module's own contracts.
contract  = ["contracts/py/tinyllm/io/activity.pyi",
             "contracts/py/tinyllm/io/telemetry.pyi"]
# L0.6: Activity.checkpoint emits a ckpt event only when verify_step_dir
# says the step directory is complete. The catalog prereqs dur.04 (worker)
# and dur.05 (activity SDK) join when B10's engine modules are registered:
# the runner takes a Task and a Heartbeat func, so it compiles and is tested
# without them, and the worker's composition root adapts a delivery to it
# (DEVIATIONS B10B-02).
deps      = ["L0.6"]
reading   = ["lang.02", "content/tracks/ai-platform-engineering/05-durable-orchestration-and-workers"]
# dep.06's worker image carries these units and obs.05's check runs
# telemetry.py. The workflows (data.09, dur.11, dur.12) reach the runner only
# through activity names registered in the worker's composition root (an
# entry point), so they are not code call sites (DEVIATIONS B10B-03).
used_by   = ["dep.06", "obs.05"]
units     = ["go/activities/subprocess.go", "python/tinyllm/io/activity.py", "python/tinyllm/io/telemetry.py"]
upgrades  = []
milestone = "MS-durable"
ci        = "pr"

[tests]
dir       = "course/tests/dur.09"       # Python tests; Go tests in course/tests/go/dur_09/
smoke     = ["TestHandExampleResumeFlow", "TestExitCodeTable", "test_hand_example_progress_lines", "test_hand_example_span_tree",
             "test_flags_and_environment", "test_format_roundtrip", "test_no_traceparent_starts_a_root"]
timeout_s = 180
determinism_runs = 2

[fixtures]
files = ["course/fixtures/dur.09/fake_child.py"]
