id        = "M07.3"
title     = "Variance propagation and initialization"
kind      = "build"
lang      = ["python"]
pass      = 2
chapter   = "math/07-probability-statistics/03-variance-propagation-and-initialization.md"
contract  = ["contracts/py/tinyllm/nn/init.pyi"]
deps      = ["M07.0"]                # tinyllm.prob.rv.normal draws every normal weight
# M01.3 gives the activations whose second moments set the gains; M06.3 the
# PCG32 whose uniform() the callers pass in (course tests pass the frozen one);
# S-M02 and S-M04 hold the Gaussian integrals behind the variance formulas.
reading   = ["M01.3", "M06.3", "S-M02", "S-M04"]
# L0.4's layers initialize with it. L3.2, L7.9, and C1 join with their
# batches: the mirror rule only accepts call sites in the registry.
used_by   = ["L0.4", "L3.2", "L3.3", "L3.6", "L5.4", "L5.5", "L6.1", "L6.2", "L6.3", "L13.1", "L13.3"]
units     = ["python/tinyllm/nn/init.py"]
upgrades  = []
milestone = "MS-P2"
ci        = "pr"

[tests]
dir       = "course/tests/M07.3"
smoke     = ["test_hand_example_linear_4x3", "test_relu_signal_survives_20_layers"]
timeout_s = 60
determinism_runs = 2

