id        = "L10.6"
title     = "Disaggregated prefill/decode, KV transfer, heartbeat client"
kind      = "build"
lang      = ["rust"]
pass      = 7
chapter   = "ml/08-tinyllm/p10-serving/06-disaggregated-prefill-decode.md"
# The interfaces are proto/tl/{engine,kv,control}/v1 (generated code in
# contracts/rust/tl-proto) and the bytes formats/kv-block.md, all linked from
# the chapter card; none carries a `chapter:` back-pointer yet (DEVIATIONS
# B92-03).
contract  = ["contracts/proto/tl/engine/v1/engine.proto", "contracts/proto/tl/kv/v1/kv.proto", "contracts/proto/tl/control/v1/control.proto", "contracts/formats/kv-block.md"]
# Code this module's units and tests call: the Rust KV cache and the sampler's
# stream (L10.1). The scheduler, block manager, and engine loop (L10.2, L10.4,
# L10.5) are the serve loop this plugs into; the Prefill RPC reaches them
# through the PrefillBackend trait, so no code of theirs is called here.
deps      = ["L10.1"]
reading   = ["L10.2", "L10.4", "L10.5", "lang.09", "lang.10"]   # the serve loop it plugs into; async Rust; gRPC and the generated stubs
# The gateway calls Prefill and Release over the shared gRPC contracts.
used_by   = ["gw.05", "craft.14"]
units     = [
  "rust/crates/tl-engine/src/kv_transfer.rs",
  "rust/crates/tl-engine/src/heartbeat.rs",
  "rust/crates/tl-serve/src/control.rs",
]
upgrades  = []
milestone = "MS-L10"
ci        = "pr"

[tests]
dir       = "course/tests/rust/l10_6.rs"
smoke     = ["hand_example_envelope", "disaggregated_equals_colocated", "worker_status_fields"]
timeout_s = 120
determinism_runs = 2

[fixtures]
files = ["course/fixtures/parity/kv_wire_v1.json"]
