id        = "ag.06"
title     = "RAG ingest: crawler with SSRF allowlist, chunker, embedder, store"
kind      = "build"
lang      = ["go"]
pass      = 10
chapter   = "content/tracks/ai-platform-engineering/07-retrieval-and-rag/06-rag-ingest.md"
# The index directory is formats/rag-index.md (meta.json, docs.jsonl,
# vectors.f32; bm25.idx comes from ag.07), linked from the card. The Go API
# of go/agent/rag/{source,chunk,embed,store} is fixed by the chapter's
# section 4 and the course tests (K01; B121-01).
contract  = []
deps      = ["ag.01"]               # the embedder retries with provider.Retryable and RetryPolicy
# ag.02 is the catalog prereq (the tool layer the RAG tools plug into later);
# ingest calls none of its code. L1.5 is the tokenizer the engine's
# /v1/tokenize runs; practice go/01 is the crawler warm-up.
reading   = ["ag.02", "L1.5", "content/tracks/ai-platform-engineering/07-retrieval-and-rag", "practice/build/cloud/go"]
used_by   = ["ag.07"]               # retrieval reads the index this module writes
units     = [
  "go/agent/rag/source/source.go",
  "go/agent/rag/source/crawler.go",
  "go/agent/rag/chunk/chunk.go",
  "go/agent/rag/embed/embed.go",
  "go/agent/rag/store/store.go",
]
upgrades  = []
milestone = "MS-agent"
ci        = "pr"

[tests]
dir       = "course/tests/go/ag_06/"
smoke     = ["TestHandExample", "TestChunkBudgetNeverExceeded", "TestIngestDedupNoOp", "TestIndexFormat", "TestSSRF"]
timeout_s = 120
determinism_runs = 2
