id        = "dur.01"
title     = "Append-only segmented event log"
kind      = "build"
lang      = ["go"]
pass      = 8
chapter   = "content/tracks/ai-platform-engineering/05-durable-orchestration-and-workers/01-event-log.md"
# The record framing, segments, recovery, and quota are formats/wal.md; the
# Go API (Log, Event, Options) is fixed by the chapter's section 4 and the
# course tests (no contracts/go file, K01). wal.md is linked from the card; it
# carries no chapter back-pointer, so it is not listed here (B82-02).
contract  = []
deps      = []
reading   = ["lang.06", "lang.10", "M06.3"]   # Go; protobuf (the server's payloads); hashing (CRC-32C is defined in beat 2)
used_by   = ["dur.02", "dur.03"]              # run histories and queue transitions live in this log
units     = ["go/durable/log/record.go", "go/durable/log/log.go"]
upgrades  = []
milestone = "MS-durable"
ci        = "pr"

[tests]
dir       = "course/tests/go/dur_01/"
smoke     = ["TestRecordHandExample", "TestAppendReadHand", "TestVersionConflict", "TestReopenRecovers", "TestTornTailTruncatedAtEveryOffset"]
timeout_s = 120
determinism_runs = 2

[learner_tests]                     # rung R4: properties, black box (package log_test)
rung      = 4
path      = "go/durable/log/log_learner_test.go"
threshold = 0.80
required_mutants = ["s01", "s02", "s03", "s04", "s05", "s06", "s07", "s08", "s09", "s10", "s11", "s12", "s13", "s14", "s15", "s16", "s17", "s18", "s19"]
time_budget_s = 60
