id        = "L8.1"
title     = "Sampling and logit processors"
kind      = "build"
lang      = ["python"]
pass      = 6
chapter   = "content/courses/build-an-llm/p08-inference/01-sampling-and-logit-processors.md"
contract  = ["contracts/py/tinyllm/infer/sample.pyi"]
# sample.py: M07.1's sample_categorical is step 11 (the inverse CDF) and its
# UniformSource the generator type; M06.3's PCG32 builds the request stream
# (request_rng); M11.1's entropy is the per-token entropy generate logs.
deps      = ["M07.1", "M06.3", "M11.1"]
# Concepts only: the stable softmax (M09.2) is rewritten here in float64 with
# a sequential sum, because numpy's pairwise sum would break Rust parity.
reading   = ["M09.2", "M07.6"]
# Call sites: L8.2 (generate samples every token); ds.04 (its top-k is
# checked against this sampler's top-k on fixture logits); L8.7 (constrained
# decoding masks logits and samples through it); L8.6 (the target
# distribution of speculative decoding). L10.1 (the Rust
# port held to the same fixture), and L12.3 join with their
# batches (DEVIATIONS B81-03).
used_by   = ["L8.2", "L8.7", "L8.6", "L12.3"]
units     = ["python/tinyllm/infer/sample.py"]
upgrades  = []
milestone = "MS-L8"
ci        = "pr"

[tests]
dir       = "course/tests/L8.1"
smoke     = ["test_hand_example", "test_hand_example_intermediates"]
timeout_s = 60
determinism_runs = 2

[fixtures]
files = ["course/fixtures/L8.1/sampler_golden.json"]

[learner_tests]
rung      = 5
path      = "python/tests/l8-1-sample"
threshold = 0.80
required_mutants = ["s01", "s02", "s03", "s04", "s05", "s06", "s07", "s08", "s09", "s10", "s11", "s12", "s13", "s14", "s15", "s16", "s17", "s18", "s20", "s21", "s22"]
time_budget_s = 30
