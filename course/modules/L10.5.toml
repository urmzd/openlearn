id        = "L10.5"
title     = "tl-serve: OpenAI-compatible HTTP + SSE on tokio/hyper"
kind      = "build"
lang      = ["rust"]
pass      = 7
chapter   = "content/courses/build-an-llm/p10-serving/05-openai-server-on-tokio.md"
# openapi/openai-subset.v1.yaml is the contract; it has no `chapter:`
# back-pointer to this chapter yet (shared change, DEVIATIONS B91-08), so it
# is linked from the chapter card instead of listed here.
contract  = ["contracts/openapi/openai-subset.v1.yaml"]
# The engine loop composes L10.1 to L10.4; the server tokenizes with tl-tok
# (L1.5: the byte tokenizer and tokenizer.json BPE).
deps      = ["L10.1", "L10.2", "L10.3", "L10.4", "L10.8", "L1.5"]
reading   = ["lang.09", "lang.05", "L10.0", "L8.2"]   # async Rust; SSE; the v0 tracer; generate and the detokenizer
# Catalog call sites (L10.6, L10.7, L10.9; gw.04, ag.01, load.01, L12.3
# over HTTP) are registered below.
used_by   = ["L10.7", "L10.9", "L12.3"]
units     = [
  "rust/crates/tl-engine/src/engine.rs",
  "rust/crates/tl-serve/src/server.rs",
  "rust/crates/tl-serve/src/openai.rs",
  "rust/crates/tl-serve/src/sse.rs",
  "rust/crates/tl-serve/src/template.rs",
]
upgrades  = []                      # L10.0's crate root (glue) declares the v1 modules (DEVIATIONS B91-09)
milestone = "MS-L10"
ci        = "pr"

[tests]
dir       = "course/tests/rust/l10_5.rs"
smoke     = ["hand_example_chat_completion", "stream_framing_role_first_then_done", "errors_use_the_openai_shape", "speculative_runtime_config_drives_the_serving_path"]
timeout_s = 120
determinism_runs = 2

[fixtures]
files = [
  "course/fixtures/L7.9/tiny-llama-2l/config.json",
  "course/fixtures/L7.9/tiny-llama-2l/model.safetensors",
]
