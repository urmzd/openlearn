id        = "L3.4"
title     = "Bidirectional RNN with length-aware reversal"
kind      = "build"
lang      = ["python"]
pass      = 4
chapter   = "content/courses/build-an-llm/p03-recurrent/04-bidirectional-rnn.md"
contract  = ["contracts/py/tinyllm/rnn/bi.pyi"]
# bidirectional runs L3.2/L3.3 modules (the course tests load torch's two
# directions into them); the gather is L0.1's Tensor getitem and the concat
# is L0.2's.
deps      = ["L3.2", "L3.3", "L0.1", "L0.2"]
reading   = ["L0.4", "craft.04"]   # Module (the fwd/bwd type); rung R4, properties
# L4.1: the seq2seq encoder is bidirectional(GRU, GRU, ...). L3.5 (ELMo, a
# side module) uses reverse_padded.
used_by   = ["L4.1"]
units     = ["python/tinyllm/rnn/bi.py"]
upgrades  = []
milestone = "MS-L3"
ci        = "pr"

[tests]
dir       = "course/tests/L3.4"
smoke     = ["test_hand_example_reversal", "test_hand_example_running_sums"]
timeout_s = 60
determinism_runs = 2

[fixtures]
files = ["course/fixtures/L3.4/bi_torch.npz"]

# Rung R4 (DESIGN 5.12): the properties are given in prose (chapter section
# 4); you write them as property tests. Graded by mutation (0.80) with every
# semantic mutant required.
[learner_tests]
rung      = 4
path      = "python/tests/l3-4-bi"
threshold = 0.80
required_mutants = ["s01", "s02", "s03", "s04", "s05", "s06"]
time_budget_s = 30
