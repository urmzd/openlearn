id        = "ag.08"
title     = "Context assembly, citations, search_docs tool"
kind      = "build"
lang      = ["go"]
pass      = 10
chapter   = "content/tracks/ai-platform-engineering/07-retrieval-and-rag/08-context-assembly.md"
# The Go API of go/agent/rag/assemble is fixed by the chapter's section 4 and
# the course tests (no contracts/go file, K01; DEVIATIONS B122-01).
# Citations name chunk_ids that resolve in docs.jsonl (formats/rag-index.md).
contract  = []
# ag.07: Hit, Retriever, Filter, Chunk; ag.02: search_docs is a tool.Tool
# registered in the agent's tool.Registry (the catalog lists ag.08 among
# ag.02's call sites).
deps      = ["ag.07", "ag.02"]
reading   = ["content/tracks/ai-platform-engineering/07-retrieval-and-rag"]
# ag.10's citation scorer reads the [n] markers back with ParseCitations and
# Resolve. The catalog's "ag.03 toolset" is the agent's composition root
# (an entry point, D16), not a module (DEVIATIONS B122-03).
used_by   = ["ag.10"]
units     = [
  "go/agent/rag/assemble/assemble.go",
  "go/agent/rag/assemble/cite.go",
  "go/agent/rag/assemble/tool.go",
]
upgrades  = []
milestone = "MS-agent"
ci        = "pr"

[tests]
dir       = "course/tests/go/ag_08/"
smoke     = ["TestHandExample", "TestBudgetNeverExceeded", "TestSearchDocsTool"]
timeout_s = 120
determinism_runs = 2

[fixtures]
# ag.07's fixture index: the citations of real searches must resolve in it.
files = [
  "course/fixtures/ag.07/index/meta.json",
  "course/fixtures/ag.07/index/docs.jsonl",
  "course/fixtures/ag.07/index/vectors.f32",
  "course/fixtures/ag.07/index/bm25.idx",
]
