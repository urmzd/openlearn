# gqa.py: L7.3's rope_cos_sin, apply_rope, RopeSpec; L0.4's Linear and
# Module; L0.2's ops (matmul, masked_fill, softmax, concat) on L0.1's Tensor;
# M06.3's PCG32 for the default rng. The course tests check the bytes handed
# to the cache hook against M05.1's kv_bytes_per_token.
deps      = ["L0.1", "L0.2", "L0.4", "M06.3", "L7.3", "M05.1"]
# Concepts only: the masked softmax (M09.2). L5.1's scaled dot-product
# attention is the catalog prerequisite; gqa.py computes its own scores
# (the sink column has no slot in L5.1's contract, DEVIATIONS B74-04).
reading   = ["M09.2", "L5.1"]
# L7.7 builds its sliding-window and sink attention on GQAttention; L7.9
# uses it in every Llama layer (SmolLM2: 9 q / 3 kv heads); L8.2's KVCache
# implements the hook. L9.3/L9.4 (Hkv) join with their rows.
used_by   = ["L7.7", "L7.9", "L8.2"]
units     = ["python/tinyllm/modern/gqa.py"]
