id        = "L14.2"
title     = "Whisper encoder: conv stem, sinusoids, pre-LN blocks"
kind      = "build"
lang      = ["python"]
pass      = 12
chapter   = "ml/08-tinyllm/p14-speech/02-whisper-encoder.md"
contract  = ["contracts/py/tinyllm/speech/encoder.pyi"]
# Conv1d for the stem (L13.1), conv_out_size for the length check (M12.1),
# MultiHeadAttention as the base of WhisperAttention (L5.3), Linear,
# LayerNorm, ModuleList, Module (L0.4), gelu and transpose (L0.2), Tensor
# (L0.1), PCG32 for the default init stream (M06.3).
deps      = ["L13.1", "M12.1", "L5.3", "L0.4", "L0.2", "L0.1", "M06.3"]
# L5.1's attention runs inside L5.3; L5.4's interleaved sinusoids are the
# contrast for Whisper's concatenated ones. The encoder reads L14.1's
# features but calls none of its code (L14.4's transcribe is L14.1's caller).
reading   = ["L5.1", "L5.4", "L14.1"]
# Call sites (DESIGN 4.1): L14.3 composes the encoder into Whisper; the
# Rust encoder of L15.6 is proven against its fixtures (not registered yet).
used_by = ["L14.3"]
units     = ["python/tinyllm/speech/encoder.py"]
upgrades  = []
milestone = "MS-L14"
ci        = "pr"

[tests]
dir       = "course/tests/L14.2"
smoke     = ["test_hand_example_sinusoids", "test_stem_output_length"]
timeout_s = 180
determinism_runs = 2

[fixtures]
files = [
  "course/fixtures/L14.2/encoder_hf.npz",
  "course/fixtures/L14.2/tiny-whisper/config.json",
  "course/fixtures/L14.2/tiny-whisper-128/config.json",
]
