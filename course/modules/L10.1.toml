id        = "L10.1"
title     = "Candle model runner (Llama + bigram, int4), Rust KV cache, sampler and PCG32"
kind      = "build"
lang      = ["rust"]
pass      = 7
chapter   = "content/courses/build-an-llm/p10-serving/01-model-runner-and-sampler.md"
# No Rust trait contract yet (K01): formats/safetensors.md,
# spec/sampling.md, and spec/pcg32.md are linked from the chapter card.
contract  = []
# Candle supplies tensor operations; the learner still writes the model
# layers and the Rust-owned KV cache. No C kernel or runtime module is a
# prerequisite.
deps      = ["L10.0", "L7.9", "L8.5", "M09.4"]
# Ports and formats it re-implements (never called): the Python sampler
# (L8.1) and PCG32 (M06.3), the Llama model (L7.9), the int4 format (L8.5),
# the f16 conversions (M09.4); L1.5's tokenizer is called by tl-serve
# (L10.5), not here.
reading   = ["lang.04", "L8.1", "M06.3", "L1.5"]
used_by   = ["L10.2", "L10.3", "L10.4", "L10.5", "L10.6", "L10.8", "L10.9"]
# The tl-engine crate root (L8.4's glue) declares engine modules (2.15, Q7).
# Model math uses Candle; `kv.rs` owns the Rust KV cache.
units     = [
  "rust/crates/tl-engine/src/kv.rs",
  "rust/crates/tl-engine/src/quant.rs",
  "rust/crates/tl-engine/src/model.rs",
  "rust/crates/tl-engine/src/forward.rs",
  "rust/crates/tl-engine/src/runner.rs",
  "rust/crates/tl-engine/src/sample.rs",
]
upgrades  = []
milestone = "MS-L10"
ci        = "pr"

[tests]
dir       = "course/tests/rust/l10_1.rs"
smoke     = ["hand_example_sampling", "pcg32_reference_vectors", "tiny_llama_logits_match_hf", "bigram_checkpoint_still_serves"]
timeout_s = 120
determinism_runs = 2

[fixtures]                          # read from L8.1's and L7.9's fixtures
files = [
  "course/fixtures/L8.1/sampler_golden.json",
  "course/fixtures/L7.9/tiny-llama-2l/config.json",
  "course/fixtures/L7.9/tiny-llama-2l/model.safetensors",
  "course/fixtures/L7.9/tiny_logits.json",
  "course/fixtures/L7.9/tiny_greedy_32.json",
]
