id        = "L8.2"
title     = "KV cache, incremental decode, incremental UTF-8 detokenizer, generate"
kind      = "build"
lang      = ["python"]
pass      = 6
chapter   = "content/courses/build-an-llm/p08-inference/02-kv-cache-and-generate.md"
contract  = ["contracts/py/tinyllm/infer/kvcache.pyi", "contracts/py/tinyllm/infer/generate.pyi"]
# kvcache.py: L5.2's causal_mask with q_offset is the decode mask. generate.py:
# L8.1's sample, request_rng, and sampled_entropy every step. The course tests
# generate with L7.9's LlamaForCausalLM (cache vs recompute), run L7.5's
# GQAttention (with L7.3's RopeSpec, on L0.1 Tensors) through the cache, and
# train L1.2's byte-level BPE as the tokenizer the detokenizer streams.
deps      = ["L8.1", "L5.2", "L1.2", "L7.9", "L7.5", "L7.3", "L0.1"]
# KV bytes per token (M05.1) motivate the float16 cache; no code called.
reading   = ["M05.1"]
# Call site: L8.6 (rolls the cache back with truncate). The optional L8.3
# paged cache also generates through generate, but side quests are not call
# sites (DEVIATIONS B81-03).
used_by = ["L8.6", "L14.3"]
units     = ["python/tinyllm/infer/kvcache.py", "python/tinyllm/infer/generate.py"]
upgrades  = []
milestone = "MS-L8"
ci        = "pr"

[tests]
dir       = "course/tests/L8.2"
smoke     = ["test_hand_example", "test_hand_example_detokenizer", "test_cached_logits_equal_full_recompute"]
timeout_s = 60
determinism_runs = 2

[learner_tests]
rung      = 5
path      = "python/tests/l8-2-generate"
threshold = 0.80
required_mutants = ["s01", "s02", "s03", "s04", "s05", "s06", "s07", "s08", "s09", "s10", "s11", "s12", "s13", "s14", "s15", "s16", "s17", "s18", "s19", "s20", "s21", "s22", "s24"]
time_budget_s = 30
