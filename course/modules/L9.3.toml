# windowed_attention and L5.1's sdpa_forward.
deps      = ["rt.02", "rt.03", "M09.6", "L9.2", "L7.7", "L5.1"]
reading   = ["L5.2", "L7.5"]   # mask flags and GQA head sharing, as concepts
# L9.4 compares paged attention with this kernel; no production Rust call site.
used_by   = ["L9.4"]
units     = ["c/src/kernels/flash_attn.c"]
upgrades  = []
milestone = "MS-L9"
ci        = "pr"

[tests]
