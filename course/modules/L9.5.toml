id        = "L9.5"
title     = "Fused int4 and int8 dequantize-matmul in C"
kind      = "side"
lang      = ["c"]
pass      = 6
chapter   = "ml/08-tinyllm/p09-kernels/08-fused-quantized-matmul.md"
contract  = ["contracts/c/include/tinyllm/qmatmul.h"]
# qmatmul.c: M09.4's Python-written f16 scale fixture and
# rt.03's tl_parallel_for (with a pool). The C tests build their float32
# baseline with L9.1's tl_matmul_f32 and encode scales with M09.4's
# tl_f32_to_f16; Python-generated fixture files provide the numerical oracle, and
# quantize with L8.5's quantize_int4_group and quantize_int8_per_channel
# (the parity suite quant.int4 ties the byte layout to L8.5 as well).
deps      = ["rt.03", "M09.7", "L9.1", "L8.5", "rt.02"]
reading   = ["M09.3"]
# Standalone C exercise; the Rust engine does not link this kernel.
used_by   = []
units     = ["c/src/kernels/qmatmul.c"]
upgrades  = []
milestone = "MS-L9"
ci        = "pr"

[tests]
dir       = "course/tests/L9.5"
smoke     = ["hand_example"]
timeout_s = 60
determinism_runs = 2

