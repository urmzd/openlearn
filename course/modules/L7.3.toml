id        = "L7.3"
title     = "RoPE (half and interleaved layouts, partial rotary)"
kind      = "build"
lang      = ["python"]
pass      = 5
chapter   = "ml/08-tinyllm/p07-modern-block/03-rope.md"
contract  = ["contracts/py/tinyllm/modern/rope.pyi"]
# rope.py: L0.2's ops (concat, stack, reshape) on L0.1's Tensor and its
# indexing. The course tests compare the interleaved layout with M00.2's
# rotate_pairs (a differential test).
deps      = ["L0.1", "L0.2", "M00.2"]
# Concept only: the frequency ladder base^(-2i/d) (M00.3); rope.py takes
# inv_freq as an argument and L7.4 computes it.
reading   = ["M00.3"]
# L7.5 rotates its queries and keys with rope_cos_sin and apply_rope and
# takes a RopeSpec; L7.6 (MLA's decoupled rope key) and L7.7 (windowed
# attention) call them too, and L7.9 builds the spec of every Llama layer.
# L8.2 decodes at absolute positions with it; L9.6 joins with its row.
used_by   = ["L7.5", "L7.6", "L7.7", "L7.9", "L8.2", "L13.2", "L13.3"]
units     = ["python/tinyllm/modern/rope.py"]
upgrades  = []
milestone = "MS-L7"
ci        = "pr"

[tests]
dir       = "course/tests/L7.3"
smoke     = ["test_hand_example", "test_layouts_are_a_permutation_of_each_other"]
timeout_s = 60
determinism_runs = 2

[fixtures]
files = ["course/fixtures/L7.3/rope_hf.npz"]

[learner_tests]
rung      = 5
path      = "python/tests/l7-3-rope"
