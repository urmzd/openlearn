# paged_attn.c: rt.04's pool (tl_kv_pool_cfg,
# tl_kv_block_ptr), M09.4's tl_f16_to_f32, M09.6's tl_expf, rt.03's
# tl_parallel_for. The C tests build a pool with rt.04, compare with a naive
# oracle on L9.2's tl_softmax_f32 and, bitwise, with L9.3's FlashAttention;
# the Python tests write through L8.3's PagedKVCache and compare with
# L7.7's windowed_attention.
deps      = ["rt.03", "rt.04", "M09.7", "M09.6", "L9.2", "L9.3", "L7.7", "rt.02"]
reading   = ["L7.5"]   # GQA head sharing, as a concept
# Call sites: L10.1 (decode) and L10.2 (batched decode) join used_by when
# they list L9.4 in deps (B9, DEVIATIONS B84-01).
used_by   = []
units     = ["c/src/kernels/paged_attn.c"]
upgrades  = []
milestone = "MS-L9"
ci        = "pr"

[tests]
