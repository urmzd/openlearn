// contracts/proto/tl/raft/v1/raft.proto: Raft between durable server
// chapter: content/tracks/ai-platform-engineering/05-durable-orchestration-and-workers/10-raft-ha.md
// replicas (optional dur.10; DESIGN 2.7). Served on :7234 in Kubernetes.
// The messages are those of figure 2 (RequestVote, AppendEntries) and
// figure 13 (InstallSnapshot) of Ongaro and Ousterhout, "In Search of an
// Understandable Consensus Algorithm" (2014). Each log entry carries exactly
// one framed WAL record (formats/wal.md), so Raft replicates the bytes the
// single-node server writes.
//
// Peers are numbered by [durable].raft.id (1-based). A follower answers a
// client rpc of tl.durable.v1 with UNAVAILABLE and the gRPC trailer
// `tl-raft-leader: <host:port>` naming the leader it knows, or no trailer
// during an election.
//
// modules: dur.10 (optional), ops.12 (optional drill)
syntax = "proto3";

package tl.raft.v1;

option go_package = "openlearn.urmzd.com/tl/contracts/gen/tl/raft/v1;raftv1";

service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

message Entry {
  uint64 index = 1;             // 1-based log index
  uint64 term = 2;
  bytes data = 3;               // one framed WAL record: u32 len, u32 crc32c, u64 seq, WalRecord payload
}

message RequestVoteRequest {
  uint64 term = 1;
  uint64 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated Entry entries = 5;   // empty for a heartbeat; total size <= 4 MiB
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  // On success: the index of the last entry the follower now matches.
  // On a log mismatch: the follower's hint for the next prev_log_index to try
  // (the first index of the conflicting term, or its last index + 1). The
  // leader may ignore it and step back one entry at a time.
  uint64 match_index = 3;
  uint64 conflict_index = 4;
}

message InstallSnapshotRequest {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  uint64 offset = 5;            // byte offset of data in the snapshot
  bytes data = 6;               // a chunk, <= 4 MiB
  bool done = 7;                // true on the last chunk
}

message InstallSnapshotResponse {
  uint64 term = 1;
}
