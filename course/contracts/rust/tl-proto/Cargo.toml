# contracts/rust/tl-proto: prost and tonic output for proto/tl/*/v1,
# committed with no build.rs, so building the solution never runs protoc.
# The solution's crates depend on it by path:
#   tl-proto = { path = "../../../contracts/rust/tl-proto" }
# Regenerated by maintainers from the .proto files with prost and tonic.
[package]
name = "tl-proto"
version = "0.2.0"
edition = "2021"
publish = false
description = "Generated gRPC types and services of the tinyllm contracts"

[lib]
path = "src/lib.rs"

[dependencies]
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
