# sr configuration
# Reference: https://github.com/urmzd/sr#configuration

git:
  tag_prefix: v
  floating_tag: true

commit:
  types:
    minor:
      - feat
    patch:
      - fix
      - perf
      - refactor
    none:
      - docs
      - revert
      - chore
      - ci
      - test
      - build
      - style

changelog:
  file: CHANGELOG.md
  groups:
    - name: breaking
      content:
        - breaking
    - name: features
      content:
        - feat
    - name: bug-fixes
      content:
        - fix
    - name: performance
      content:
        - perf
    - name: refactoring
      content:
        - refactor
    - name: misc
      content:
        - docs
        - revert
        - chore
        - ci
        - test
        - build
        - style

channels:
  default: stable
  branch: main
  content:
    - name: stable

packages:
  - path: .
    version_files:
      - pyproject.toml
    # Keep uv.lock's project version in sync with the pyproject bump so it
    # doesn't drift after each release (which fails the next CI uv sync).
    stage_files:
      - uv.lock
    # Each course PDF and portable pack is built by CI's "Book PDF"
    # job and downloaded into outputs/ by the release workflow before sr runs.
    # Each declared artifact must exist on disk before a tag is created.
    artifacts:
      - outputs/openlearn-mathematics.pdf
      - outputs/openlearn-mathematics.zip
      - outputs/openlearn-programming-and-algorithms.pdf
      - outputs/openlearn-programming-and-algorithms.zip
      - outputs/openlearn-software-engineering.pdf
      - outputs/openlearn-software-engineering.zip
      - outputs/openlearn-data-engineering.pdf
      - outputs/openlearn-data-engineering.zip
      - outputs/openlearn-ai-engineering.pdf
      - outputs/openlearn-ai-engineering.zip
      - outputs/openlearn-systems.pdf
      - outputs/openlearn-systems.zip
      - outputs/openlearn-field-engineering.pdf
      - outputs/openlearn-field-engineering.zip
      - outputs/openlearn-interview-preparation.pdf
      - outputs/openlearn-interview-preparation.zip
      - outputs/openlearn-computer-science.pdf
      - outputs/openlearn-computer-science.zip
      - outputs/openlearn-research.pdf
      - outputs/openlearn-research.zip
