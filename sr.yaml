# sr configuration
# Reference: https://github.com/urmzd/sr#configuration

git:
  tag_prefix: v
  floating_tag: true

commit:
  types:
    minor:
      - feat
    patch:
      - fix
      - perf
      - refactor
    none:
      - docs
      - revert
      - chore
      - ci
      - test
      - build
      - style

changelog:
  file: CHANGELOG.md
  groups:
    - name: breaking
      content:
        - breaking
    - name: features
      content:
        - feat
    - name: bug-fixes
      content:
        - fix
    - name: performance
      content:
        - perf
    - name: refactoring
      content:
        - refactor
    - name: misc
      content:
        - docs
        - revert
        - chore
        - ci
        - test
        - build
        - style

channels:
  default: stable
  branch: main
  content:
    - name: stable

packages:
  - path: .
    version_files:
      - pyproject.toml
    # Keep uv.lock's project version in sync with the pyproject bump so it
    # doesn't drift after each release (which fails the next CI uv sync).
    stage_files:
      - uv.lock
    # The curriculum and every course/role path PDF are built by CI's "Book PDF"
    # job and downloaded into outputs/ by the release workflow before sr runs.
    # Each declared artifact must exist on disk before a tag is created.
    artifacts:
      - outputs/supersource-curriculum.pdf
      - outputs/supersource-course-p00-setup.pdf
      - outputs/supersource-course-p01-tracer.pdf
      - outputs/supersource-course-p02-foundations.pdf
      - outputs/supersource-course-p03-tokens-and-data.pdf
      - outputs/supersource-course-p04-sequence-models.pdf
      - outputs/supersource-course-p05-transformer.pdf
      - outputs/supersource-course-p06-inference-and-kernels.pdf
      - outputs/supersource-course-p07-serving-platform.pdf
      - outputs/supersource-course-p08-durable.pdf
      - outputs/supersource-course-p09-capstone-training.pdf
      - outputs/supersource-course-p10-agents.pdf
      - outputs/supersource-course-p11-operate.pdf
      - outputs/supersource-course-p12-multimodal.pdf
      # The desktop app, built per platform by the release workflow's app job.
      - outputs/openlearn-darwin-arm64.zip
      - outputs/openlearn-darwin-amd64.zip
      - outputs/openlearn-windows-amd64.zip
      - outputs/openlearn-linux-amd64.tar.gz
