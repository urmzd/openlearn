# sr configuration
# Reference: https://github.com/urmzd/sr#configuration

git:
  tag_prefix: v
  floating_tag: true

commit:
  types:
    minor:
      - feat
    patch:
      - fix
      - perf
      - refactor
    none:
      - docs
      - revert
      - chore
      - ci
      - test
      - build
      - style

changelog:
  file: CHANGELOG.md
  groups:
    - name: breaking
      content:
        - breaking
    - name: features
      content:
        - feat
    - name: bug-fixes
      content:
        - fix
    - name: performance
      content:
        - perf
    - name: refactoring
      content:
        - refactor
    - name: misc
      content:
        - docs
        - revert
        - chore
        - ci
        - test
        - build
        - style

channels:
  default: stable
  branch: main
  content:
    - name: stable

packages:
  - path: .
    version_files:
      - pyproject.toml
    # Keep uv.lock's project version in sync with the pyproject bump so it
    # doesn't drift after each release (which fails the next CI uv sync).
    stage_files:
      - uv.lock
    # Each course PDF and portable pack is built by CI's "Book PDF"
    # job and downloaded into outputs/ by the release workflow before sr runs.
    # Each declared artifact must exist on disk before a tag is created.
    artifacts:
      - outputs/openlearn-ai-platform-engineering.pdf
      - outputs/openlearn-ai-platform-engineering.zip
      - outputs/openlearn-algorithms.pdf
      - outputs/openlearn-algorithms.zip
      - outputs/openlearn-build-an-llm.pdf
      - outputs/openlearn-build-an-llm.zip
      - outputs/openlearn-case-studies.pdf
      - outputs/openlearn-case-studies.zip
      - outputs/openlearn-competitive-programming.pdf
      - outputs/openlearn-competitive-programming.zip
      - outputs/openlearn-computer-science.pdf
      - outputs/openlearn-computer-science.zip
      - outputs/openlearn-data-engineering.pdf
      - outputs/openlearn-data-engineering.zip
      - outputs/openlearn-diagramming.pdf
      - outputs/openlearn-diagramming.zip
      - outputs/openlearn-field-engineering.pdf
      - outputs/openlearn-field-engineering.zip
      - outputs/openlearn-infrastructure.pdf
      - outputs/openlearn-infrastructure.zip
      - outputs/openlearn-interview-preparation.pdf
      - outputs/openlearn-interview-preparation.zip
      - outputs/openlearn-machine-learning.pdf
      - outputs/openlearn-machine-learning.zip
      - outputs/openlearn-mathematics.pdf
      - outputs/openlearn-mathematics.zip
      - outputs/openlearn-programming-languages.pdf
      - outputs/openlearn-programming-languages.zip
      - outputs/openlearn-research.pdf
      - outputs/openlearn-research.zip
      - outputs/openlearn-responsible-ai.pdf
      - outputs/openlearn-responsible-ai.zip
      - outputs/openlearn-software-craftsmanship.pdf
      - outputs/openlearn-software-craftsmanship.zip
      - outputs/openlearn-systems.pdf
      - outputs/openlearn-systems.zip
