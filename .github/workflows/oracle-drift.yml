name: Oracle fixture drift

on:
  schedule:
    - cron: "31 5 * * 1"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Generate missing recorded trace fixtures (existing values still checked)
        type: boolean
        default: false
      scope:
        description: Oracle validation scope
        type: choice
        default: all
        options: [all, whisper, whisper-real, whisper-traces, asr-assets, asr-accuracy, mls-languages]

permissions:
  contents: read

concurrency:
  group: oracle-drift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  oracle-drift:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
    name: Regenerate and compare oracle fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: course/ref/go/go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        run: uv python install
      - name: Install harness dependencies
        run: uv sync --project course/harness
      - name: Check deterministic oracle fixtures
        run: |
          set -euo pipefail
          uv run --project course/harness python course/oracle/MS-L1/synth_corpus.py --check
          uv run --project course/harness python course/oracle/data.02/golden_corpus.py --check
          uv run --script course/oracle/contracts/pcg32_vectors.py --check
          uv run --script course/oracle/M06.3/vectors.py --check
          uv run --project course/harness python course/oracle/L8.4/radix_trace.py --check
          uv run --project course/harness python course/oracle/ds.08/bloom_golden.py --check
          uv run --project course/harness python course/oracle/parity/kv_wire_v1_golden.py --check
          uv run --project course/harness python course/oracle/solve/sync_chapters.py --check
          uv run --python 3.12 --script course/oracle/L13.6/decode_pil.py --check
          uv run --python 3.12 --script course/oracle/L13.6/preprocess_hf.py --check
      - name: Compare parity goldens within declared tolerances
        run: practice/bin/ol parity --ref

  whisper-oracle:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'whisper'
    name: Independent Whisper decoder oracle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install CPU oracle dependencies
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/whisper-oracle"
          uv pip install --python "$RUNNER_TEMP/whisper-oracle/bin/python" torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python "$RUNNER_TEMP/whisper-oracle/bin/python" transformers==5.19.0 numpy==2.5.4 tokenizers==0.23.3
      - name: Generate independent decoder values
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.scope }}" != whisper ] || [ -f course/fixtures/L14.3/decoder_hf.npz ]; then args+=(--check); fi
          "$RUNNER_TEMP/whisper-oracle/bin/python" course/oracle/L14.3/decoder_hf.py "${args[@]}" | tee "$RUNNER_TEMP/whisper-manifest-row.tsv"
      - name: Generate independent decoding policy values
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.scope }}" != whisper ] || [ -f course/fixtures/L14.4/decode_openai.json ]; then args+=(--check); fi
          "$RUNNER_TEMP/whisper-oracle/bin/python" course/oracle/L14.4/decode_openai.py "${args[@]}" | tee "$RUNNER_TEMP/whisper-policy-manifest-row.tsv"
      - name: Generate independent tokenizer values
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.scope }}" != whisper ] || [ -f course/fixtures/L14.4/tokenizer_hf.json ]; then args+=(--check); fi
          "$RUNNER_TEMP/whisper-oracle/bin/python" course/oracle/L14.4/tokenizer_hf.py "${args[@]}" | tee "$RUNNER_TEMP/whisper-tokenizer-manifest-row.tsv"
      - name: Generate independent long-form policy values
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.scope }}" != whisper ] || [ -f course/fixtures/L14.4/transcribe_openai.json ]; then args+=(--check); fi
          "$RUNNER_TEMP/whisper-oracle/bin/python" course/oracle/L14.4/transcribe_openai.py "${args[@]}" | tee "$RUNNER_TEMP/whisper-longform-manifest-row.tsv"
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-decoder-oracle
          path: |
            course/fixtures/L14.3/decoder_hf.npz
            course/fixtures/L14.4/decode_openai.json
            course/fixtures/L14.4/tokenizer_hf.json
            course/fixtures/L14.4/transcribe_openai.json
            ${{ runner.temp }}/whisper-longform-manifest-row.tsv
            course/fixtures/L14.4/whisper-tokenizer/tokenizer.json
            ${{ runner.temp }}/whisper-tokenizer-manifest-row.tsv
            ${{ runner.temp }}/whisper-policy-manifest-row.tsv
            ${{ runner.temp }}/whisper-manifest-row.tsv
          if-no-files-found: error

  whisper-real:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'whisper-real'
    uses: ./.github/workflows/whisper-real.yml

  whisper-traces:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'whisper-traces'
    name: Independent recorded Whisper search
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install pinned CPU oracle
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/whisper-traces"
          uv pip install --python "$RUNNER_TEMP/whisper-traces/bin/python" torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python "$RUNNER_TEMP/whisper-traces/bin/python" numpy==2.5.4 tokenizers==0.23.3
      - name: Generate independent greedy and beam traces
        run: '"$RUNNER_TEMP/whisper-traces/bin/python" course/oracle/MS-L14/recorded_decode.py --check ${{ inputs.bootstrap && ''--bootstrap-missing'' || '''' }}'
      - name: Compare learner CLI outputs
        env:
          PYTHONPATH: ${{ github.workspace }}/course/ref/python
        run: '"$RUNNER_TEMP/whisper-traces/bin/python" course/oracle/MS-L14/verify_recorded.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whisper-recorded-traces
          path: course/fixtures/MS-L14/
          if-no-files-found: error

  asr-assets:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'asr-assets'
    name: Deterministic licensed ASR assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Build twice and compare asset fingerprints
        run: |
          set -euo pipefail
          uv run --script course/oracle/MS-L14/build_asr_mini.py "$RUNNER_TEMP/asr-a" > "$RUNNER_TEMP/asr-assets.tsv"
          uv run --script course/oracle/MS-L14/build_asr_mini.py "$RUNNER_TEMP/asr-b" > "$RUNNER_TEMP/asr-assets-repeat.tsv"
          diff -u "$RUNNER_TEMP/asr-assets.tsv" "$RUNNER_TEMP/asr-assets-repeat.tsv"
          python course/oracle/MS-L14/verify_asr_assets.py "$RUNNER_TEMP/asr-a"
      - uses: actions/upload-artifact@v4
        with:
          name: asr-asset-fingerprints
          path: |
            ${{ runner.temp }}/asr-assets.tsv
            ${{ runner.temp }}/asr-a/attribution.json
          if-no-files-found: error

  asr-accuracy:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'asr-accuracy'
    name: Real speech accuracy and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install pinned independent oracle
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/asr-env"
          uv pip install --python "$RUNNER_TEMP/asr-env/bin/python" torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python "$RUNNER_TEMP/asr-env/bin/python" numpy==2.5.4 soundfile==0.13.1 transformers==5.19.0 tokenizers==0.23.3 "openai-whisper @ git+https://github.com/openai/whisper.git@86098128c0b4f24f0e2aa2994de830614b474227"
      - name: Build licensed real speech corpus
        run: |
          "$RUNNER_TEMP/asr-env/bin/python" course/oracle/MS-L14/build_asr_mini.py "$RUNNER_TEMP/asr-mini" > "$RUNNER_TEMP/asr-assets.tsv"
          python course/oracle/MS-L14/verify_asr_assets.py "$RUNNER_TEMP/asr-mini"
      - name: Generate independent corpus and long-form accuracy oracle
        run: |
          "$RUNNER_TEMP/asr-env/bin/python" course/oracle/MS-L14/accuracy_openai.py --data "$RUNNER_TEMP/asr-mini" --model-cache "$RUNNER_TEMP/openai-model" --out "$RUNNER_TEMP/asr-oracle.json"
      - name: Fetch verified learner checkpoint
        run: |
          "$RUNNER_TEMP/asr-env/bin/python" -c 'import sys; from pathlib import Path; sys.path.insert(0, "course/oracle/MS-L14"); from whisper_real_hf import checkpoint; checkpoint(Path(sys.argv[1]))' "$RUNNER_TEMP/whisper-tiny"
      - name: Compare learner accuracy and record runtime
        env:
          PYTHONPATH: ${{ github.workspace }}/course/ref/python
        run: |
          "$RUNNER_TEMP/asr-env/bin/python" course/oracle/MS-L14/verify_languages.py --model-dir "$RUNNER_TEMP/whisper-tiny"
          "$RUNNER_TEMP/asr-env/bin/python" course/oracle/MS-L14/verify_accuracy.py --data "$RUNNER_TEMP/asr-mini" --model-dir "$RUNNER_TEMP/whisper-tiny" --oracle "$RUNNER_TEMP/asr-oracle.json" --out "$RUNNER_TEMP/asr-learner.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asr-accuracy-results
          path: |
            ${{ runner.temp }}/asr-oracle.json
            ${{ runner.temp }}/asr-learner*.json
            ${{ runner.temp }}/asr-assets.tsv
            ${{ runner.temp }}/asr-mini/attribution.json
          if-no-files-found: error

  mls-languages:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'mls-languages'
    name: Licensed MLS language excerpts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Extract bounded official MLS excerpts
        run: uv run --script course/oracle/MS-L14/mls_languages.py "$RUNNER_TEMP/mls-languages"
      - uses: actions/upload-artifact@v4
        with:
          name: mls-languages
          path: ${{ runner.temp }}/mls-languages
          if-no-files-found: error
