name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Plan first, so the desktop bundles are only built when a release will
  # actually be cut, and exist before it is: GitHub rejects uploads to a release
  # that is already published.
  plan:
    environment: release
    name: Plan
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      released: ${{ steps.plan.outputs.released }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liUsXGDICnIdo3Ev
          private-key: ${{ secrets.SR_RELEASER_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: urmzd/sr@v9
        id: plan
        with:
          mode: plan
          github-token: ${{ steps.app-token.outputs.token }}

  # The desktop app (app/). Wails links against each platform's native webview,
  # so there is no cross-compilation path: every target needs its own runner.
  app:
    needs: plan
    if: needs.plan.outputs.released == 'true'
    name: App (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: darwin-arm64
            runner: macos-15
            platform: darwin/arm64
          - label: darwin-amd64
            runner: macos-15-intel
            platform: darwin/amd64
          - label: windows-amd64
            runner: windows-latest
            platform: windows/amd64
          - label: linux-amd64
            runner: ubuntu-latest
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install Linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      # The packs that ship inside the binary: this repository and languide.
      - name: Bundle the built-in course packs
        run: go run ./cmd/bundle -out internal/builtin/content .. ../packs/languide

      - name: Build the frontend
        working-directory: app/frontend
        run: npm ci && npm run build

      # -s: the frontend is already built above. -skipbindings: the generated
      # bindings are committed. Wails defaults to webkit2gtk-4.0, which Ubuntu
      # 24.04 no longer ships; the webkit2_41 tag targets the 4.1 series.
      - name: Build app (Linux)
        if: runner.os == 'Linux'
        run: wails build -s -skipbindings -tags webkit2_41 -platform ${{ matrix.platform }}

      - name: Build app
        if: runner.os != 'Linux'
        run: wails build -s -skipbindings -platform ${{ matrix.platform }}

      # macOS produces a .app bundle and Windows a bare .exe, so each platform
      # is packaged into one archive rather than uploaded as a loose binary.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cd build/bin
          if [ -d openlearn.app ]; then
            zip -qr "../../dist/openlearn-${{ matrix.label }}.zip" openlearn.app
          else
            tar -czf "../../dist/openlearn-${{ matrix.label }}.tar.gz" openlearn
          fi

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/bin/openlearn.exe -DestinationPath "dist/openlearn-${{ matrix.label }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: openlearn-app-${{ matrix.label }}
          path: app/dist/openlearn-${{ matrix.label }}.*
          retention-days: 1
          if-no-files-found: error

  release:
    environment: release
    name: Release
    needs: [plan, app]
    if: needs.plan.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liUsXGDICnIdo3Ev
          private-key: ${{ secrets.SR_RELEASER_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # The CI "Book PDF" job (run via the reusable workflow above) built the
      # curriculum and every path PDF. Place all of them on disk so sr can upload
      # the declared artifacts in sr.yaml packages[].artifacts.
      - name: Download curriculum and path PDFs
        uses: actions/download-artifact@v8
        with:
          pattern: supersource-curriculum-pdf
          path: outputs
          merge-multiple: true

      # The desktop bundles built above, into the paths sr.yaml declares.
      - name: Download desktop app bundles
        uses: actions/download-artifact@v8
        with:
          pattern: openlearn-app-*
          path: outputs
          merge-multiple: true

      - uses: urmzd/sr@v9
        id: sr
        with:
          github-token: ${{ steps.app-token.outputs.token }}

    outputs:
      released: ${{ steps.sr.outputs.released }}
      tag: ${{ steps.sr.outputs.tag }}
