name: App bundle

# Builds the desktop app (apps/desktop/) for every platform. The release workflow calls
# this; a pull request that edits this file runs it too, so a change to the
# build is proven before it can block a release.
on:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/app-bundle.yml

permissions:
  contents: read

jobs:
  # Wails links against each platform's native webview, so there is no
  # cross-compilation path: every target needs its own runner.
  bundle:
    name: App (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: darwin-arm64
            runner: macos-15
            platform: darwin/arm64
          - label: darwin-amd64
            runner: macos-15-intel
            platform: darwin/amd64
          - label: windows-amd64
            runner: windows-latest
            platform: windows/amd64
          - label: linux-amd64
            runner: ubuntu-latest
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json

      - name: Install Linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      # The packs that ship inside the binary: this repository and languide.
      - name: Bundle the built-in course packs
        env:
          PYTHONUTF8: "1"
        shell: bash
        run: |
          python3 ../../scripts/course_catalog.py export --reading-only --output "${{ runner.temp }}/course-packs"
          go run ./cmd/bundle -out internal/builtin/content "${{ runner.temp }}/course-packs"/* ../../packs/languide

      - name: Build the frontend
        working-directory: apps/desktop/frontend
        run: npm ci && npm run build

      # -s: the frontend is already built above. -skipbindings: the generated
      # bindings are committed. Wails defaults to webkit2gtk-4.0, which Ubuntu
      # 24.04 no longer ships; the webkit2_41 tag targets the 4.1 series.
      - name: Build app (Linux)
        if: runner.os == 'Linux'
        run: wails build -s -skipbindings -tags webkit2_41 -platform ${{ matrix.platform }}

      - name: Build app
        if: runner.os != 'Linux'
        run: wails build -s -skipbindings -platform ${{ matrix.platform }}

      # macOS produces a .app bundle and Windows a bare .exe, so each platform
      # is packaged into one archive rather than uploaded as a loose binary.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cd build/bin
          if [ -d openlearn.app ]; then
            zip -qr "../../dist/openlearn-${{ matrix.label }}.zip" openlearn.app
          else
            tar -czf "../../dist/openlearn-${{ matrix.label }}.tar.gz" openlearn
          fi

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/bin/openlearn.exe -DestinationPath "dist/openlearn-${{ matrix.label }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: openlearn-app-${{ matrix.label }}
          path: apps/desktop/dist/openlearn-${{ matrix.label }}.*
          retention-days: 1
          if-no-files-found: error
