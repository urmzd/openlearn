name: Real Whisper parity

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whisper-real:
    name: Real Whisper timestamp oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install pinned CPU oracle
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/whisper-real"
          uv pip install --python "$RUNNER_TEMP/whisper-real/bin/python" torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python "$RUNNER_TEMP/whisper-real/bin/python" transformers==5.19.0 numpy==2.5.4 tokenizers==0.23.3
      - name: Generate real-checkpoint timestamp oracle
        run: |
          "$RUNNER_TEMP/whisper-real/bin/python" course/oracle/MS-L14/whisper_real_hf.py --model-dir "$RUNNER_TEMP/whisper-tiny" --out "$RUNNER_TEMP/whisper-real.json" --check
      - name: Compare learner real-WAV timestamp tokens
        env:
          PYTHONPATH: ${{ github.workspace }}/course/ref/python
        run: |
          "$RUNNER_TEMP/whisper-real/bin/python" course/oracle/MS-L14/verify_learner.py --model-dir "$RUNNER_TEMP/whisper-tiny" --oracle course/fixtures/whisper-parity/greedy_timestamps.json
      - name: Check MLS language detection
        env:
          PYTHONPATH: ${{ github.workspace }}/course/ref/python
        run: |
          "$RUNNER_TEMP/whisper-real/bin/python" course/oracle/MS-L14/verify_languages.py --model-dir "$RUNNER_TEMP/whisper-tiny"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whisper-real-oracle
          path: ${{ runner.temp }}/whisper-real.json
          if-no-files-found: error
