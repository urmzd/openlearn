name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # check_diagrams.sh compares commit times of each .d2 and its .svg.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linter
        run: uv run ruff check .

      - name: Check rendered diagrams are current
        run: scripts/check_diagrams.sh

      - name: Check relative Markdown links
        run: python3 scripts/check_links.py

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest || echo "No tests found, skipping"
        continue-on-error: true

      # Each case study is a self-contained, dependency-free implementation that
      # runs its own assertions. Not continue-on-error: these must actually pass.
      - name: Verify course publication
        run: uv run pytest scripts/tests

      - name: Verify case-study implementations
        run: |
          set -euo pipefail
          for file in content/case-studies/*/*.py; do
            echo "--- $file"
            (cd "$(dirname "$file")" && uv run --no-project python "$(basename "$file")" >/dev/null)
          done

  pwa:
    name: Learning PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build an independent course
        run: OPENLEARN_COURSE=diagramming pnpm build
      - name: Verify independent PWA
        run: node --test tests/build.test.mjs
      - name: Build the catalogue
        run: pnpm build
      - name: Verify catalogue PWA
        run: node --test tests/build.test.mjs

  book:
    name: Book PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pandoc, LaTeX, fonts, SVG support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            lmodern \
            fonts-dejavu \
            fonts-dejavu-extra \
            librsvg2-bin

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Set up Chrome for Mermaid rendering
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install mermaid-filter
        # mermaid-filter renders Mermaid fences via puppeteer; we point it at the
        # Chrome above (so we skip puppeteer's bundled-Chromium download). If it
        # still can't launch, build-book.sh falls back to code blocks.
        run: npm install -g mermaid-filter
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

      - name: Validate course definitions
        run: python3 scripts/course_catalog.py validate

      - name: Build one PDF and portable pack per course
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          while IFS= read -r course; do
            ./scripts/build-book.sh --course "$course" --manifest "outputs/build-manifest-$course.json"
          done < <(python3 scripts/course_catalog.py list)
          python3 scripts/course_catalog.py export --output outputs/packs --zip
          cp outputs/packs/*.zip outputs/
          while IFS= read -r artifact; do
            [[ "$artifact" == outputs/openlearn-*.pdf || "$artifact" == outputs/openlearn-*.zip ]] || continue
            test -s "$artifact"
          done < <(sed -n '/^    artifacts:/,/^[^ ]/s/^      - //p' sr.yaml)

      - name: Upload course publications
        uses: actions/upload-artifact@v7
        with:
          name: openlearn-courses
          path: |
            outputs/openlearn-*.pdf
            outputs/openlearn-*.zip
            outputs/build-manifest*.json
          if-no-files-found: error
