name: Nightly course verification

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        type: choice
        required: true
        default: all
        options: [all, capstone, milestones]

permissions:
  contents: read

env:
  # Local reference services and conformance clients share this test-only key.
  TL_API_KEY: tl_ci_reference_key
  RUST_BACKTRACE: "1"

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  whisper-real:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
    uses: ./.github/workflows/whisper-real.yml

  full-verify:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
    name: Full verify / ${{ matrix.os }} / ${{ matrix.layer }} / ${{ matrix.shard }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
        layer: [math, spine, systems, operations]
        shard: [0, 1, 2, 3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0; newer archives return 404
        with:
          go-version-file: course/ref/go/go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: azure/setup-helm@v4
      # Hosted ARM macOS cannot run the nested VM required by Docker.
      - name: Set up Docker on macOS
        if: runner.os == 'macOS'
        uses: douglascamata/setup-docker-macos-action@d5ccc6aae0ce23e7700154f5e63cc53e6433ac48
      - name: Check Docker is ready
        run: docker info
      - name: Verify the layer
        run: |
          python .github/scripts/course-ci-shard.py "${{ matrix.layer }}" > "$RUNNER_TEMP/module-ids.txt"
          test -s "$RUNNER_TEMP/module-ids.txt"
          xargs practice/bin/ol verify course --nightly --shard "${{ matrix.shard }}/4" < "$RUNNER_TEMP/module-ids.txt"

  milestones-full:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'capstone'
    name: Full nightly milestones
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0; newer archives return 404
        with:
          go-version-file: course/ref/go/go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: azure/setup-helm@v4
      - name: Assemble the reference learner
        run: practice/bin/ol verify course --assemble "$GITHUB_WORKSPACE/.scratchpad/course"
      - name: Run hosted nightly milestones
        run: |
          python - <<'PY' > "$RUNNER_TEMP/milestones.txt"
          import glob, tomllib
          ids = {"MS-L3", "MS-L4", "MS-L6"}
          # MS-P9 documents full capstone training as learner-local. The
          # train-smoke job covers its self-contained CI tier separately.
          learner_local = {"MS-C1", "MS-P9"}
          for path in glob.glob("course/milestones/*.toml"):
              data = tomllib.load(open(path, "rb"))
              if data.get("ci") == "nightly" and data["id"] not in learner_local:
                  ids.add(data["id"])
          print("\n".join(sorted(ids)))
          PY
          failed=0
          while IFS= read -r id; do
            practice/bin/ol milestone "$id" --ref-deps || failed=1
          done < "$RUNNER_TEMP/milestones.txt"
          exit "$failed"
      - name: Retain milestone failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-milestone-logs
          path: .scratchpad/course/.ol/milestones
          include-hidden-files: true
          retention-days: 7

  hf-real:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
    name: Real weights and agent eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0; newer archives return 404
        with:
          go-version-file: course/ref/go/go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: azure/setup-helm@v4
      - name: Assemble the reference learner
        run: practice/bin/ol verify course --assemble "$GITHUB_WORKSPACE/.scratchpad/course"
      - name: Fetch pinned models
        run: practice/bin/ol fetch smollm2-135m smollm2-135m-instruct
      - name: Run real-weight parity, tool calls, and agent evaluation
        run: |
          practice/bin/ol milestone MS-L7 --ref-deps
          practice/bin/ol milestone MS-agent --ref-deps

  train-smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'milestones'
    name: Capstone training smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0; newer archives return 404
        with:
          go-version-file: course/ref/go/go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: azure/setup-helm@v4
      - name: Assemble the reference learner
        run: practice/bin/ol verify course --assemble "$GITHUB_WORKSPACE/.scratchpad/course"
      - name: Prepare, train, and evaluate the capstone
        run: practice/bin/ol milestone MS-C1 --smoke --ref-deps

  kind-e2e:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
    name: Kind, observability, and rotating drill
    runs-on: ubuntu-latest
    # The reference grade alone takes about 100 minutes before kind milestones.
    timeout-minutes: 180
    env:
      TL_API_KEY: tl_ci_kind_reference_key
      COURSE_ROOT: ${{ github.workspace }}/course
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0; newer archives return 404
        with:
          go-version-file: course/ref/go/go.mod
          cache: false
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Assemble and deploy the reference system
        run: practice/bin/ol verify course --assemble "$RUNNER_TEMP/forge"
      - name: Build and deploy engine, gateway, and observability
        working-directory: ${{ runner.temp }}/forge
        run: |
          set -euo pipefail
          make -C c
          uv run --quiet --project python python python/tinyllm/__main__.py \
            train bigram --data "$GITHUB_WORKSPACE/course/fixtures/MS-P1/corpus.txt" --out artifacts/models/bigram
          docker build -f deploy/docker/engine.Dockerfile -t localhost:5001/forge-engine:0.1.0 .
          docker build -f deploy/docker/gateway.Dockerfile -t localhost:5001/forge-gateway:0.1.0 .
          deploy/kind/up.sh
          docker push localhost:5001/forge-engine:0.1.0
          docker push localhost:5001/forge-gateway:0.1.0
          kubectl create namespace forge
          kubectl create namespace observability
          kubectl -n observability create secret generic grafana-admin \
            --from-literal=admin-user=admin --from-literal=admin-password="$(openssl rand -hex 16)"
          kubectl -n forge create secret generic forge-api-key --from-literal=api-key="$TL_API_KEY"
          kubectl -n forge create secret generic forge-gateway-pepper --from-literal=pepper="$(openssl rand -hex 32)"
          helm repo add kedacore https://kedacore.github.io/charts
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update
          helm dependency build deploy/keda
          helm upgrade --install keda deploy/keda -n keda --create-namespace --wait --timeout 5m
          helm dependency build deploy/observability
          helm upgrade --install observability deploy/observability -n observability --wait --timeout 5m
          kubectl -n forge apply -f deploy/observability/jaeger.yaml
          helm upgrade --install forge-engine deploy/helm/forge-engine -n forge --set image.repository=localhost:5001/forge-engine --wait --timeout 5m
          helm upgrade --install forge-gateway deploy/helm/forge-gateway -n forge --set image.repository=localhost:5001/forge-gateway --wait --timeout 5m
      - name: Run kind milestones and one rotating drill
        working-directory: ${{ runner.temp }}/forge
        run: |
          "$GITHUB_WORKSPACE/practice/bin/ol" verify course --kind
          python - <<'PY' > "$RUNNER_TEMP/drill-name"
          from datetime import date
          from pathlib import Path
          import os
          drills = sorted(p.parent.name for p in (Path(os.environ["COURSE_ROOT"]) / "drills").glob("*/drill.toml"))
          if not drills:
              raise SystemExit("no course drills found")
          print(drills[(date.today().timetuple().tm_yday - 1) % len(drills)])
          PY
          day="$(date +%j)"
          OL_COURSE_HOME="$PWD" "$GITHUB_WORKSPACE/practice/bin/ol" drill run "$(cat "$RUNNER_TEMP/drill-name")" --seed "$day" --respond --max-wait-s 900
          curl --fail --silent --show-error http://127.0.0.1:30080/healthz
          curl --fail --silent --show-error http://127.0.0.1:30090/-/healthy
      - if: failure()
        name: Cluster state on failure
        run: kubectl get all -A -o wide || true

  # Moved off PRs: about 100 minutes, too slow to gate every push.
  reference-learner-e2e:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
    name: Reference learner end to end (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0; newer archives return 404
        with:
          go-version: stable
          cache: false

      - uses: azure/setup-helm@v4

      # Mutation results are keyed by content (graded tests, the reference
      # code of the module's closure, the patch), so the last run's file
      # answers every unchanged mutant (OL_MUTATION_CACHE).
      - name: Restore the mutation cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ol-mutation
          key: ol-mutation-e2e-${{ github.run_id }}
          restore-keys: ol-mutation-

      # A learner repo assembled from course/ref + course/ref/entry: ol check
      # --all --ci, every `ci = "pr"` milestone with --smoke, ol conform on both
      # tiers, then ol export and the vendored tests natively.
      - name: Reference learner, smoke milestones, conformance, export
        env:
          OL_MUTATION_CACHE: ${{ runner.temp }}/ol-mutation/mutation.json
        run: |
          mkdir -p "$RUNNER_TEMP/ol-mutation"
          practice/bin/ol verify course --e2e

      - name: Save the mutation cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ol-mutation
          key: ol-mutation-e2e-${{ github.run_id }}
