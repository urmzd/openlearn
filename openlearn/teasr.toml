# Showcase capture. `wails dev` exposes the app to a browser at :34115 with the
# Go methods bound, so the real app is what gets photographed, not a mock.
#
# Scope note: only the progress screen is scripted. teasr's web backend cannot
# type into React-controlled inputs, and a populated board and a debrief both
# need a real model and real work, which no scene definition can script. Those
# three are captured over the Chrome DevTools Protocol at 1440x920. See
# "Capturing the showcase" in CONTRIBUTING.md.
#
# Known mismatch: teasr 0.19.2 renders at 800x600 here regardless of this
# viewport block, so re-running `make record` produces a progress image with a
# different aspect ratio to the other three and the README gallery stops lining
# up. Re-shoot it over CDP afterwards if that matters.
[viewport]
width = 1440
height = 920

[output]
dir = "./showcase"

[[output.formats]]
output_type = "png"

[server]
command = "wails dev -browser=false"
url = "http://localhost:34115"
# A cold `wails dev` compiles the Go side and installs the frontend first.
timeout = 240000

# ── Progress: the cross-session skill profile ──
[[scenes]]
type = "web"
name = "demo-progress"
uri = "/"

[[scenes.interactions]]
type = "wait"
duration = 3000
[[scenes.interactions]]
type = "click"
selector = ".setup-header button"
[[scenes.interactions]]
type = "wait"
duration = 2000
[[scenes.interactions]]
type = "snapshot"
